<style>
:root{
  --bg:#0A0A0B; --bg-alt:#101012; --card:#16161A; --card-hi:#1D1D22; --ink:#050506;
  --accent:#FF4D00; --accent-hi:#FF6A26; --accent-soft:rgba(255,77,0,.10); --accent-line:rgba(255,77,0,.28);
  --text-pri:#F6F4F1; --text-sec:rgba(246,244,241,.68); --text-ter:rgba(246,244,241,.44); --text-ghost:rgba(246,244,241,.26);
  --border:rgba(255,255,255,.08); --border-hi:rgba(255,255,255,.16);
  --ok:#34D399; --ok-soft:rgba(52,211,153,.10);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px; --r-pill:100px; --safe:clamp(18px,5vw,44px); --wrap:min(1080px,100%);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text-pri);line-height:1.6;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--accent);text-decoration:none}
::selection{background:var(--accent);color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:520px;background:radial-gradient(120% 100% at 50% 0%,rgba(255,77,0,.12) 0%,transparent 60%);pointer-events:none;z-index:0}

/* Header */
.header{position:sticky;top:0;z-index:100;background:rgba(10,10,11,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 var(--safe)}
.header-inner{display:flex;align-items:center;gap:14px;height:60px;max-width:var(--wrap);margin:0 auto}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.brand-mark{font-family:var(--mono);font-weight:800;font-size:15px;letter-spacing:-.5px;color:var(--text-pri)}
.brand-mark em{font-style:normal;color:var(--accent)}
.brand-div{width:1px;height:18px;background:var(--border-hi)}
.brand-tag{font-size:9.5px;font-weight:800;letter-spacing:2.4px;text-transform:uppercase;color:var(--text-ter);white-space:nowrap}
.header-spacer{flex:1}
.head-cta{font-size:12.5px;font-weight:700;letter-spacing:.2px;background:var(--accent);color:#fff;padding:9px 17px;border-radius:var(--r-pill);white-space:nowrap;transition:background .18s}
.head-cta:hover{background:var(--accent-hi)}
@media(max-width:560px){.head-cta{display:none}}

/* Layout */
.main{position:relative;z-index:1;padding:0 var(--safe) 40px}
.wrap{max-width:var(--wrap);margin:0 auto}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .6s cubic-bezier(.2,.7,.3,1),transform .6s cubic-bezier(.2,.7,.3,1)}
.reveal.in{opacity:1;transform:none}

.kicker{display:inline-flex;align-items:center;gap:9px;font-size:10.5px;font-weight:800;letter-spacing:3.2px;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.kicker::before{content:"";width:22px;height:2px;background:var(--accent);border-radius:2px}
.sec-h{font-size:clamp(24px,4.6vw,38px);font-weight:900;line-height:1.05;letter-spacing:-1.2px;margin-bottom:14px}
.sec-p{font-size:clamp(15.5px,2.4vw,18px);color:var(--text-sec);line-height:1.6;max-width:60ch}
.sec-p strong{color:var(--text-pri);font-weight:650}

/* Hero */
.hero{padding:clamp(48px,8vw,88px) 0 clamp(40px,6vw,64px);display:grid;grid-template-columns:1.35fr .9fr;gap:clamp(28px,4vw,52px);align-items:center}
@media(max-width:820px){.hero{grid-template-columns:1fr;gap:32px}}
.badge{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);padding:7px 15px;border-radius:var(--r-pill);margin-bottom:22px}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(255,77,0,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,0,.5)}70%{box-shadow:0 0 0 8px rgba(255,77,0,0)}100%{box-shadow:0 0 0 0 rgba(255,77,0,0)}}
.hero h1{font-size:clamp(38px,7vw,68px);font-weight:900;line-height:.98;letter-spacing:-2.4px;margin-bottom:20px}
.hero h1 .hl{color:var(--accent)}
.hero-sub{font-size:clamp(16px,2.6vw,20px);color:var(--text-sec);line-height:1.55;max-width:52ch;margin-bottom:26px}
.hero-sub strong{color:var(--text-pri);font-weight:650}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.meta-chip{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.4px;color:var(--text-sec);background:var(--card);border:1px solid var(--border);padding:8px 13px;border-radius:var(--r-sm)}
.meta-chip b{color:var(--accent)}
.cta-btn{display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:800;letter-spacing:.2px;background:var(--accent);color:#fff;padding:16px 30px;border-radius:var(--r-pill);transition:transform .16s,background .18s;box-shadow:0 12px 34px -12px rgba(255,77,0,.7)}
.cta-btn:hover{background:var(--accent-hi);transform:translateY(-2px)}
.cta-btn .arw{transition:transform .18s}
.cta-btn:hover .arw{transform:translateX(4px)}

/* QR card */
.qr-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;text-align:center;position:relative;overflow:hidden}
.qr-card::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 0%,rgba(255,77,0,.10),transparent 70%);pointer-events:none}
.qr-frame{background:#fff;border-radius:14px;padding:16px;width:min(260px,72vw);margin:0 auto 16px;position:relative}
.qr-frame img{width:100%;height:auto;image-rendering:pixelated}
.qr-card .qr-label{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--text-ter)}
.qr-card .qr-scan{font-size:14px;font-weight:700;color:var(--text-pri);margin-bottom:4px}

/* Price inline */
.price-line{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.price-old{font-size:19px;color:var(--text-ghost);text-decoration:line-through;font-weight:600}
.price-now{font-family:var(--mono);font-size:clamp(36px,6vw,52px);font-weight:800;letter-spacing:-1.5px;color:var(--text-pri);line-height:1}
.price-now .cur{font-size:.5em;color:var(--text-ter);margin-right:2px;vertical-align:.35em}
.price-inst{font-size:14.5px;color:var(--text-sec)}
.price-inst b{color:var(--accent);font-weight:700}

/* Section spacing */
.sec{padding:clamp(40px,6vw,68px) 0;border-top:1px solid var(--border)}

/* Problem */
.prob-h{font-size:clamp(26px,5.4vw,46px);font-weight:900;line-height:1.02;letter-spacing:-1.6px;margin-bottom:18px}
.prob-h .strike{color:var(--text-ter)}

/* Engines / cards */
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:34px}
@media(max-width:720px){.cards2{grid-template-columns:1fr}}
.eng{background:var(--card);border:1px solid var(--border);border-radius:var(--r);border-top:3px solid var(--accent);padding:26px}
.eng-n{font-family:var(--mono);font-size:12px;font-weight:800;color:var(--accent);letter-spacing:1px;margin-bottom:14px}
.eng h3{font-size:20px;font-weight:800;letter-spacing:-.4px;margin-bottom:10px;line-height:1.15}
.eng p{color:var(--text-sec);font-size:15px;line-height:1.6}
.detail-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.detail-chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text-sec);background:var(--bg-alt);border:1px solid var(--border);padding:10px 15px;border-radius:var(--r-sm)}
.detail-chip svg{width:15px;height:15px;color:var(--accent);flex-shrink:0}

/* Audience */
.aud{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:32px}
@media(max-width:720px){.aud{grid-template-columns:1fr}}
.aud-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:22px}
.aud-card .an{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--text-ghost);letter-spacing:1px;margin-bottom:12px}
.aud-card p{font-size:14.5px;color:var(--text-sec);line-height:1.5}
.aud-card b{color:var(--text-pri);font-weight:650}

/* Offer block */
.offer{background:linear-gradient(180deg,var(--bg-alt),var(--card));border:1px solid var(--border-hi);border-radius:24px;padding:clamp(28px,4vw,48px);position:relative;overflow:hidden}
.offer::before{content:"";position:absolute;inset:0 0 auto 0;height:200px;background:radial-gradient(80% 100% at 50% 0%,rgba(255,77,0,.14),transparent 70%);pointer-events:none}
.offer-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(28px,4vw,48px);align-items:center;position:relative}
@media(max-width:820px){.offer-grid{grid-template-columns:1fr;gap:30px}}
.stack{list-style:none;margin:24px 0 0;padding:0}
.stack li{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:15.5px;color:var(--text-pri);font-weight:500;line-height:1.4}
.stack li:last-child{border-bottom:none}
.stack .chk{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:center;margin-top:1px}
.stack .chk svg{width:12px;height:12px;color:var(--accent)}
.stack li em{font-style:normal;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:5px;margin-left:8px;white-space:nowrap}
.offer-buy{text-align:center;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px 22px;position:relative}
.offer-buy .price-line{justify-content:center}
.offer-buy .qr-frame{width:min(220px,60vw);margin-bottom:14px}
.offer-buy .cta-btn{width:100%;justify-content:center;margin-top:18px}
.vagas{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--text-sec);margin-top:16px}
.vagas b{color:var(--accent)}
.guarantee{display:flex;align-items:flex-start;gap:12px;margin-top:26px;background:var(--ok-soft);border:1px solid rgba(52,211,153,.24);border-radius:var(--r);padding:16px 18px}
.guarantee svg{width:20px;height:20px;color:var(--ok);flex-shrink:0;margin-top:1px}
.guarantee p{font-size:14px;color:var(--text-sec);line-height:1.5;margin:0}
.guarantee b{color:var(--text-pri)}

/* Final */
.final{text-align:center;padding:clamp(52px,8vw,90px) 0 clamp(30px,5vw,50px)}
.final h2{font-size:clamp(28px,5.6vw,50px);font-weight:900;line-height:1.02;letter-spacing:-1.8px;margin-bottom:14px}
.final h2 .hl{color:var(--accent)}
.final p{color:var(--text-sec);font-size:17px;margin-bottom:30px}

/* Footer */
.footer{border-top:1px solid var(--border);padding:26px var(--safe);text-align:center}
.footer p{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--text-ghost)}
</style>
