<style>
:root{
  --bg:#FAF9F5; --card:#FFFFFF; --card-2:#F4F2EC;
  --ink:#1A1917; --soft:#57534A; --gray:#8A857B;
  --coral:#D97757; --coral-deep:#C15F3C; --coral-soft:rgba(217,119,87,.10);
  --line:rgba(26,25,23,.10); --line-2:rgba(26,25,23,.16);
  --success:#15803D; --danger:#B91C1C;
  --r-card:16px; --r-lg:20px; --r-sm:12px; --r-pill:50px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --maxw:1080px;
  --sec-y:clamp(48px,7vw,84px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(800px 520px at 85% -6%, rgba(217,119,87,.09), transparent 60%)}
main,header,footer{position:relative;z-index:1}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--ink)}
h1{font-size:clamp(30px,4.8vw,50px);font-weight:900;letter-spacing:-.03em}
h2{font-size:clamp(24px,3.4vw,36px)}
p{margin:0}
.container{max-width:var(--maxw);margin:0 auto;padding:0 22px}
@media(max-width:480px){.container{padding:0 16px}}
section{padding:var(--sec-y) 0;position:relative}
.hl{color:var(--coral)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--coral-deep)}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--coral)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;border:0;font-family:var(--font);font-weight:800;font-size:15px;border-radius:var(--r-pill);padding:16px 30px;transition:transform .16s ease, box-shadow .25s ease, background .25s ease}
.btn-primary{background:var(--coral);color:#fff;box-shadow:0 6px 26px rgba(217,119,87,.35);letter-spacing:.02em;text-transform:uppercase}
.btn-primary:hover{transform:translateY(-2px);background:var(--coral-deep);box-shadow:0 8px 34px rgba(217,119,87,.45)}
.btn-lg{padding:18px 38px;font-size:16px}
.btn-block{width:100%}
.btn[disabled]{opacity:.6;cursor:wait;transform:none}

/* topbar */
.topbar{position:sticky;top:0;z-index:50;background:rgba(250,249,245,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;height:58px}
.topbar img{height:20px;width:auto}
.topbar .date{font-size:13px;font-weight:700;color:var(--soft)}
.topbar .date b{color:var(--coral-deep)}

/* hero */
.hero{padding:clamp(36px,5.5vw,64px) 0 var(--sec-y)}
.hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:44px;align-items:center}
@media(max-width:920px){.hero-grid{grid-template-columns:1fr;gap:12px}}
.hero-copy .eyebrow{margin-bottom:16px}
.hero h1{margin-bottom:16px}
.hero .lead{color:var(--soft);font-size:clamp(16px,2vw,18px);max-width:54ch}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0 0}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:var(--r-pill);padding:8px 14px}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--coral);flex-shrink:0}
.chip.hl2{border-color:var(--coral);background:var(--coral-soft);color:var(--coral-deep);font-weight:800}

/* preço em evidência */
.price-box{display:flex;align-items:center;gap:18px;margin-top:26px;flex-wrap:wrap}
.price-tag{background:var(--card);border:1px solid var(--line-2);border-left:4px solid var(--coral);border-radius:var(--r-card);padding:14px 22px;box-shadow:0 14px 36px -22px rgba(26,25,23,.35)}
.price-tag .lbl{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--coral-deep)}
.price-tag .val{font-size:clamp(34px,5vw,44px);font-weight:900;letter-spacing:-.03em;line-height:1.05}
.price-tag .val small{font-size:.45em;font-weight:800;vertical-align:.55em;margin-right:2px}
.price-tag .until{font-size:12.5px;font-weight:700;color:var(--gray)}
.hero-cta-row{margin-top:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.hero-cta-row .micro{font-size:12.5px;color:var(--gray)}

/* countdown */
.count{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap;align-items:center}
.count .lbl{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gray);width:100%}
.cbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 0;text-align:center;min-width:60px}
.cbox b{display:block;font-size:22px;font-weight:900;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.cbox span{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray)}

/* órbita do Claude (da lp-500/b, adaptada pro tema claro) */
.orbit{width:100%;max-width:300px;margin:0 auto;aspect-ratio:1;position:relative}
.orbit .field{position:relative;width:100%;height:100%;display:grid;place-items:center;
  --unit:300px;--rad1:calc(var(--unit)*.275);--rad2:calc(var(--unit)*.425);
  --mascot:calc(var(--unit)*.30);--emoji:calc(var(--unit)*.072);--d1:40s;--d2:54s;
  --ringline:rgba(217,119,87,.30);--glow:rgba(217,119,87,.35)}
.orbit *,.orbit *::before,.orbit *::after{box-sizing:border-box}
.orbit .oring{position:absolute;top:50%;left:50%;border:1px dashed var(--ringline);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.orbit .oring.r1{width:calc(var(--rad1)*2);height:calc(var(--rad1)*2)}
.orbit .oring.r2{width:calc(var(--rad2)*2);height:calc(var(--rad2)*2)}
.orbit .ring{position:absolute;top:50%;left:50%;width:0;height:0;will-change:transform}
.orbit .ring.r1{--rad:var(--rad1);animation:o-spin var(--d1) linear infinite}
.orbit .ring.r2{--rad:var(--rad2);animation:o-spin var(--d2) linear infinite reverse}
@keyframes o-spin{to{transform:rotate(360deg)}}
.orbit .slot{position:absolute;top:0;left:0;width:0;height:0;transform:rotate(var(--a)) translateY(calc(-1*var(--rad)))}
.orbit .spin{position:absolute;top:0;left:0;width:0;height:0}
.orbit .ring.r1 .spin{animation:o-spin var(--d1) linear infinite reverse}
.orbit .ring.r2 .spin{animation:o-spin var(--d2) linear infinite}
.orbit .deangle{position:absolute;top:0;left:0;width:0;height:0;transform:rotate(calc(-1*var(--a)))}
.orbit .emoji{position:absolute;top:0;left:0;transform:translate(-50%,-50%);font-size:var(--emoji);line-height:1;filter:drop-shadow(0 2px 7px rgba(0,0,0,.18))}
.orbit .mascot{position:relative;width:var(--mascot);height:var(--mascot);display:grid;place-items:center;z-index:5;animation:o-bob 5.5s ease-in-out infinite}
@keyframes o-bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3%) rotate(-1deg)}}
.orbit .mascot .glow{position:absolute;inset:-52%;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,rgba(217,119,87,0) 62%);animation:o-glow 4s ease-in-out infinite;z-index:-1}
@keyframes o-glow{0%,100%{transform:scale(.95)}50%{transform:scale(1.08)}}
.orbit .mascot img{width:100%;height:100%;object-fit:contain;border-radius:22%;filter:drop-shadow(0 14px 24px rgba(0,0,0,.18))}
@media(prefers-reduced-motion:reduce){.orbit .ring,.orbit .spin,.orbit .mascot,.orbit .mascot .glow{animation:none!important}}
@media(min-width:760px){.orbit{max-width:360px}.orbit .field{--unit:360px}}
.orbit-cap{margin-top:14px;text-align:center;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gray)}
.orbit-cap b{color:var(--ink)}

/* timeline de lotes */
.lotes{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}
@media(max-width:760px){.tl{grid-template-columns:1fr}}
.tl .lote{position:relative;border:1px solid var(--line);border-radius:var(--r-card);padding:20px 22px;background:var(--bg)}
.tl .lote .n{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--gray)}
.tl .lote .p{font-size:clamp(26px,3.4vw,32px);font-weight:900;letter-spacing:-.02em;margin:4px 0 2px}
.tl .lote .p small{font-size:.5em;font-weight:800;vertical-align:.5em;margin-right:2px}
.tl .lote .d{font-size:13px;font-weight:700;color:var(--soft)}
.tl .lote.on{border-color:var(--coral);background:var(--card);box-shadow:0 16px 40px -24px rgba(217,119,87,.55)}
.tl .lote.on .n{color:var(--coral-deep)}
.tl .lote.on::after{content:"você está aqui";position:absolute;top:-11px;right:14px;background:var(--coral-deep);color:#fff;font-size:10.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:var(--r-pill);padding:4px 12px}
.tl .lote.off{opacity:.62}
.tl .lote.off .p{text-decoration:none}
.tl-note{margin-top:16px;font-size:13.5px;color:var(--soft);text-align:center}
.tl-note b{color:var(--coral-deep)}

/* valor + mentor (mantidos, compactos) */
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:820px){.vgrid{grid-template-columns:1fr}}
.vcard{padding:8px 4px}
.vcard .n{font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--coral);margin-bottom:8px;display:block}
.vcard h3{font-size:17.5px;margin-bottom:6px}
.vcard p{color:var(--soft);font-size:14.5px}
.mentor{display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(20px,3vw,32px);box-shadow:0 20px 50px -30px rgba(26,25,23,.25)}
@media(max-width:760px){.mentor{grid-template-columns:1fr}}
.mentor .photo{border-radius:var(--r-card);overflow:hidden;aspect-ratio:1/1;background:var(--card-2)}
.mentor .photo img{width:100%;height:100%;object-fit:cover;object-position:center 18%}
.mentor h3{font-size:clamp(20px,2.6vw,26px);margin-bottom:2px}
.mentor .role{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--coral-deep);margin-bottom:14px}
.mentor ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.mentor li{display:flex;gap:10px;font-size:14.5px;color:var(--soft);line-height:1.5}
.mentor li::before{content:"›";color:var(--coral);font-weight:900;flex-shrink:0}

/* final */
.final{text-align:center;background:var(--card-2);border-top:1px solid var(--line)}
.final .tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--coral-deep);border-radius:var(--r-pill);padding:8px 18px;margin-bottom:18px}
.final h2{max-width:24ch;margin:0 auto 12px}
.final p{color:var(--soft);max-width:50ch;margin:0 auto 26px}
footer{padding:30px 0;border-top:1px solid var(--line)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.foot img{height:18px;width:auto;opacity:.85}
.foot p{font-size:12.5px;color:var(--gray)}

/* ---------- modal de inscrição (2 etapas) ---------- */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(26,25,23,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:18px}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:var(--r-lg);border-top:4px solid var(--coral);max-width:440px;width:100%;padding:clamp(22px,4vw,32px);box-shadow:0 40px 90px -30px rgba(26,25,23,.5);position:relative;animation:m-in .22s ease}
@keyframes m-in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal .x{position:absolute;top:12px;right:14px;background:none;border:0;font-size:22px;color:var(--gray);cursor:pointer;line-height:1;padding:6px}
.modal h3{font-size:19px;font-weight:800;margin-bottom:4px}
.modal .sub{color:var(--soft);font-size:13.5px;margin-bottom:18px}
.modal .sub b{color:var(--coral-deep)}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps i{height:4px;border-radius:2px;flex:1;background:var(--line)}
.steps i.on{background:var(--coral)}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--gray);margin-bottom:6px}
.field input{width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r-sm);color:var(--ink);font-family:var(--font);font-size:16px;padding:13px 15px;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--coral)}
.field input.err{border-color:var(--danger)}
.field input.ok{border-color:var(--success)}
.zap-status{display:none;align-items:center;gap:9px;font-size:13px;font-weight:700;margin:-4px 0 12px;padding:9px 12px;border-radius:var(--r-sm)}
.zap-status.show{display:flex}
.zap-status.checking{background:var(--card-2);color:var(--soft)}
.zap-status.valid{background:rgba(21,128,61,.08);color:var(--success)}
.zap-status.invalid{background:rgba(185,28,28,.08);color:var(--danger)}
.zap-status img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.form-msg{display:none;font-size:13px;font-weight:600;color:var(--danger);margin:-3px 0 11px}
.modal .note{font-size:12px;color:var(--gray);margin-top:12px;text-align:center}
[data-step]{display:none}
[data-step].on{display:block}
</style>
<script>document.documentElement.classList.add('js')</script>
