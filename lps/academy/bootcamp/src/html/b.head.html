<style>
  :root{
    --bg:#1a1917; --bg-2:#232220; --bg-3:#2d2b28;
    --line:rgba(240,238,230,.10); --line-2:rgba(240,238,230,.17);
    --cream:#f0eee6; --cream-2:#e7e4d9; --white:#faf9f5;
    --ink:#1a1917; --ink-soft:#57534a;
    --paper:#f4f2ec; --paper-soft:#a8a49a;
    --coral:#d97757; --coral-bri:#e98d6d; --coral-deep:#c15f3c;
    --green:#8bb48b;
    --wrap:1140px;
    --pad-sec:clamp(68px,9vw,124px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
  body{
    background:var(--bg); color:var(--paper);
    font-family:"Inter",system-ui,sans-serif; font-size:17px; line-height:1.65;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  ::selection{background:var(--coral);color:#1a1917}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  .wrap{width:100%;max-width:var(--wrap);margin:0 auto;padding:0 24px}

  /* ---------- type ---------- */
  .mono{font-family:"JetBrains Mono",monospace}
  h1,h2,h3,.disp{font-family:"Space Grotesk",sans-serif;letter-spacing:-.02em;line-height:1.05}
  h2{font-size:clamp(1.8rem,4.2vw,2.95rem);font-weight:600}
  .kicker{
    font-family:"JetBrains Mono",monospace;font-size:.75rem;letter-spacing:.06em;
    color:var(--coral);display:inline-flex;align-items:center;gap:.5ch;margin-bottom:18px;
  }
  .kicker .b{color:var(--paper-soft)}
  .lead{font-size:clamp(1.05rem,2.1vw,1.28rem);color:var(--paper-soft);line-height:1.6;max-width:62ch}
  .eyebrow-ink{color:var(--ink-soft)}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:.6ch;font-family:"Space Grotesk",sans-serif;
    font-weight:600;font-size:.98rem;border:1px solid transparent;border-radius:11px;
    padding:.92em 1.5em;cursor:pointer;transition:transform .18s ease,background .18s ease,border-color .18s ease,color .18s ease;
    white-space:nowrap;
  }
  .btn-primary{background:var(--coral);color:#1a1917}
  .btn-primary:hover{background:var(--coral-deep);transform:translateY(-2px)}
  .btn-ghost{background:transparent;border-color:var(--line-2);color:var(--paper)}
  .btn-ghost:hover{border-color:var(--coral);color:var(--coral);transform:translateY(-2px)}
  .btn-lg{font-size:1.08rem;padding:1.05em 1.9em;border-radius:13px}
  .btn-block{display:flex;width:100%;justify-content:center}
  .btn .arw{transition:transform .18s ease}
  .btn:hover .arw{transform:translateX(3px)}

  /* ---------- nav ---------- */
  .nav{position:fixed;top:0;left:0;right:0;z-index:60;background:rgba(26,25,23,.82);
    backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .3s ease,background .3s ease}
  .nav.scrolled{border-bottom-color:var(--line);background:rgba(26,25,23,.94)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:70px}
  .nav-logo{height:26px;width:auto}
  .nav-right{display:flex;align-items:center;gap:20px}
  .live-dot{display:inline-flex;align-items:center;gap:.6ch;font-family:"JetBrains Mono",monospace;font-size:.72rem;color:var(--paper-soft)}
  .live-dot i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(139,180,139,.6);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(139,180,139,.5)}70%{box-shadow:0 0 0 7px rgba(139,180,139,0)}100%{box-shadow:0 0 0 0 rgba(139,180,139,0)}}
  @media(max-width:640px){.live-dot{display:none}.nav-in{height:62px}.btn{padding:.8em 1.2em;font-size:.9rem}}

  /* ---------- hero ---------- */
  .hero{position:relative;padding-top:150px;padding-bottom:var(--pad-sec);overflow:hidden}
  .hero-glow{position:absolute;top:6%;right:-8%;width:60vw;max-width:720px;aspect-ratio:1;
    background:radial-gradient(circle,rgba(217,119,87,.20),transparent 62%);filter:blur(30px);pointer-events:none;z-index:0}
  .hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
  .hero h1{font-size:clamp(2.35rem,5.6vw,4.15rem);font-weight:700;margin:8px 0 22px}
  .hero h1 .hl{color:var(--coral)}
  .prompt{font-family:"JetBrains Mono",monospace;font-size:.8rem;color:var(--paper-soft);
    display:inline-flex;flex-wrap:wrap;align-items:center;gap:.5ch;margin-bottom:14px;
    border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--bg-2)}
  .prompt .d{color:var(--coral)}
  .prompt .path{color:var(--paper)}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 30px}
  .chip{font-family:"JetBrains Mono",monospace;font-size:.76rem;color:var(--paper);
    border:1px solid var(--line-2);border-radius:999px;padding:7px 13px;display:inline-flex;align-items:center;gap:.6ch}
  .chip i{width:6px;height:6px;border-radius:50%;background:var(--coral)}
  .chip.date{border-color:var(--coral);color:var(--coral-bri);background:rgba(217,119,87,.10);font-weight:700}
  .chip.date i{background:var(--coral)}
  .hero-cta{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .microcopy{margin-top:16px;font-size:.9rem;color:var(--paper-soft);max-width:44ch}

  /* ---------- terminal (signature) ---------- */
  .term{background:#141311;border:1px solid var(--line-2);border-radius:14px;overflow:hidden;
    box-shadow:0 30px 70px -30px rgba(0,0,0,.7);position:relative}
  .term-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:#1c1a18}
  .term-bar .dot{width:11px;height:11px;border-radius:50%}
  .d1{background:#e0685a}.d2{background:#e0a95a}.d3{background:#7fb87f}
  .term-bar .tt-title{margin-left:8px;font-family:"JetBrains Mono",monospace;font-size:.74rem;color:var(--paper-soft)}
  .term-body{padding:20px 18px;font-family:"JetBrains Mono",monospace;font-size:.86rem;line-height:1.95;min-height:300px}
  .tline{white-space:pre-wrap;word-break:break-word}
  .tline .tp{color:var(--coral)}
  .tline.ok .tp{color:var(--green)}
  .tline.ok .tt{color:var(--green)}
  .tline .tt{color:var(--paper)}
  .tt.active{border-right:2px solid var(--coral);animation:blink 1.05s step-end infinite}
  .tline.ok .tt.active{border-right-color:var(--green)}
  @keyframes blink{50%{border-color:transparent}}

  @media(max-width:900px){
    .hero-grid{grid-template-columns:1fr;gap:40px}
    .term{order:2}
  }

  /* ---------- tech strip ---------- */
  .strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg-2)}
  .strip-in{display:flex;align-items:center;gap:26px;flex-wrap:wrap;padding:22px 24px;justify-content:center}
  .strip-lbl{font-family:"JetBrains Mono",monospace;font-size:.72rem;color:var(--paper-soft);letter-spacing:.04em}
  .strip-tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .tag{font-family:"JetBrains Mono",monospace;font-size:.78rem;color:var(--paper);
    border:1px solid var(--line-2);border-radius:8px;padding:6px 12px}
  .tag b{color:var(--coral);font-weight:400}

  /* ---------- generic section ---------- */
  .sec{padding:var(--pad-sec) 0}
  .sec-head{max-width:66ch;margin-bottom:52px}
  .sec-head.center{margin-left:auto;margin-right:auto;text-align:center}
  .sec-head p{color:var(--paper-soft);margin-top:16px;font-size:1.08rem}

  /* value cards */
  .grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
  .vcard{background:var(--bg-2);border:1px solid var(--line);border-radius:16px;padding:30px 28px;transition:border-color .25s ease,transform .25s ease}
  .vcard:hover{border-color:var(--line-2);transform:translateY(-3px)}
  .vcard .vk{font-family:"JetBrains Mono",monospace;font-size:.74rem;color:var(--coral);margin-bottom:16px}
  .vcard h3{font-size:1.28rem;font-weight:600;margin-bottom:10px}
  .vcard p{color:var(--paper-soft);font-size:.98rem}

  /* build log (programação) */
  .log{position:relative;margin-top:10px}
  .log:before{content:"";position:absolute;left:26px;top:8px;bottom:8px;width:1px;background:var(--line-2)}
  @media(max-width:560px){.log:before{left:15px}}
  .step{position:relative;display:grid;grid-template-columns:64px 1fr;gap:6px;padding:22px 0}
  @media(max-width:560px){.step{grid-template-columns:40px 1fr}}
  .step-i{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:1.15rem;color:var(--coral);
    background:var(--bg);z-index:1;width:max-content;padding-right:6px}
  .step h3{font-size:1.22rem;font-weight:600;margin-bottom:6px}
  .step p{color:var(--paper-soft);font-size:.98rem;max-width:64ch}
  .result{display:inline-flex;align-items:center;gap:.6ch;margin-top:12px;font-family:"JetBrains Mono",monospace;
    font-size:.78rem;color:var(--green);border:1px solid rgba(139,180,139,.32);border-radius:999px;padding:5px 12px}
  .result i{width:6px;height:6px;border-radius:50%;background:var(--green)}
  .payoff{margin-top:44px;padding:28px 30px;border:1px solid var(--line-2);border-radius:16px;background:var(--bg-2);
    font-family:"Space Grotesk",sans-serif;font-size:clamp(1.15rem,2.4vw,1.6rem);font-weight:600;line-height:1.35}
  .payoff .hl{color:var(--coral)}

  /* ---------- experts (cream) ---------- */
  .cream{background:var(--cream);color:var(--ink)}
  .cream h2{color:var(--ink)}
  .cream .kicker{color:var(--coral-deep)}
  .cream .sec-head p{color:var(--ink-soft)}
  .experts{display:grid;grid-template-columns:repeat(2,1fr);gap:26px}
  .exp{background:var(--white);border:1px solid rgba(26,25,23,.10);border-radius:20px;overflow:hidden;
    box-shadow:0 24px 50px -34px rgba(0,0,0,.35);display:flex;flex-direction:column}
  .exp-photo{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--cream-2)}
  .exp-photo img{width:100%;height:100%;object-fit:cover;object-position:center 22%}
  .exp-tag{position:absolute;left:16px;bottom:16px;font-family:"JetBrains Mono",monospace;font-size:.72rem;
    background:rgba(26,25,23,.82);color:var(--paper);border-radius:999px;padding:6px 13px;backdrop-filter:blur(4px)}
  .exp-body{padding:28px 28px 32px}
  .exp-body h3{font-size:1.6rem;font-weight:700;color:var(--ink);margin-bottom:4px}
  .exp-role{font-family:"JetBrains Mono",monospace;font-size:.78rem;color:var(--coral-deep);margin-bottom:18px}
  .exp-quote{font-style:italic;color:var(--ink-soft);border-left:3px solid var(--coral);padding-left:14px;
    margin-bottom:22px;font-size:1.02rem;line-height:1.5}
  .exp-list{list-style:none;display:flex;flex-direction:column;gap:12px}
  .exp-list li{display:flex;gap:11px;align-items:flex-start;font-size:1rem;color:#33302b;line-height:1.45}
  .exp-list .em{flex-shrink:0;font-size:1.05rem;line-height:1.3}
  @media(max-width:820px){.experts{grid-template-columns:1fr}.exp-photo{aspect-ratio:4/3}}

  /* ---------- who (para quem) ---------- */
  .who-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
  .who{background:var(--bg-2);border:1px solid var(--line);border-radius:16px;padding:26px 26px;display:flex;gap:16px;align-items:flex-start}
  .who .ic{flex-shrink:0;width:40px;height:40px;border-radius:10px;background:rgba(217,119,87,.12);
    display:flex;align-items:center;justify-content:center;color:var(--coral)}
  .who h3{font-size:1.1rem;font-weight:600;margin-bottom:5px}
  .who p{color:var(--paper-soft);font-size:.95rem}
  .prereq{margin-top:22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
    border:1px dashed var(--line-2);border-radius:14px;padding:20px 24px;background:var(--bg-2);text-align:center}
  .prereq .big{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:1.15rem}
  .prereq .big b{color:var(--coral)}
  .prereq span{color:var(--paper-soft);font-size:.95rem}

  /* ---------- bonus ---------- */
  .bonus-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
  .bcard{background:var(--bg-2);border:1px solid var(--line);border-radius:16px;padding:28px 26px;position:relative;transition:border-color .25s,transform .25s}
  .bcard:hover{border-color:var(--coral);transform:translateY(-3px)}
  .bcard .bic{width:44px;height:44px;border-radius:11px;background:rgba(217,119,87,.12);color:var(--coral);
    display:flex;align-items:center;justify-content:center;margin-bottom:18px}
  .bcard h3{font-size:1.18rem;font-weight:600;margin-bottom:8px}
  .bcard p{color:var(--paper-soft);font-size:.95rem}
  .bcard .incl{position:absolute;top:22px;right:22px;font-family:"JetBrains Mono",monospace;font-size:.66rem;
    color:var(--green);border:1px solid rgba(139,180,139,.34);border-radius:999px;padding:3px 9px}

  /* ---------- stats ---------- */
  .stats{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg-2)}
  .stats-in{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:44px 24px;text-align:center}
  .stat .n{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(1.8rem,4vw,2.6rem);color:var(--coral);line-height:1}
  .stat .l{font-size:.9rem;color:var(--paper-soft);margin-top:8px}
  @media(max-width:640px){.stats-in{grid-template-columns:repeat(2,1fr);gap:32px 16px}}

  /* ---------- offer (cream) ---------- */
  .offer-card{max-width:660px;margin:0 auto;background:var(--white);color:var(--ink);border-radius:22px;
    border-top:4px solid var(--coral);box-shadow:0 34px 80px -40px rgba(0,0,0,.4);padding:44px clamp(24px,4vw,48px);text-align:center}
  .offer-kicker{font-family:"JetBrains Mono",monospace;font-size:.74rem;color:var(--coral-deep);margin-bottom:14px}
  .offer-card h3{font-size:clamp(1.7rem,4vw,2.3rem);font-weight:700;color:var(--ink);line-height:1.1}
  .offer-date{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:.74rem;color:var(--ink-soft);
    border:1px solid rgba(26,25,23,.18);border-radius:999px;padding:6px 14px;margin:16px 0 6px}
  .price{margin:20px 0 4px}
  .price .cur{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:1.4rem;color:var(--ink);vertical-align:top;margin-right:2px}
  .price .val{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(3rem,9vw,4.4rem);color:var(--ink);line-height:1}
  .price-sub{font-size:.92rem;color:var(--ink-soft);margin-bottom:26px}
  .price-alt{font-family:"JetBrains Mono",monospace;font-size:.92rem;color:var(--coral-deep);border:1px dashed rgba(193,95,60,.45);border-radius:12px;padding:14px 18px;margin:22px auto 28px;max-width:420px}
  .incl-list{list-style:none;text-align:left;max-width:420px;margin:0 auto 30px;display:flex;flex-direction:column;gap:13px}
  .incl-list li{display:flex;gap:11px;align-items:flex-start;font-size:1rem;color:#33302b}
  .incl-list .ck{flex-shrink:0;color:var(--green);margin-top:2px}
  .incl-list b{color:var(--ink);font-weight:600}
  .offer-urgent{margin-top:18px;font-family:"JetBrains Mono",monospace;font-size:.8rem;color:var(--coral-deep)}
  .offer-trust{margin-top:10px;font-size:.82rem;color:var(--ink-soft);display:flex;align-items:center;gap:8px;justify-content:center}

  /* ---------- faq ---------- */
