<style>
  :root{
    --bg:#000000;          /* fundo geral */
    --red:#ff0000;         /* barra de topo */
    --orange:#ff4d00;      /* headline */
    --white:#ffffff;
    --gray:#9a9a9a;
    --line:rgba(255,255,255,.14);
    --wrap:720px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--white);
    font-family:"Inter",system-ui,sans-serif; font-size:16px; line-height:1.45;
    -webkit-font-smoothing:antialiased; overflow-x:hidden; text-align:center;
  }
  img{display:block;max-width:100%}
  .wrap{width:100%;max-width:var(--wrap);margin:0 auto;padding:0 18px}

  /* barra vermelha de topo */
  .topbar{background:var(--red);padding:12px 14px}
  .topbar p{font-weight:800;font-size:clamp(.9rem,3.6vw,1.05rem);letter-spacing:.01em}

  /* bloco principal */
  .main{padding:34px 0 56px}
  .hold{
    font-size:clamp(.95rem,3.8vw,1.15rem);font-weight:600;margin-bottom:22px;
  }
  .hold u{text-underline-offset:3px}
  h1{
    color:var(--orange);font-weight:900;text-transform:uppercase;
    font-size:clamp(1.45rem,6.4vw,2.35rem);line-height:1.12;letter-spacing:-.01em;
    margin-bottom:30px;
  }

  /* player bunny responsivo 16:9 */
  .player{
    position:relative;width:100%;aspect-ratio:16/9;background:#0d0d0d;
    border-radius:10px;overflow:hidden;box-shadow:0 0 60px rgba(255,77,0,.12);
    margin-bottom:14px;
  }
  .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .sound{color:var(--gray);font-size:.85rem;margin-bottom:38px}

  /* versão escrita (enquanto não há vídeo) */
  .pitch{max-width:560px;margin:0 auto 26px;text-align:left}
  .pitch p{font-size:clamp(1rem,4vw,1.15rem);line-height:1.6;margin-bottom:16px}
  .pitch strong{color:var(--orange)}
  .pitch-cta{text-align:center;font-weight:800;color:var(--white);margin-top:26px}

  /* bloco de preço ancorado */
  .price{
    max-width:560px;margin:0 auto 30px;padding:22px 18px;
    border:2px dashed var(--orange);border-radius:12px;
    display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .price-old{color:var(--gray);font-size:1.05rem;text-decoration:line-through}
  .price-new{color:var(--orange);font-weight:900;font-size:clamp(2.6rem,12vw,3.6rem);line-height:1.05}
  .price-note{color:var(--white);font-size:.9rem;font-weight:600}

  /* área dos botões do funil hotmart */
  .funnel{margin:0 auto 10px;max-width:520px}
  #hotmart-sales-funnel{display:flex;flex-direction:column;gap:12px;align-items:center}

  /* footer */
  footer{border-top:1px solid var(--line);padding:34px 18px 46px;margin-top:40px}
  footer p{color:var(--gray);font-size:.8rem;max-width:560px;margin:0 auto 8px}
</style>
