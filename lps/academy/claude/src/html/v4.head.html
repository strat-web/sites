<style>
:root{
  --bg-main:#0A0A0A; --bg-card-1:#111111; --bg-card-2:#161616; --bg-card-3:#1C1C1C;
  --accent-main:#E07A3A; --accent-glow:#FF8C42; --accent-dark:#C96A2E;
  --gold:#D4A853; --gold-light:#F0D078;
  --text-main:#F5F5F5; --text-sec:#CCCCCC; --text-gray:#888888; --text-dark:#666666;
  --border-subtle:rgba(255,255,255,0.06); --border-orange:rgba(224,122,58,0.25);
  --shadow-orange-soft:0 0 40px rgba(224,122,58,0.08);
  --shadow-orange-hover:0 0 60px rgba(224,122,58,0.12);
  --shadow-btn:0 4px 30px rgba(224,122,58,0.35);
  --danger:#ef4444; --success:#22c55e;
  --r-card:16px; --r-lg:20px; --r-sm:12px; --r-pill:50px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --maxw:1120px;
  --sec-y:clamp(56px,8vw,100px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{
  background:var(--bg-main);color:var(--text-main);
  font-family:var(--font);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 600px at 82% -8%, rgba(224,122,58,.14), transparent 60%),
    radial-gradient(760px 520px at -8% 108%, rgba(224,122,58,.08), transparent 60%);
}
main,header,footer{position:relative;z-index:1}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.08;color:var(--text-main)}
h1{font-size:clamp(34px,5.2vw,56px);font-weight:900;letter-spacing:-.03em}
h2{font-size:clamp(28px,4vw,44px);letter-spacing:-.025em}
h3{font-size:clamp(19px,2.2vw,24px)}
p{margin:0}
.container{max-width:var(--maxw);margin:0 auto;padding:0 22px}
@media(max-width:480px){.container{padding:0 16px}}
section{padding:var(--sec-y) 0;position:relative}
.narrow{max-width:900px;margin-left:auto;margin-right:auto}
.grad{background:linear-gradient(90deg,var(--accent-glow),var(--gold-light));-webkit-background-clip:text;background-clip:text;color:transparent}
.orange{color:var(--accent-main)}
.gold{color:var(--gold)}

.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-main)}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--accent-main)}
.eyebrow.c{justify-content:center}
.section-head{display:flex;flex-direction:column;gap:16px;margin-bottom:44px}
.section-head.center{align-items:center;text-align:center}
.section-head p{color:var(--text-sec);max-width:60ch}
.muted{color:var(--text-sec)} .gray{color:var(--text-gray)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;border:0;font-family:var(--font);font-weight:700;font-size:15px;border-radius:var(--r-pill);padding:16px 30px;transition:transform .16s ease, box-shadow .25s ease, background .25s ease}
.btn-primary{background:linear-gradient(90deg,var(--accent-dark),var(--accent-main));color:#fff;box-shadow:var(--shadow-btn);letter-spacing:.02em;text-transform:uppercase}
.btn-primary:hover{transform:translateY(-2px);background:linear-gradient(90deg,var(--accent-main),var(--accent-glow));box-shadow:0 6px 40px rgba(224,122,58,.5)}
.btn-lg{padding:19px 40px;font-size:16px}
.btn-block{width:100%}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}.btn:hover{transform:none}}

/* Claude spark */
.spark{display:inline-block;color:var(--accent-main);flex:none}
.spark svg{display:block;width:100%;height:100%;overflow:visible}
.spark .rays{transform-origin:50px 50px;animation:spin 22s linear infinite}
.spark .core{transform-origin:50px 50px;animation:pulse 3.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.84);opacity:.8}}

/* Announcement bar */
.announce{background:linear-gradient(90deg,var(--accent-dark),var(--accent-main));color:#fff;text-align:center;font-size:13px;font-weight:600;letter-spacing:.01em;padding:11px 16px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.announce a{text-decoration:underline;text-underline-offset:3px;font-weight:800}
.announce .a-short{display:none}
.announce .dot{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:apulse 1.8s infinite}
@keyframes apulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}

/* Header */
.header{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--border-subtle)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:var(--maxw);margin:0 auto;padding:12px 22px}
.logo{display:flex;align-items:center;gap:10px}
.logo .spark{width:30px;height:30px}
.logo-text{display:flex;flex-direction:column;line-height:1.15}
.logo-name{font-size:14px;font-weight:700}
.logo-sub{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--text-gray)}
.nav{display:none;gap:28px;font-size:14px;color:var(--text-sec)}
.nav a:hover{color:var(--text-main)}
@media(min-width:920px){.nav{display:flex}}
.header .btn{padding:11px 20px;font-size:13px}
@media(max-width:520px){.header .btn{padding:10px 14px;font-size:12px}.logo-name{font-size:12px}}

/* HERO */
.hero{padding-top:clamp(32px,5vw,60px);padding-bottom:clamp(40px,6vw,80px);text-align:center}
.hero .badge{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:var(--r-pill);background:rgba(224,122,58,.1);border:1px solid var(--border-orange);color:var(--accent-glow);font-size:13px;font-weight:600;margin-bottom:26px}
.hero h1{max-width:16ch;margin:0 auto}
.hero .sub{margin:22px auto 0;max-width:52ch;color:var(--text-sec);font-size:clamp(16px,1.9vw,20px)}
.hero-ctas{margin-top:34px;display:flex;justify-content:center;flex-wrap:wrap;gap:14px}
.trust{margin-top:22px;display:flex;justify-content:center;flex-wrap:wrap;gap:10px 22px;font-size:13px;color:var(--text-gray)}
.trust span{display:inline-flex;align-items:center;gap:6px}
@media(max-width:520px){.trust{gap:6px 12px;font-size:11px}}

/* hero visual: logo do Claude em órbita animada (igual lp-500 v2) */
.orbit{width:100%;max-width:300px;margin:36px auto 0;aspect-ratio:1;position:relative}
.orbit .field{position:relative;width:100%;height:100%;display:grid;place-items:center;--unit:300px;--rad1:calc(var(--unit)*.34);--rad2:calc(var(--unit)*.47);--core:calc(var(--unit)*.30);--emoji:calc(var(--unit)*.078);--d1:42s;--d2:56s;--ringline:rgba(224,122,58,.28);--glow:rgba(224,122,58,.5)}
.orbit *{box-sizing:border-box}
.orbit .oring{position:absolute;top:50%;left:50%;border:1px dashed var(--ringline);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.orbit .oring.r1{width:calc(var(--rad1)*2);height:calc(var(--rad1)*2)}
.orbit .oring.r2{width:calc(var(--rad2)*2);height:calc(var(--rad2)*2)}
.orbit .ring{position:absolute;top:50%;left:50%;width:0;height:0;will-change:transform}
.orbit .ring.r1{--rad:var(--rad1);animation:o-spin var(--d1) linear infinite}
.orbit .ring.r2{--rad:var(--rad2);animation:o-spin var(--d2) linear infinite reverse}
@keyframes o-spin{to{transform:rotate(360deg)}}
.orbit .slot{position:absolute;top:0;left:0;width:0;height:0;transform:rotate(var(--a)) translateY(calc(-1*var(--rad)))}
.orbit .spin{position:absolute;top:0;left:0;width:0;height:0}
.orbit .ring.r1 .spin{animation:o-spin var(--d1) linear infinite reverse}
.orbit .ring.r2 .spin{animation:o-spin var(--d2) linear infinite}
.orbit .deangle{position:absolute;top:0;left:0;width:0;height:0;transform:rotate(calc(-1*var(--a)))}
.orbit .emoji{position:absolute;top:0;left:0;transform:translate(-50%,-50%);font-size:var(--emoji);line-height:1;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.orbit .core-mark{position:relative;width:var(--core);height:var(--core);display:grid;place-items:center;z-index:5;animation:o-bob 5.5s ease-in-out infinite}
@keyframes o-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5%)}}
.orbit .core-mark .glow{position:absolute;inset:-55%;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,rgba(224,122,58,0) 62%);animation:o-glow 4s ease-in-out infinite;z-index:-1}
@keyframes o-glow{0%,100%{transform:scale(.92)}50%{transform:scale(1.12)}}
.orbit .core-mark .spark{width:100%;height:100%;color:var(--accent-main);filter:drop-shadow(0 8px 22px rgba(224,122,58,.55))}
.orbit .core-mark img{width:118%;height:118%;object-fit:contain;border-radius:24%;filter:drop-shadow(0 14px 32px rgba(0,0,0,.6))}
@media(min-width:760px){.orbit{max-width:360px}.orbit .field{--unit:360px}}
@media(prefers-reduced-motion:reduce){.orbit .ring,.orbit .spin,.orbit .core-mark,.orbit .core-mark .glow{animation:none!important}}
@keyframes floaty{50%{transform:translateY(-8px)}}

/* STATS */
.stats{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px 34px;border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);padding:26px 0}
.stat{text-align:center;min-width:90px}
.stat .n{font-size:clamp(28px,4vw,40px);font-weight:900;letter-spacing:-.03em;color:var(--text-main)}
.stat .n em{color:var(--accent-main);font-style:normal}
.stat .lbl{font-size:13px;color:var(--text-gray);margin-top:2px}
.stat-sep{width:1px;height:40px;background:var(--border-subtle)}
@media(max-width:600px){.stat-sep{display:none}}

/* MARQUEE */
.marquee{overflow:hidden;border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);background:var(--bg-card-1);padding:16px 0;-webkit-mask-image:linear-gradient(to right,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(to right,transparent,#000 8%,#000 92%,transparent)}
.marquee-track{display:flex;gap:44px;white-space:nowrap;width:max-content;animation:mq 34s linear infinite;font-size:clamp(18px,2.4vw,26px);font-weight:800;letter-spacing:-.01em;color:var(--text-gray)}
.marquee-track span{display:inline-flex;align-items:center;gap:44px}
.marquee-track span::after{content:"✦";color:var(--accent-main);font-size:.7em}
@keyframes mq{to{transform:translateX(-50%)}}

/* PROBLEMA */
.problem-grid{display:grid;gap:34px;grid-template-columns:1fr}
@media(min-width:900px){.problem-grid{grid-template-columns:1fr 1fr;align-items:start}}
.pain{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.pain li{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;background:var(--bg-card-1);border:1px solid var(--border-subtle);border-radius:var(--r-sm);color:var(--text-sec)}
.pain .x{flex:none;width:22px;height:22px;border-radius:50%;background:rgba(239,68,68,.12);color:var(--danger);display:grid;place-items:center;font-size:12px;font-weight:800;border:1px solid rgba(239,68,68,.3)}
.closer{margin-top:26px;font-size:clamp(20px,2.4vw,28px);font-weight:800;line-height:1.25;letter-spacing:-.02em;border-left:3px solid var(--accent-main);padding-left:18px}

/* COMPARATIVO */
.compare-wrap{overflow-x:auto;border:1px solid var(--border-subtle);border-radius:var(--r-card);background:var(--bg-card-1)}
.compare{width:100%;border-collapse:collapse;min-width:680px}
.compare th,.compare td{padding:16px 18px;text-align:left;font-size:14.5px;border-bottom:1px solid var(--border-subtle);vertical-align:middle}
.compare thead th{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-gray);font-weight:700;background:var(--bg-card-2)}
.compare td:first-child{color:var(--text-main);font-weight:600}
.compare td.mut{color:var(--text-gray);font-weight:500}
.compare .col{background:linear-gradient(180deg,rgba(224,122,58,.14),rgba(224,122,58,.04));color:var(--text-main);font-weight:600}
.compare thead .col{color:var(--accent-main);font-weight:800;letter-spacing:.08em}
.compare tbody tr:last-child td{border-bottom:none}
.yes{color:var(--success);font-weight:700} .no{color:var(--danger)}

/* GRID */
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:560px){.grid.g2{grid-template-columns:1fr 1fr}}
@media(min-width:560px){.grid.g4{grid-template-columns:1fr 1fr}}
@media(min-width:980px){.grid.g4{grid-template-columns:repeat(4,1fr)}}
@media(min-width:560px){.grid.g3{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.grid.g3{grid-template-columns:repeat(3,1fr)}}
.tile{padding:24px;background:var(--bg-card-1);border:1px solid var(--border-subtle);border-radius:var(--r-card);display:flex;flex-direction:column;gap:12px;transition:border-color .2s,transform .2s,box-shadow .2s}
.tile:hover{border-color:var(--border-orange);transform:translateY(-3px);box-shadow:var(--shadow-orange-hover)}
.tile .emo{font-size:30px;line-height:1}
.tile .ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:radial-gradient(circle at 30% 30%,rgba(224,122,58,.25),rgba(224,122,58,.05));border:1px solid var(--border-orange);box-shadow:var(--shadow-orange-soft)}
.tile .kick{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-main)}
.tile h3{font-size:19px}
.tile p{color:var(--text-sec);font-size:14.5px}
.atile{display:flex;gap:14px;align-items:flex-start;padding:20px;background:var(--bg-card-1);border:1px solid var(--border-subtle);border-radius:var(--r-card)}
.atile .arw{flex:none;color:var(--accent-main);font-weight:900;font-size:20px;line-height:1.1}
.atile h3{font-size:16px;margin-bottom:4px} .atile p{color:var(--text-sec);font-size:14px}

/* CAPACIDADES */
.caps{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.caps{grid-template-columns:1fr 1fr}}
.cap{display:flex;gap:13px;align-items:flex-start;padding:17px 18px;background:var(--bg-card-1);border:1px solid var(--border-subtle);border-radius:var(--r-sm)}
.cap .arw{flex:none;color:var(--accent-main);font-weight:900;font-size:18px}
.cap b{font-weight:700} .cap span{color:var(--text-sec);font-size:14.5px}

/* MERCADO */
.clip{padding:22px;background:linear-gradient(180deg,var(--bg-card-2),var(--bg-card-1));border:1px solid var(--border-subtle);border-radius:var(--r-card);display:flex;flex-direction:column;gap:10px}
.clip .src{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.clip p{font-size:15px;font-weight:600;color:var(--text-main);line-height:1.4}

/* MÓDULOS carrossel */
.mcar{position:relative;margin:0;padding:6px 0;-webkit-mask-image:linear-gradient(to right,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(to right,transparent,#000 4%,#000 96%,transparent)}
.mtrack{display:flex;gap:16px;width:max-content;padding:0 22px;animation:mscroll 55s linear infinite}
.mcar:hover .mtrack,.mtrack:focus-within{animation-play-state:paused}
