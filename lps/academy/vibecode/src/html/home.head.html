<style>
:root{
  --bg:#FAF9F5; --card:#FFFFFF; --card-2:#F4F2EC;
  --ink:#1A1917; --soft:#57534A; --gray:#8A857B;
  --dark:#141312; --dark-2:#1D1B19; --dark-line:#302C28; --dark-ink:#F4F2EC; --dark-soft:#A8A196;
  --coral:#D97757; --coral-deep:#C15F3C; --coral-soft:rgba(217,119,87,.10);
  --line:rgba(26,25,23,.10); --line-2:rgba(26,25,23,.16);
  --success:#15803D; --danger:#B91C1C; --wa:#25D366; --wa-deep:#128C7E;
  --r-card:16px; --r-lg:20px; --r-sm:12px; --r-pill:50px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --maxw:1080px;
  --sec-y:clamp(48px,7vw,88px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.14;color:inherit}
h1{font-size:clamp(29px,4.6vw,48px);font-weight:900;letter-spacing:-.03em}
h2{font-size:clamp(24px,3.4vw,37px)}
p{margin:0}
button{font-family:inherit}
.container{max-width:var(--maxw);margin:0 auto;padding:0 22px}
@media(max-width:480px){.container{padding:0 16px}}
section{padding:var(--sec-y) 0;position:relative}
.hl{color:var(--coral)}
.center{text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--coral-deep)}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--coral)}
.center .eyebrow::after{content:"";width:22px;height:1px;background:var(--coral)}
.lead{color:var(--soft);font-size:clamp(15.5px,2vw,18px);max-width:58ch}
.center .lead{margin-left:auto;margin-right:auto}
.dark{background:var(--dark);color:var(--dark-ink)}
.dark .lead,.dark p{color:var(--dark-soft)}
.dark .eyebrow{color:var(--coral)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;border:0;font-family:var(--font);font-weight:800;font-size:15px;border-radius:var(--r-pill);padding:16px 28px;transition:transform .16s ease,box-shadow .25s ease,background .25s ease;text-align:center;line-height:1.25;-webkit-tap-highlight-color:transparent}
.btn-primary{background:var(--coral);color:#fff;box-shadow:0 6px 26px rgba(217,119,87,.35);letter-spacing:.02em}
.btn-primary:hover{transform:translateY(-2px);background:var(--coral-deep);box-shadow:0 8px 34px rgba(217,119,87,.45)}
.btn-lg{padding:19px 34px;font-size:16.5px}
.btn-block{width:100%}
.cta-wrap{display:flex;flex-direction:column;gap:11px;align-items:stretch;margin-top:26px}
@media(min-width:760px){.cta-wrap{align-items:flex-start}.center .cta-wrap{align-items:center}.cta-wrap .btn{width:auto}}
.micro{font-size:12.5px;color:var(--gray);text-align:center}
@media(min-width:760px){.cta-wrap .micro{text-align:left}.center .cta-wrap .micro{text-align:center}}
.dark .micro{color:var(--dark-soft)}

/* topbar */
.topbar{position:sticky;top:0;z-index:50;background:rgba(250,249,245,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px}
.topbar img{height:19px;width:auto}
.topbar .tag{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--coral-deep);background:var(--coral-soft);border:1px solid rgba(217,119,87,.28);border-radius:var(--r-pill);padding:5px 12px}

/* hero */
.hero{padding:clamp(28px,4.5vw,54px) 0 var(--sec-y)}
.hero-grid{display:grid;grid-template-columns:1fr;gap:26px;align-items:center}
@media(min-width:920px){.hero-grid{grid-template-columns:1.1fr .9fr;gap:48px}}
.hero .eyebrow{margin-bottom:15px}
.hero h1{margin-bottom:15px}
.hero-visual{margin-top:8px}
@media(min-width:920px){.hero-visual{margin-top:0}}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:var(--r-pill);padding:8px 14px}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--coral);flex-shrink:0}
.chip.hl2{border-color:var(--coral);background:var(--coral-soft);color:var(--coral-deep);font-weight:800}
.author{display:inline-flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-pill);padding:5px 16px 5px 5px;font-size:13.5px;font-weight:600;color:var(--soft);margin-top:22px}
.author img{width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:center 18%}
.author b{color:var(--ink);font-weight:800}

/* órbita do Claude */
.orbit{width:100%;max-width:270px;margin:0 auto;aspect-ratio:1;position:relative}
.orbit .field{position:relative;width:100%;height:100%;display:grid;place-items:center;
  --unit:270px;--rad1:calc(var(--unit)*.275);--rad2:calc(var(--unit)*.425);
  --mascot:calc(var(--unit)*.30);--emoji:calc(var(--unit)*.072);--d1:40s;--d2:54s;
  --ringline:rgba(217,119,87,.30);--glow:rgba(217,119,87,.35)}
.orbit *,.orbit *::before,.orbit *::after{box-sizing:border-box}
.orbit .oring{position:absolute;top:50%;left:50%;border:1px dashed var(--ringline);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.orbit .oring.r1{width:calc(var(--rad1)*2);height:calc(var(--rad1)*2)}
.orbit .oring.r2{width:calc(var(--rad2)*2);height:calc(var(--rad2)*2)}
.orbit .ring{position:absolute;top:50%;left:50%;width:0;height:0;will-change:transform}
.orbit .ring.r1{--rad:var(--rad1);animation:o-spin var(--d1) linear infinite}
.orbit .ring.r2{--rad:var(--rad2);animation:o-spin var(--d2) linear infinite reverse}
@keyframes o-spin{to{transform:rotate(360deg)}}
.orbit .slot{position:absolute;top:0;left:0;width:0;height:0;transform:rotate(var(--a)) translateY(calc(-1*var(--rad)))}
.orbit .spin{position:absolute;top:0;left:0;width:0;height:0}
.orbit .ring.r1 .spin{animation:o-spin var(--d1) linear infinite reverse}
.orbit .ring.r2 .spin{animation:o-spin var(--d2) linear infinite}
.orbit .deangle{position:absolute;top:0;left:0;width:0;height:0;transform:rotate(calc(-1*var(--a)))}
.orbit .emoji{position:absolute;top:0;left:0;transform:translate(-50%,-50%);font-size:var(--emoji);line-height:1;filter:drop-shadow(0 2px 7px rgba(0,0,0,.18))}
.orbit .mascot{position:relative;width:var(--mascot);height:var(--mascot);display:grid;place-items:center;z-index:5;animation:o-bob 5.5s ease-in-out infinite}
@keyframes o-bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3%) rotate(-1deg)}}
.orbit .mascot .glow{position:absolute;inset:-52%;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,rgba(217,119,87,0) 62%);animation:o-glow 4s ease-in-out infinite;z-index:-1}
@keyframes o-glow{0%,100%{transform:scale(.95)}50%{transform:scale(1.08)}}
.orbit .mascot img{width:100%;height:100%;object-fit:contain;border-radius:22%;filter:drop-shadow(0 14px 24px rgba(0,0,0,.18))}
@media(prefers-reduced-motion:reduce){.orbit .ring,.orbit .spin,.orbit .mascot,.orbit .mascot .glow{animation:none!important}}
@media(min-width:760px){.orbit{max-width:330px}.orbit .field{--unit:330px}}
.orbit-cap{margin-top:12px;text-align:center;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gray)}
.orbit-cap b{color:var(--ink)}

/* o que você recebe */
.pil{display:grid;grid-template-columns:1fr;gap:14px;margin-top:34px}
@media(min-width:820px){.pil{grid-template-columns:repeat(3,1fr);gap:16px}}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:24px 22px;text-align:left;box-shadow:0 18px 44px -34px rgba(26,25,23,.4)}
.pcard .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:20px;margin-bottom:14px;background:var(--coral-soft)}
.pcard h3{font-size:17.5px;margin-bottom:7px}
.pcard p{color:var(--soft);font-size:14.5px}
.pcard .tagr{display:inline-block;margin-top:13px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--coral-deep);background:var(--coral-soft);border-radius:var(--r-pill);padding:5px 12px}

/* as 15 skills */
.skgroup{margin-top:34px;text-align:left}
.skcat{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--coral)}
.skcat::after{content:"";flex:1;height:1px;background:var(--dark-line)}
.skgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.skgrid{grid-template-columns:1fr 1fr}}
@media(min-width:980px){.skgrid{grid-template-columns:repeat(3,1fr)}}
.sk{background:var(--dark-2);border:1px solid var(--dark-line);border-radius:var(--r-sm);padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
.sk .n{font-size:11.5px;font-weight:900;color:var(--coral);font-variant-numeric:tabular-nums;padding-top:2px;flex-shrink:0}
.sk b{display:block;font-size:14.5px;font-weight:800;color:var(--dark-ink);margin-bottom:3px;line-height:1.35}
.sk span{font-size:13px;color:var(--dark-soft);line-height:1.5}
.skfoot{margin-top:26px;font-size:13.5px;color:var(--dark-soft)}
.skfoot b{color:var(--coral)}

/* como funciona */
.steps{display:grid;grid-template-columns:1fr;gap:14px;margin-top:34px;text-align:left;counter-reset:st}
@media(min-width:820px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:24px 22px;position:relative}
.step .num{width:34px;height:34px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px;margin-bottom:14px}
.step h3{font-size:16.5px;margin-bottom:6px}
.step p{font-size:14.5px;color:var(--soft)}

/* pra quem é */
.fit{display:grid;grid-template-columns:1fr;gap:14px;margin-top:34px;text-align:left}
@media(min-width:760px){.fit{grid-template-columns:1fr 1fr;gap:16px}}
.fitc{border-radius:var(--r-card);padding:24px 22px}
.fit-yes{background:var(--card);border:1px solid var(--coral);box-shadow:0 18px 44px -34px rgba(217,119,87,.6)}
.fit-no{background:var(--card-2);border:1px solid var(--line)}
.fitc h3{font-size:16.5px;display:flex;align-items:center;gap:9px;margin-bottom:15px}
.fit-yes h3{color:var(--coral-deep)}
.fit-no h3{color:var(--gray)}
.fitc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.fitc li{display:flex;gap:10px;font-size:14.5px;color:var(--soft);line-height:1.5}
.fit-yes li::before{content:"✓";color:var(--success);font-weight:900;flex-shrink:0}
.fit-no li::before{content:"✕";color:var(--gray);font-weight:900;flex-shrink:0}

/* mentor */
.mentor{display:grid;grid-template-columns:1fr;gap:22px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(20px,3vw,32px);box-shadow:0 20px 50px -30px rgba(26,25,23,.25)}
@media(min-width:760px){.mentor{grid-template-columns:280px 1fr;gap:30px}}
.mentor .photo{border-radius:var(--r-card);overflow:hidden;aspect-ratio:1/1;background:var(--card-2);max-width:260px;margin:0 auto;width:100%}
.mentor .photo img{width:100%;height:100%;object-fit:cover;object-position:center 18%}
.mentor h3{font-size:clamp(20px,2.6vw,26px);margin-bottom:2px}
.mentor .role{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--coral-deep);margin-bottom:14px}
.mentor ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.mentor li{display:flex;gap:10px;font-size:14.5px;color:var(--soft);line-height:1.5}
.mentor li::before{content:"›";color:var(--coral);font-weight:900;flex-shrink:0}

/* faq */
.faq{max-width:720px;margin:32px auto 0;text-align:left}
.qa{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:10px;overflow:hidden}
.qa-q{width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:17px;font-size:15px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;gap:12px;align-items:center}
.qa-q .pl{color:var(--coral);font-weight:900;font-size:19px;line-height:1;transition:transform .25s;flex-shrink:0}
.qa.open .qa-q .pl{transform:rotate(45deg)}
.qa-a{max-height:0;overflow:hidden;transition:max-height .3s ease}
.qa-a p{padding:0 17px 17px;font-size:14px;color:var(--soft);line-height:1.62}

/* final */
.final{text-align:center;background:var(--card-2);border-top:1px solid var(--line)}
.final .tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--coral-deep);border-radius:var(--r-pill);padding:8px 18px;margin-bottom:16px}
.final h2{max-width:22ch;margin:0 auto 12px}
.final p{color:var(--soft);max-width:52ch;margin:0 auto}

footer{padding:28px 0;border-top:1px solid var(--line)}
.foot{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
@media(min-width:700px){.foot{flex-direction:row;justify-content:space-between;text-align:left}}
.foot img{height:17px;width:auto;opacity:.85}
.foot p{font-size:12.5px;color:var(--gray)}

/* sticky CTA mobile */
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(250,249,245,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line-2);padding:10px 14px calc(10px + env(safe-area-inset-bottom));transform:translateY(140%);transition:transform .3s;box-shadow:0 -6px 24px rgba(26,25,23,.12)}
.sticky.show{transform:translateY(0)}
.sticky .btn{width:100%;padding:15px 18px;font-size:15px}
@media(min-width:900px){.sticky{display:none}}

/* ══════════ POPUP DE 2 ETAPAS ══════════ */
.pop{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;background:rgba(20,19,18,.72);backdrop-filter:blur(4px)}
.pop.open{display:flex}
@media(min-width:640px){.pop{align-items:center}}
.pop-box{background:var(--bg);border:1px solid var(--line-2);border-radius:20px 20px 0 0;width:100%;max-height:94dvh;overflow-y:auto;box-shadow:0 -8px 44px rgba(0,0,0,.4);animation:pop-up .28s cubic-bezier(.22,1,.36,1);padding-bottom:max(20px,env(safe-area-inset-bottom))}
@media(min-width:640px){.pop-box{max-width:432px;border-radius:var(--r-lg);animation:pop-in .24s ease-out;padding-bottom:0}}
@keyframes pop-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pop-in{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.pop-grab{display:flex;justify-content:center;padding:10px 0 2px}
@media(min-width:640px){.pop-grab{display:none}}
.pop-grab i{width:38px;height:4px;border-radius:var(--r-pill);background:var(--line-2)}
.pop-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px 0}
.pop-steps{display:flex;align-items:center;gap:6px}
.pop-dot{width:26px;height:4px;border-radius:var(--r-pill);background:var(--line-2)}
.pop-dot.on{background:var(--coral)}
.pop-close{background:none;border:0;cursor:pointer;color:var(--gray);font-size:22px;line-height:1;padding:4px 6px;border-radius:8px}
.pop-close:hover{color:var(--ink);background:var(--card-2)}
.pop-body{padding:14px 22px 24px}
.pop-body h3{font-size:21px;margin-bottom:6px;letter-spacing:-.02em}
.pop-body .sub{font-size:14px;color:var(--soft);margin-bottom:18px;line-height:1.55}
.pop-note{display:flex;gap:10px;align-items:flex-start;background:rgba(37,211,102,.07);border:1px solid rgba(37,211,102,.28);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:16px}
.pop-note svg{width:17px;height:17px;fill:var(--wa-deep);flex-shrink:0;margin-top:1px}
.pop-note p{font-size:12.8px;color:var(--soft);line-height:1.5}
.pop-note b{color:var(--wa-deep);font-weight:800}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);margin-bottom:7px}
.fld input{width:100%;padding:15px 16px;border-radius:var(--r-sm);border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);font-size:16px;font-family:inherit;font-weight:600;outline:none;transition:border-color .18s,box-shadow .18s}
.fld input::placeholder{color:#B6B0A6;font-weight:500}
.fld input:focus{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-soft)}
.fld.ok input{border-color:var(--wa);box-shadow:0 0 0 3px rgba(37,211,102,.12)}
.fld.err input{border-color:var(--danger);box-shadow:0 0 0 3px rgba(185,28,28,.1)}
.hint{display:flex;align-items:center;gap:8px;font-size:12.8px;margin-top:8px;line-height:1.45;min-height:18px}
.hint.wait{color:var(--gray)}
.hint.good{color:var(--success);font-weight:700}
.hint.bad{color:var(--danger);font-weight:700}
.hint.warn{color:var(--coral-deep);font-weight:700}
.hint img{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0}
.spin-i{width:13px;height:13px;border:2px solid var(--line-2);border-top-color:var(--coral);border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.pop .btn{width:100%;margin-top:6px}
.btn-wa{background:var(--wa);color:#fff;box-shadow:0 6px 22px rgba(37,211,102,.3)}
.btn-wa:hover{background:#1EBE5A;transform:translateY(-2px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none}
.pop-privacy{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11.8px;color:var(--gray);margin-top:14px;text-align:center}
.pop-back{background:none;border:0;color:var(--gray);font-size:13px;font-weight:700;cursor:pointer;padding:10px 0 0;width:100%}
.pop-back:hover{color:var(--ink)}
/* sucesso */
.done{text-align:center;padding:8px 0}
.done .mark{width:62px;height:62px;border-radius:50%;background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.3);display:grid;place-items:center;margin:0 auto 16px}
.done .mark svg{width:30px;height:30px;fill:var(--wa-deep)}
.done h3{font-size:22px;margin-bottom:8px}
.done .num{display:inline-block;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:8px 18px;font-weight:800;font-size:15px;margin:12px 0 6px;font-variant-numeric:tabular-nums}
.done .cd{font-size:13px;color:var(--gray);margin:14px 0 16px}
.done .cd b{color:var(--coral-deep);font-variant-numeric:tabular-nums}
