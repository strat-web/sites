<!-- Hotmart launcher (estático no head — exigência do verificador da Hotmart) -->

<style>
:root{
  --cream-bg:#f5f0e8; --cream-dark:#e8e0d0;
  --black-deep:#111; --black-card:#1a1a1a; --black-soft:#1e1e1e; --line-dark:#2c2c2c;
  --orange:#e07a3a; --orange-dark:#c96a2e; --orange-hover:#f28a4a;
  --white:#fff; --green:#22c55e;
  --ink:#1a1a1a; --ink-mute:#5b5346;
  --cream-text:#f5f0e8; --cream-mute:#b8ad99;
  --r:16px; --rbtn:12px;
  --maxw:1080px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--cream-bg);color:var(--ink);line-height:1.55;font-size:16px;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}

/* ---------- sections ---------- */
.sec{padding:64px 0;position:relative}
.section-cream{background-color:var(--cream-bg);
  background-image:repeating-linear-gradient(#00000008 0 1px,#0000 1px 22px),repeating-linear-gradient(90deg,#00000008 0 1px,#0000 1px 22px)}
.section-black{background-color:var(--black-deep);color:var(--cream-text)}
.section-black .ink-mute,.section-black p{color:var(--cream-mute)}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 20px}
.center{text-align:center}

/* ---------- type ---------- */
.headline{font-weight:900;letter-spacing:-.025em;line-height:1.1;font-size:clamp(28px,7vw,46px)}
.eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:14px}
.lead{font-size:clamp(15px,4vw,18px);max-width:620px;margin:16px auto 0;color:var(--ink-mute)}
.section-black .lead{color:var(--cream-mute)}
.accent{color:var(--orange)}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;max-width:460px;margin:0 auto;min-height:60px;padding:14px 22px;
  background:var(--orange);color:#fff;font-weight:800;font-size:clamp(14px,4vw,17px);
  letter-spacing:.3px;border:none;border-radius:var(--rbtn);cursor:pointer;
  box-shadow:0 6px 22px #e07a3a55;transition:all .25s;text-align:center;line-height:1.25;
  animation:pulse 2.6s infinite}
.btn:hover{background:var(--orange-dark);transform:translateY(-2px);box-shadow:0 10px 28px #e07a3a77}
.btn small{display:block;font-weight:600;font-size:12px;opacity:.92;letter-spacing:0}
@keyframes pulse{0%,100%{box-shadow:0 6px 22px #e07a3a44}50%{box-shadow:0 6px 30px #e07a3a99}}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--ink-mute);padding:10px 18px;border:1px solid var(--cream-dark);border-radius:10px}
.section-black .btn-ghost{color:var(--cream-mute);border-color:var(--line-dark)}

.badge{display:inline-flex;align-items:center;gap:7px;background:var(--orange);color:#fff;
  font-weight:700;font-size:13px;padding:8px 18px;border-radius:50px;box-shadow:0 4px 16px #e07a3a55;margin-bottom:18px}
.badge-soft{background:#e07a3a1a;color:var(--orange);box-shadow:none;border:1px solid #e07a3a44}

/* orbit hero animation */
.orbit{width:100%;max-width:258px;margin:0 auto;aspect-ratio:1;position:relative}
.orbit .field{position:relative;width:100%;height:100%;display:grid;place-items:center;
  --unit:258px;--rad1:calc(var(--unit)*.275);--rad2:calc(var(--unit)*.425);
  --mascot:calc(var(--unit)*.21);--emoji:calc(var(--unit)*.07);--d1:40s;--d2:54s;
  --ringline:rgba(217,119,87,.28);--glow:rgba(217,119,87,.45)}
.orbit *,.orbit *::before,.orbit *::after{box-sizing:border-box}
.orbit .oring{position:absolute;top:50%;left:50%;border:1px dashed var(--ringline);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.orbit .oring.r1{width:calc(var(--rad1)*2);height:calc(var(--rad1)*2)}
.orbit .oring.r2{width:calc(var(--rad2)*2);height:calc(var(--rad2)*2)}
.orbit .ring{position:absolute;top:50%;left:50%;width:0;height:0;will-change:transform}
.orbit .ring.r1{--rad:var(--rad1);animation:o-spin var(--d1) linear infinite}
.orbit .ring.r2{--rad:var(--rad2);animation:o-spin var(--d2) linear infinite reverse}
@keyframes o-spin{to{transform:rotate(360deg)}}
.orbit .slot{position:absolute;top:0;left:0;width:0;height:0;transform:rotate(var(--a)) translateY(calc(-1*var(--rad)))}
.orbit .spin{position:absolute;top:0;left:0;width:0;height:0}
.orbit .ring.r1 .spin{animation:o-spin var(--d1) linear infinite reverse}
.orbit .ring.r2 .spin{animation:o-spin var(--d2) linear infinite}
.orbit .deangle{position:absolute;top:0;left:0;width:0;height:0;transform:rotate(calc(-1*var(--a)))}
.orbit .emoji{position:absolute;top:0;left:0;transform:translate(-50%,-50%);font-size:var(--emoji);line-height:1;filter:drop-shadow(0 2px 7px rgba(0,0,0,.28))}
.orbit .mascot{position:relative;width:var(--mascot);height:var(--mascot);display:grid;place-items:center;z-index:5;animation:o-bob 5.5s ease-in-out infinite}
@keyframes o-bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3%) rotate(-1deg)}}
.orbit .mascot .glow{position:absolute;inset:-52%;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,rgba(217,119,87,0) 62%);animation:o-glow 4s ease-in-out infinite;z-index:-1}
@keyframes o-glow{0%,100%{transform:scale(.95)}50%{transform:scale(1.08)}}
.orbit .mascot img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 14px 24px rgba(0,0,0,.3))}
@media(prefers-reduced-motion:reduce){.orbit .ring,.orbit .spin,.orbit .mascot,.orbit .mascot .glow{animation:none!important}}
@media(min-width:760px){.orbit{max-width:328px}.orbit .field{--unit:328px}}

/* claude logo + compat strip */
.cl{width:18px;height:18px;flex-shrink:0;display:inline-block;vertical-align:middle}
.badge .cl{width:15px;height:15px;margin-right:1px}
.claude-strip{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:20px;font-size:13.5px;color:var(--ink-mute);font-weight:600}
.claude-strip b{color:var(--ink);font-weight:800}

/* ---------- hero ---------- */
.hero{padding:46px 0 56px}
.hero .badge{margin-top:4px}
.hero h1{margin:6px 0 0}
.hero .stats{display:flex;justify-content:center;gap:14px;margin:26px 0 0;flex-wrap:wrap}
.stat{background:#fff;border:1px solid var(--cream-dark);border-radius:14px;padding:14px 18px;min-width:96px;box-shadow:0 2px 14px #0000000a}
.stat b{display:block;font-size:22px;font-weight:900;color:var(--ink);letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--ink-mute);font-weight:600}
.hero .btn{margin-top:28px}
.trust{margin-top:22px;font-size:12px;color:var(--ink-mute)}
.trust b{display:block;text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:#a99;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.chip{background:#fff;border:1px solid var(--cream-dark);border-radius:50px;padding:5px 13px;font-size:12px;font-weight:600;color:var(--ink-mute)}

/* ---------- grid cards ---------- */
.grid{display:grid;gap:14px;margin-top:38px}
.g2{grid-template-columns:1fr}
.g3{grid-template-columns:1fr}
.card{border-radius:var(--r);padding:24px;text-align:left}
.card-dark{background:var(--black-card);border:1px solid var(--line-dark)}
.card-dark.glow{border-color:#e07a3a55;box-shadow:0 0 30px #e07a3a1a}
.card-light{background:#fff;border:1px solid var(--cream-dark);box-shadow:0 2px 18px #0000000a}
.card h3{font-size:17px;font-weight:800;margin-bottom:8px;letter-spacing:-.01em}
.card p{font-size:14.5px}
.ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px;background:#e07a3a1f;color:var(--orange)}

/* steps */
.step-n{font-size:13px;font-weight:800;color:var(--orange);letter-spacing:.1em;margin-bottom:6px}
.checks{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.check{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;color:var(--cream-mute)}
.check i{color:var(--green);margin-top:3px;font-size:13px}

/* compare */
.cmp{display:grid;gap:14px;margin-top:34px;grid-template-columns:1fr}
.cmp-card{border-radius:var(--r);padding:22px;text-align:left}
.cmp-bad{background:#fff;border:1px solid var(--cream-dark)}
.cmp-good{background:var(--black-card);border:1px solid #e07a3a55;color:var(--cream-text)}
.cmp-h{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.cmp-bad .cmp-h{color:#b4341f}.cmp-good .cmp-h{color:var(--orange)}
.bubble{background:#f4efe6;border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:10px}
.cmp-good .bubble{background:#000;color:var(--cream-mute)}
.bubble-q{font-size:13px;color:#8a8275;margin-bottom:8px}
.tagline{font-size:12px;font-weight:700;padding:7px 12px;border-radius:8px;display:inline-block}
.cmp-bad .tagline{background:#fde8e4;color:#b4341f}
.cmp-good .tagline{background:#143d24;color:#7ee0a0}

/* personas */
.persona{background:var(--black-card);border:1px solid var(--line-dark);border-radius:var(--r);padding:22px;text-align:left}
.persona .pill{display:inline-block;background:#e07a3a22;color:var(--orange);font-size:12px;font-weight:700;padding:5px 12px;border-radius:50px;margin-bottom:12px}
.persona .q{font-size:14px;color:var(--cream-text);font-style:italic;line-height:1.5}
.persona .sol{margin-top:14px;display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--cream-mute);font-weight:600}
.persona .sol i{color:var(--orange);margin-top:3px}

/* categorias */
.cat{background:#fff;border:1px solid var(--cream-dark);border-radius:14px;padding:18px;text-align:left;box-shadow:0 2px 14px #0000000a}
.cat-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.cat-h .ci{font-size:18px}
.cat-h .cn{font-weight:800;font-size:14.5px;flex:1;letter-spacing:-.01em}
.cat-h .cc{font-size:12px;font-weight:800;color:var(--orange);background:#e07a3a16;padding:3px 9px;border-radius:50px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.p{font-size:11.5px;color:var(--ink-mute);background:#f3eee4;border:1px solid var(--cream-dark);border-radius:50px;padding:4px 10px}

/* depoimentos */
.testi{background:var(--black-card);border:1px solid var(--line-dark);border-radius:var(--r);padding:22px;text-align:left}
.stars{color:#f6b73c;font-size:14px;letter-spacing:2px;margin-bottom:12px}
.testi p{font-size:14px;color:var(--cream-text);line-height:1.55}
.t-auth{display:flex;align-items:center;gap:11px;margin-top:16px}
.t-av{width:38px;height:38px;border-radius:50%;background:var(--orange);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.t-name{font-weight:700;font-size:14px;color:#fff}.t-role{font-size:12px;color:var(--cream-mute)}

/* preço */
.price-card{max-width:520px;margin:34px auto 0;background:var(--black-card);border:1px solid #e07a3a55;border-radius:20px;padding:26px;box-shadow:0 0 40px #e07a3a14;text-align:left}
.price-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line-dark)}
.price-head b{font-size:15px;color:#fff}
.save{background:var(--green);color:#06270f;font-size:12px;font-weight:800;padding:5px 11px;border-radius:50px}
.pitem{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff0d;font-size:13px}
.pitem .pn{color:var(--cream-mute);display:flex;gap:8px;align-items:flex-start}
.pitem .pn i{color:var(--green);margin-top:3px;font-size:11px}
.pitem .pp{color:#777;text-decoration:line-through;white-space:nowrap}
.subtotal{display:flex;justify-content:space-between;padding:14px 0 4px;font-size:13px;color:var(--cream-mute)}
.subtotal s{color:#777}
.bigprice{text-align:center;padding:18px 0 6px}
.bigprice .from{font-size:13px;color:var(--cream-mute)}
.bigprice .from s{color:#777}
.bigprice .v{font-size:54px;font-weight:900;color:#fff;letter-spacing:-.03em;line-height:1}
.bigprice .v span{font-size:22px;color:var(--orange);vertical-align:super}
.bigprice .note{font-size:12px;color:var(--cream-mute);margin-top:4px}
.ptrust{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:16px;font-size:12px;color:var(--cream-mute)}
.ptrust span{display:inline-flex;align-items:center;gap:6px}.ptrust i{color:var(--orange)}

/* garantia */
.guarantee{max-width:560px;margin:0 auto;background:#fff;border:1px solid var(--cream-dark);border-radius:20px;padding:34px 24px;box-shadow:0 4px 30px #0000000d}
.shield{font-size:42px;margin-bottom:12px}
.gstats{display:flex;justify-content:center;gap:14px;margin:22px 0;flex-wrap:wrap}
.gstat b{display:block;font-size:22px;font-weight:900;color:var(--orange)}
.gstat span{font-size:12px;color:var(--ink-mute)}
.gmail{font-size:13px;color:var(--ink-mute);margin-bottom:18px}.gmail a{color:var(--orange);font-weight:600}

/* faq */
.faq{max-width:680px;margin:34px auto 0;text-align:left}
.qa{background:#fff;border:1px solid var(--cream-dark);border-radius:12px;margin-bottom:10px;overflow:hidden}
.qa-q{width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:17px 18px;font-size:14.5px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;gap:12px;align-items:center;font-family:inherit}
.qa-q i{color:var(--orange);transition:transform .25s;flex-shrink:0}
.qa.open .qa-q i{transform:rotate(45deg)}
.qa-a{max-height:0;overflow:hidden;transition:max-height .3s ease}
.qa-a p{padding:0 18px 17px;font-size:13.5px;color:var(--ink-mute);line-height:1.6}

/* support strip (sem footer) */
.support{padding:48px 0;text-align:center}
.support .sbtn{display:inline-flex;align-items:center;justify-content:center;gap:11px;background:#25d366;border:none;border-radius:14px;padding:18px 34px;font-weight:800;font-size:clamp(15px,4.5vw,18px);color:#fff;box-shadow:0 8px 26px #25d36655;transition:all .25s;max-width:420px;width:100%}
.support .sbtn i{color:#fff;font-size:23px}
.support .sbtn:hover{background:#1ebe5a;transform:translateY(-2px);box-shadow:0 12px 32px #25d36677}
.copy{margin-top:26px;font-size:12px;color:#a99}

/* sticky bottom CTA (mobile) */
.sticky-cta{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#111f2;backdrop-filter:blur(8px);
  border-top:1px solid var(--line-dark);padding:10px 14px;transform:translateY(120%);transition:transform .3s;
  box-shadow:0 -6px 24px #00000033}
.sticky-cta.show{transform:translateY(0)}
.sticky-cta a{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--orange);color:#fff;font-weight:800;font-size:15px;padding:14px;border-radius:11px;box-shadow:0 4px 16px #e07a3a55}
.sticky-cta a:hover{background:var(--orange-dark)}
body{padding-bottom:0}

/* ---------- desktop ---------- */
@media(min-width:760px){
  .sec{padding:84px 0}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .cmp{grid-template-columns:1fr 1fr}
  .cats{grid-template-columns:repeat(3,1fr)}
  .sticky-cta{display:none}
  .hero{padding:64px 0 72px}
}
@media(min-width:760px){.cats{display:grid;gap:14px;margin-top:38px}}
.cats{display:grid;gap:12px;margin-top:34px;grid-template-columns:1fr}
@media(min-width:560px){.cats{grid-template-columns:1fr 1fr}}
@media(min-width:980px){.cats{grid-template-columns:repeat(3,1fr)}}
</style>
