<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* Paleta Anthropic */
  --cream:       #faf9f5;
  --cream-dark:  #f0ede3;
  --cream-card:  #f5f2ea;
  --brown:       #141413;
  --brown-mid:   #3a3a37;
  --muted:       #b0aea5;
  --terra:       #d97757;
  --terra-light: #fdf3ee;
  --terra-border:rgba(217,119,87,0.28);
  --border:      #e8e6dc;
  /* Fontes */
  --serif: 'Lora', Georgia, 'Times New Roman', serif;
  --sans:  'Poppins', Arial, Helvetica, sans-serif;
  --mono:  'Spline Sans Mono', ui-monospace, 'SF Mono', monospace;
  --r:     8px;
  --rl:    14px;
  --rpill: 100px;
}
html { scroll-behavior: smooth; }
body { font-family: var(--serif); background: var(--cream); color: var(--brown); line-height: 1.65; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
p { font-family: var(--serif); color: var(--brown); line-height: 1.75; }
.container { max-width: 1160px; margin: 0 auto; padding: 0 32px; }
@media (max-width: 640px) { .container { padding: 0 18px; } }

/* ── HEADINGS ── */
h1,h2,h3,h4 { font-family: var(--serif); font-weight: 600; line-height: 1.1; color: var(--brown); }
h1 { font-size: clamp(34px,5vw,60px); }
h2 { font-size: clamp(26px,4vw,46px); font-weight: 500; }
h3 { font-size: clamp(16px,2vw,20px); font-weight: 600; }
.accent { color: var(--terra); }
.eyebrow { font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--terra); margin-bottom: 14px; display: block; }

/* ── BUTTONS ── */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; font-family: var(--sans); font-weight: 600; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; border: none; border-radius: var(--rpill); transition: opacity .15s, transform .15s; }
.btn:hover { opacity: .87; transform: translateY(-1px); }
.btn-terra { background: var(--terra); color: #fff; }
.btn-outline { background: transparent; color: var(--brown); border: 1.5px solid var(--border); }
.btn-outline:hover { border-color: var(--terra); color: var(--terra); opacity: 1; }
.btn-lg { padding: 17px 34px; font-size: 14px; }

/* ── SECTION CTA ── */
.section-cta { background: var(--terra); padding: 22px 32px; text-align: center; }
.section-cta a { font-family: var(--sans); font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #fff; display: block; }
.section-cta a:hover { opacity: .88; }

/* ── NAV ── */
nav { position: sticky; top: 0; z-index: 200; background: rgba(250,249,245,.93); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
.nav-inner { display: flex; align-items: center; justify-content: space-between; padding: 0 32px; height: 62px; max-width: 1160px; margin: 0 auto; }
.nav-logo { font-family: var(--mono); font-size: 15px; font-weight: 600; display: flex; align-items: center; }
.nav-logo .cur { display: inline-block; width: 8px; height: 15px; background: var(--terra); margin-left: 3px; border-radius: 1px; animation: blink 1.1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }
.nav-links { display: flex; gap: 32px; align-items: center; }
.nav-links a { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--brown); transition: color .15s; }
.nav-links a:hover { color: var(--brown); }
@media (max-width: 768px) { .nav-links { display: none; } }

/* ── HERO ── */
#hero { padding: 80px 0 72px; border-bottom: 1px solid var(--border); }
.hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: flex-start; }
.hero-grid > div:first-child { margin-top: -20px; }
@media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; gap: 48px; } }
@media (max-width: 640px) {
  #hero { position: relative; }
  .hero-grid { grid-template-columns: 1fr; gap: 24px; }
  .hero-grid > div:first-child { order: 2; }
  .hero-grid > div:last-child {
    order: 1;
    height: 70px;
    margin-top: 0;
    margin-bottom: -50px;
    position: relative;
    z-index: 10;
  }
  .skills-orbit { min-height: 70px; }
  .skills-orbit .field { --unit: 35px; }
}
.hero-title { font-size: clamp(32px,4.5vw,54px); line-height: 1.1; margin-bottom: 22px; }
.hero-sub { font-family: var(--serif); font-size: 16px; color: var(--brown); margin-bottom: 36px; max-width: 460px; line-height: 1.8; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 36px; }
.hero-stats { display: flex; border: 1px solid var(--border); border-radius: var(--rl); overflow: hidden; width: fit-content; background: var(--cream-card); }
.hero-stat { padding: 13px 22px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--border); }
.hero-stat:last-child { border-right: none; }
.hero-stat-val { font-family: var(--mono); font-size: 22px; font-weight: 600; color: var(--terra); line-height: 1; }
.hero-stat-lbl { font-family: var(--sans); font-size: 11px; color: var(--brown); letter-spacing: .04em; }

/* ── SKILLS ORBIT ── */
.hero-grid > div:last-child {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  height: 1200px;
  width: 100%;
  margin-top: -380px;
  margin-bottom: -300px;
  position: relative;
  z-index: 1;
  padding-top: 0;
}

.skills-orbit {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.skills-orbit *,
.skills-orbit *::before,
.skills-orbit *::after { box-sizing: border-box; }

.skills-orbit .field {
  position: relative;
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  --unit: 520px;
  --rad1: calc(var(--unit) * 0.275);
  --rad2: calc(var(--unit) * 0.425);
  --mascot: calc(var(--unit) * 0.205);
  --emoji: calc(var(--unit) * 0.062);
  --d1: 40s;
  --d2: 54s;
  --line: rgba(217,119,87,0.10);
  --ringline: rgba(217,119,87,0.22);
  --glow: rgba(217,119,87,0.5);
}

.skills-orbit .grid-bg {
  position: absolute;
  inset: -2px;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: calc(var(--unit) * 0.055) calc(var(--unit) * 0.055);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 28%, transparent 76%);
  mask-image: radial-gradient(circle at 50% 50%, #000 28%, transparent 76%);
  pointer-events: none;
}

.skills-orbit .orbit-ring {
  position: absolute;
  top: 50%; left: 50%;
  border: 1px dashed var(--ringline);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
.skills-orbit .orbit-ring.r1 { width: calc(var(--rad1) * 2); height: calc(var(--rad1) * 2); }
.skills-orbit .orbit-ring.r2 { width: calc(var(--rad2) * 2); height: calc(var(--rad2) * 2); }

.skills-orbit .ring {
  position: absolute;
  top: 50%; left: 50%;
  width: 0; height: 0;
  will-change: transform;
}
.skills-orbit .ring.r1 { --rad: var(--rad1); animation: so-spin var(--d1) linear infinite; }
.skills-orbit .ring.r2 { --rad: var(--rad2); animation: so-spin var(--d2) linear infinite reverse; }
@keyframes so-spin { to { transform: rotate(360deg); } }

.skills-orbit .slot {
  position: absolute;
  top: 0; left: 0;
  width: 0; height: 0;
  transform: rotate(var(--a)) translateY(calc(-1 * var(--rad)));
}
.skills-orbit .spin {
  position: absolute;
  top: 0; left: 0;
  width: 0; height: 0;
  will-change: transform;
}
.skills-orbit .ring.r1 .spin { animation: so-spin var(--d1) linear infinite reverse; }
.skills-orbit .ring.r2 .spin { animation: so-spin var(--d2) linear infinite; }
.skills-orbit .deangle {
  position: absolute;
  top: 0; left: 0;
  width: 0; height: 0;
  transform: rotate(calc(-1 * var(--a)));
}
.skills-orbit .emoji {
  position: absolute;
  top: 0; left: 0;
  transform: translate(-50%, -50%);
  font-size: var(--emoji);
  line-height: 1;
  filter: drop-shadow(0 2px 7px rgba(0,0,0,0.28));
  user-select: none;
}

.skills-orbit .mascot {
  position: relative;
  width: var(--mascot);
  height: var(--mascot);
  display: grid;
  place-items: center;
  z-index: 5;
  animation: so-bob 5.5s ease-in-out infinite;
}
@keyframes so-bob {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-3%) rotate(-1deg); }
}
.skills-orbit .mascot .glow {
  position: absolute;
  inset: -52%;
  border-radius: 50%;
  background: radial-gradient(circle, var(--glow) 0%, rgba(217,119,87,0) 62%);
  animation: so-glow 4s ease-in-out infinite;
  z-index: -1;
  pointer-events: none;
}
@keyframes so-glow {
  0%, 100% { transform: scale(0.95); }
  50% { transform: scale(1.08); }
}
.skills-orbit .mascot img {
  width: 100%; height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 14px 24px rgba(0,0,0,0.30));
}

@media (prefers-reduced-motion: reduce) {
  .skills-orbit .ring,
  .skills-orbit .spin,
  .skills-orbit .mascot,
  .skills-orbit .glow { animation: none !important; }
}

/* ── LOGOS STRIP ── */
#logos { padding: 26px 0; border-bottom: 1px solid var(--border); }
.logos-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.logos-lbl { font-family: var(--sans); font-size: 11px; color: var(--brown-mid); letter-spacing: .1em; text-transform: uppercase; margin-right: 4px; }
.logo-chip { font-family: var(--sans); background: var(--cream-card); border: 1px solid var(--border); border-radius: var(--rpill); padding: 5px 13px; font-size: 12px; font-weight: 500; color: var(--brown); }

/* ── SECTION WRAPPER (terminal frame) ── */
section { padding: 80px 0; }
section.alt { background: var(--cream-dark); }
.term-frame { border: 1px solid var(--border); border-radius: var(--rl); overflow: hidden; background: var(--cream); }
.term-bar { background: var(--cream-dark); border-bottom: 1px solid var(--border); padding: 11px 16px; display: flex; align-items: center; gap: 6px; }
.term-path { margin-left: 8px; font-size: 12px; color: var(--terra); font-weight: 500; }
.term-inner { padding: 48px 40px 40px; }
@media (max-width: 640px) { .term-inner { padding: 32px 20px 28px; } }

/* ── INSTALL STEPS ── */
.install-head { text-align: center; margin-bottom: 48px; }
.install-head h2 { margin-bottom: 12px; color: var(--brown); }
.install-head p { color: #555; }
.install-timeline { display: flex; align-items: flex-start; justify-content: center; position: relative; margin-bottom: 40px; }
.install-timeline::before { content: ''; position: absolute; top: 28px; left: 15%; right: 15%; height: 1px; background: #e0e0e0; z-index: 0; }
.step-node { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; }
.step-circle { width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--terra); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: var(--terra); background: #fff; margin-bottom: 12px; }
.step-name { font-family: var(--sans); font-size: 15px; font-weight: 600; color: var(--brown); margin-bottom: 4px; text-align: center; }
.step-sub { font-family: var(--sans); font-size: 11px; color: var(--terra); text-align: center; letter-spacing: .04em; }
.install-cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
@media (max-width: 700px) { .install-cards { grid-template-columns: 1fr; } }
.icard { background: #fff; border: 1px solid #e4e4e4; border-radius: var(--rl); padding: 20px; }
.icard-txt { font-size: 13px; color: #555; margin-bottom: 16px; line-height: 1.7; }
.icard-checks { display: flex; flex-direction: column; gap: 8px; }
.icard-check { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #222; }
.icard-check-icon { color: var(--terra); }
.chat-mock { display: flex; flex-direction: column; gap: 8px; }
.chat-user { background: var(--terra); border-radius: var(--r); padding: 10px 12px; font-size: 12px; color: #fff; align-self: flex-end; max-width: 85%; text-align: center; }
.chat-ai { background: #f4f4f4; border: 1px solid #e4e4e4; border-radius: var(--r); padding: 10px 12px; font-size: 12px; color: #333; }
.chat-ai-check { color: var(--terra); font-weight: 700; }
.result-box { background: #f8f8f8; border: 1px solid #e4e4e4; border-radius: var(--r); padding: 12px; }
.result-box-title { font-size: 13px; font-weight: 700; color: #222; margin-bottom: 3px; }
.result-box-sub { font-size: 11px; color: #888; margin-bottom: 10px; }
.result-tags { display: flex; gap: 8px; flex-wrap: wrap; }
.rtag { font-size: 11px; border: 1px solid #e0e0e0; border-radius: var(--rpill); padding: 3px 10px; color: #888; background: #fff; }
.rtag-acc { color: var(--terra); border-color: var(--terra-border); background: var(--terra-light); }
/* install browser bar */
.install-browser-bar { background: #e8e8e8; border-bottom: 1px solid #d0d0d0; padding: 10px 18px; display: flex; align-items: center; gap: 12px; }
.install-url-bar { flex: 1; background: #fff; border: 1px solid #d0d0d0; border-radius: var(--rpill); padding: 5px 16px; font-family: var(--mono); font-size: 12px; color: #888; text-align: center; }

/* ── PERSONAS NEW ── */
.section-head-center { text-align: center; margin-bottom: 48px; }
.section-head-center h2 { margin-bottom: 12px; }
.personas-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
@media (max-width: 900px) { .personas-grid { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 540px)  { .personas-grid { grid-template-columns: 1fr; } }
.persona-card { background: var(--cream-card); border: 1px solid var(--border); border-radius: var(--rl); padding: 26px; }
.persona-pill { font-family: var(--sans); display: inline-block; background: var(--terra-light); color: var(--terra); border: 1px solid var(--terra-border); border-radius: var(--rpill); padding: 4px 12px; font-size: 12px; font-weight: 600; margin-bottom: 16px; }
.persona-quote { font-size: 13px; font-style: italic; color: var(--brown-mid); margin-bottom: 16px; line-height: 1.7; }
.persona-sol { display: flex; align-items: flex-start; gap: 6px; font-size: 14px; font-weight: 700; color: var(--brown); line-height: 1.5; }
.persona-arrow { color: var(--terra); flex-shrink: 0; margin-top: 1px; }

/* ── CATEGORIES NEW ── */
.cats-grid-new { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
@media (max-width: 900px) { .cats-grid-new { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 480px) { .cats-grid-new { grid-template-columns: 1fr; } }
.cat-new { background: var(--cream-card); border: 1px solid var(--border); border-radius: var(--rl); padding: 16px; }
.cat-new-head { display: flex; align-items: center; gap: 7px; margin-bottom: 11px; }
.cat-folder { font-size: 14px; }
.cat-new-name { font-size: 13px; font-weight: 700; color: var(--brown); flex: 1; }
