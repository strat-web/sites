<meta name="theme-color" content="#0B0912" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0B0912; --bg-1:#120F1C; --bg-2:#181322; --bg-3:#201A2E;
  --brand:#7200db; --brand-glow:#9d4dff; --brand-2:#b983ff; --brand-dark:#5a0fb0; --brand-deep:#460c8f;
  --data:#38bdf8; --meta:#4f8dff; --insta:#e1476b; --wa:#25D366;
  --text:#F3F1F8; --text-sec:#C0B9D0; --text-gray:#847C98; --text-dark:#5d5670;
  --border:rgba(255,255,255,.07); --border-2:rgba(157,77,255,.24);
  --shadow-brand:0 6px 34px rgba(114,0,219,.42);
  --shadow-soft:0 0 44px rgba(114,0,219,.1);
  --danger:#f0616e; --ok:#3ddb84; --warn:#f5b544;
  --r-card:16px; --r-lg:22px; --r-sm:12px; --r-pill:50px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --maxw:1120px;
  --sec-y:clamp(58px,8vw,104px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 640px at 84% -10%, rgba(114,0,219,.2), transparent 60%),
    radial-gradient(760px 520px at -10% 106%, rgba(157,77,255,.12), transparent 60%);
}
main,header,footer{position:relative;z-index:1}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--text)}
h1{font-size:clamp(33px,5.2vw,57px);font-weight:900;letter-spacing:-.03em;line-height:1.06}
h2{font-size:clamp(27px,4vw,44px);letter-spacing:-.025em}
h3{font-size:clamp(18px,2.2vw,23px)}
p{margin:0}
.container{max-width:var(--maxw);margin:0 auto;padding:0 22px}
@media(max-width:480px){.container{padding:0 16px}}
section{padding:var(--sec-y) 0;position:relative}
.narrow{max-width:900px;margin-left:auto;margin-right:auto}
.grad{background:linear-gradient(95deg,var(--brand-glow),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-c{color:var(--brand-glow)}

.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--brand-glow)}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--brand-glow)}
.eyebrow.c{justify-content:center}
.only-mobile{display:none}
@media(max-width:720px){.only-mobile{display:block}}
.eyebrow-como{font-size:20px}
.eyebrow-como::before{display:none}
.section-head{display:flex;flex-direction:column;gap:15px;margin-bottom:46px}
.section-head.center{align-items:center;text-align:center}
.section-head p{color:var(--text-sec);max-width:62ch}
.muted{color:var(--text-sec)} .gray{color:var(--text-gray)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;border:0;font-family:var(--font);font-weight:700;font-size:15px;border-radius:var(--r-pill);padding:16px 30px;transition:transform .16s ease, box-shadow .25s ease, background .25s ease}
.btn-primary{background:linear-gradient(95deg,var(--brand-dark),var(--brand));color:#fff;box-shadow:var(--shadow-brand);letter-spacing:.01em}
.btn-primary:hover{transform:translateY(-2px);background:linear-gradient(95deg,var(--brand),var(--brand-glow));box-shadow:0 8px 44px rgba(114,0,219,.55)}
.btn-ghost{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}
.btn-lg{padding:19px 38px;font-size:16px}
.btn svg{flex:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}.btn:hover{transform:none}}

/* Announcement */
.announce{background:linear-gradient(95deg,var(--brand-dark),var(--brand));color:#fff;text-align:center;font-size:13px;font-weight:700;letter-spacing:.01em;padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}
.announce .dot{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.6);animation:apulse 1.9s infinite;flex:none}
@keyframes apulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}

/* Header */
.header{position:sticky;top:0;z-index:50;background:rgba(11,9,18,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:var(--maxw);margin:0 auto;padding:12px 22px}
.logo img{height:30px;width:auto}
.nav{display:none;gap:28px;font-size:14px;color:var(--text-sec)}
.nav a:hover{color:var(--text)}
@media(min-width:960px){.nav{display:flex}}
.header .btn{padding:11px 20px;font-size:13px}
@media(max-width:560px){.header .btn{padding:10px 15px;font-size:12px}.logo img{height:26px}}

/* HERO */
.hero{padding-top:clamp(40px,6vw,72px);padding-bottom:clamp(30px,4vw,50px);margin-bottom:-15px;text-align:center;position:relative;overflow:hidden}
.hero-top{position:relative;padding-top:clamp(110px,calc(26vw - 110px),270px)}
@media(max-width:720px){.hero-top{padding-top:0px;margin-top:-20px}.hero{aspect-ratio:1080/1850;margin-bottom:-120px;display:flex;flex-direction:column;justify-content:flex-start}}
.hero-top>*{position:relative;z-index:1}
.hero-bg{position:absolute;left:0;right:0;top:-109px;width:auto;max-width:none;height:calc(100% + 79px);z-index:0;pointer-events:none;background-image:url('/midia/hero-people.webp');background-repeat:no-repeat;background-position:top -12px center;background-size:100% auto;opacity:.32}
@media(max-width:960px){.hero-bg{top:0;height:100%}}
@media(max-width:720px){.hero-bg{display:block;left:0;right:0;top:-95px;bottom:auto;width:auto;height:calc(100% + 95px);background-image:url('/midia/hero-mobile.webp');background-position:bottom -88px center;background-size:100% auto;opacity:.3}}
.hero .badge{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:var(--r-pill);background:rgba(114,0,219,.14);border:1px solid var(--border-2);color:var(--brand-2);font-size:13px;font-weight:600;margin-bottom:26px}
.hero .badge .dot{width:7px;height:7px;border-radius:50%;background:var(--brand-glow);box-shadow:0 0 10px var(--brand-glow)}
.hero h1{max-width:none;margin:0 auto}
.hero .sub{margin:22px auto 0;max-width:none;color:var(--text-sec);font-size:clamp(16px,1.9vw,20px)}
.hero-ctas{margin-top:34px;display:flex;justify-content:center;flex-wrap:wrap;gap:14px}
@media(max-width:720px){.hero-ctas{margin-top:260px}}
.hero-note{margin-top:16px;font-size:13px;color:#FFFFFF}
.trust{margin-top:26px;display:flex;justify-content:center;flex-wrap:wrap;gap:10px 22px;font-size:13px;color:#FFFFFF}
.trust span{display:inline-flex;align-items:center;gap:7px}
.trust svg{flex:none;color:var(--brand-glow)}
@media(max-width:520px){.trust{gap:8px 14px;font-size:12px}}
@media(max-width:720px){.trust{flex-direction:column;align-items:center;gap:10px}}

/* ===== product mockup (browser frame) ===== */
.showcase{margin-top:clamp(38px,5vw,58px);position:relative}
.showcase::after{content:"";position:absolute;inset:-6% 8% -30% 8%;z-index:-1;background:radial-gradient(closest-side,rgba(114,0,219,.28),transparent);filter:blur(30px)}
.browser{max-width:960px;margin:0 auto;background:var(--bg-1);border:1px solid var(--border-2);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.browser-bar{display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--bg-2);border-bottom:1px solid var(--border)}
.bdot{width:11px;height:11px;border-radius:50%;background:#332c44;flex:none}
.bdot:nth-child(1){background:#ef6a5f}.bdot:nth-child(2){background:#f4bd4f}.bdot:nth-child(3){background:#4fc06a}
.burl{margin-left:8px;flex:1;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-size:12px;color:var(--text-gray);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev-tag{flex:none;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-2);background:rgba(114,0,219,.16);border:1px solid var(--border-2);padding:4px 9px;border-radius:var(--r-pill)}
.app{display:flex;min-height:360px;text-align:left}
.app-side{flex:none;width:180px;background:var(--bg-2);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.app-side .s-logo{display:flex;align-items:center;gap:8px;padding:4px 8px 14px}
.app-side .s-logo img{height:20px}
.app-side .s-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;font-size:13px;color:var(--text-gray);font-weight:500}
.app-side .s-item svg{width:16px;height:16px;flex:none}
.app-side .s-item.on{background:rgba(114,0,219,.18);color:var(--text);font-weight:600}
.app-side .s-item.on svg{color:var(--brand-glow)}
.app-main{flex:1;min-width:0;padding:20px 22px}
.app-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.app-head h4{font-size:17px}
.app-head span{font-size:12px;color:var(--text-gray)}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:14px}
.stat .k{font-size:11px;color:var(--text-gray);letter-spacing:.02em}
.stat .v{font-size:22px;font-weight:800;margin-top:5px;letter-spacing:-.02em}
.stat .delta{font-size:11px;font-weight:700;margin-top:4px;display:inline-flex;align-items:center;gap:4px}
.stat .delta.up{color:var(--ok)} .stat .delta.brand{color:var(--brand-2)}
.app-cards{display:grid;grid-template-columns:1.1fr 1fr;gap:12px}
.mcard{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:15px}
.mcard .ct{font-size:12px;color:var(--text-sec);font-weight:600;margin-bottom:14px}
.bars{display:flex;align-items:flex-end;gap:9px;height:120px}
.bars .bar{flex:1;background:linear-gradient(180deg,var(--brand-glow),var(--brand-deep));border-radius:6px 6px 3px 3px;position:relative;min-width:0}
.bars .bar span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--text-gray)}
.orow{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px}
.orow .od{width:8px;height:8px;border-radius:50%;flex:none}
.orow .on{flex:1;color:var(--text-sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .op{color:var(--text);font-weight:700}
.obar{height:5px;border-radius:3px;background:var(--bg-3);margin-top:3px;overflow:hidden}
.obar i{display:block;height:100%;border-radius:3px}
@media(max-width:720px){
  .app-side{display:none}
  .stat-row{grid-template-columns:1fr}
  .app-cards{grid-template-columns:1fr}
  .stat-row .stat:nth-child(n){display:block}
}

/* kanban mockup */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px}
.kb-col{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:12px;min-width:0}
.kb-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--text-sec);margin-bottom:12px}
.kb-h .cnt{background:var(--bg-3);color:var(--text-gray);font-size:11px;padding:1px 8px;border-radius:var(--r-pill)}
.kb-col.win .kb-h{color:var(--brand-2)}
.kb-card{background:var(--bg-1);border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-bottom:9px}
.kb-card.hl{border-color:var(--border-2);box-shadow:var(--shadow-soft)}
.kb-name{font-size:13px;font-weight:600}
.kb-val{font-size:12px;color:var(--text-gray);margin-top:2px}
.kb-badge{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:10.5px;font-weight:600;color:var(--text-sec);background:var(--bg-3);border-radius:var(--r-pill);padding:3px 9px}
.kb-badge .od{width:7px;height:7px;border-radius:50%;flex:none}
@media(max-width:720px){.kanban{grid-template-columns:repeat(2,1fr)}}
@media(max-width:440px){.kanban{grid-template-columns:1fr}.kb-col:nth-child(n){display:block}}

/* grid cards */
.grid{display:grid;gap:18px}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.cols-3,.cols-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.cols-2,.cols-3,.cols-4{grid-template-columns:1fr}}
.card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--r-card);padding:26px 24px;transition:border-color .2s ease,transform .2s ease,box-shadow .25s ease;position:relative}
.card:hover{border-color:var(--border-2);transform:translateY(-3px);box-shadow:var(--shadow-soft)}
.card .ic{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(114,0,219,.15);color:var(--brand-glow);margin-bottom:18px}
.card .ic svg{width:24px;height:24px}
.card h3{margin-bottom:9px;font-size:19px}
.card p{color:var(--text-sec);font-size:15px}
.soon{position:absolute;top:16px;right:16px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-2);background:rgba(114,0,219,.14);border:1px solid var(--border-2);padding:3px 9px;border-radius:var(--r-pill)}

/* problem */
.problem{background:var(--bg-1)}
.pain-list{display:grid;gap:14px;margin-top:8px}
.pain{display:flex;gap:14px;align-items:flex-start;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-card);padding:18px 20px}
.pain .x{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(240,97,110,.14);color:var(--danger);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;margin-top:1px}
.pain p{font-size:15px}.pain b{color:var(--text)}

/* steps */
.how-steps{display:flex;flex-direction:column;gap:22px;margin-top:10px}
.how-step h3{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-2);margin-bottom:7px}
.how-num{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:rgba(114,0,219,.18);color:var(--brand-glow);font-size:12px;font-weight:800}
.how-step p{color:var(--text-sec);font-size:15px;margin:0}
@media(max-width:860px){.how-step h3{justify-content:center}}

/* funnel animation */
.how-hero{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(30px,5vw,64px);align-items:stretch}
.how-text{display:flex;flex-direction:column;gap:15px;text-align:left}
@media(max-width:860px){.how-hero{grid-template-columns:1fr;text-align:center}.how-text{text-align:center;align-items:center}.how-hero .eyebrow{justify-content:center}}
.funnel-viz{width:100%;height:100%}
.funnel-svg{display:block;width:100%;height:100%}
@media(max-width:860px){.funnel-viz{height:auto;max-width:480px;margin:0 auto}.funnel-svg{height:auto}}
@keyframes fx-piece {
  0%, 34% { transform: translate(150px, 0px); }
  46% { transform: translate(-6px, 0px); animation-timing-function: cubic-bezier(.3,1.4,.5,1); }
  50% { transform: translate(2px, 0px); }
  53%, 100% { transform: translate(0, 0); }
}
@keyframes fx-ghost { 0%, 44% { opacity: .55; } 50%, 100% { opacity: 0; } }
@keyframes fx-snap { 0%, 48% { opacity: 0; } 52% { opacity: 1; } 62%, 100% { opacity: 0; } }
@keyframes fx-dotA { 0% { transform: translate(0,0); opacity: 0; } 2% { opacity: 1; } 10% { transform: translate(0,312px); opacity: 1; } 15% { transform: translate(-22px,402px); opacity: 0; } 100% { opacity: 0; } }
@keyframes fx-dotI { 0%, 2% { transform: translate(0,0); opacity: 0; } 4% { opacity: 1; } 12% { transform: translate(0,312px); opacity: 1; } 17% { transform: translate(18px,402px); opacity: 0; } 100% { opacity: 0; } }
@keyframes fx-dotD { 0%, 4% { transform: translate(0,0); opacity: 0; } 6% { opacity: 1; } 14% { transform: translate(0,312px); opacity: 1; } 19% { transform: translate(-34px,402px); opacity: 0; } 100% { opacity: 0; } }
@keyframes fx-dotE { 0%, 6% { transform: translate(0,0); opacity: 0; } 8% { opacity: 1; } 16% { transform: translate(0,312px); opacity: 1; } 21% { transform: translate(30px,402px); opacity: 0; } 100% { opacity: 0; } }
@keyframes fx-dotB { 0%, 8% { transform: translate(0,0); opacity: 0; } 10% { opacity: 1; } 18% { transform: translate(0,312px); opacity: 1; } 23% { transform: translate(14px,402px); opacity: 0; } 100% { opacity: 0; } }
@keyframes fx-dotH { 0%, 10% { transform: translate(0,0); opacity: 0; } 12% { opacity: 1; } 20% { transform: translate(0,312px); opacity: 1; } 25% { transform: translate(40px,402px); opacity: 0; } 100% { opacity: 0; } }
@keyframes fx-dotM { 0%, 12% { transform: translate(0,0); opacity: 0; } 14% { opacity: 1; } 22% { transform: translate(0,312px); opacity: 1; } 27% { transform: translate(-20px,402px); opacity: 0; } 100% { opacity: 0; } }
@keyframes fx-dotN { 0%, 14% { transform: translate(0,0); opacity: 0; } 16% { opacity: 1; } 24% { transform: translate(0,312px); opacity: 1; } 29% { transform: translate(26px,402px); opacity: 0; } 100% { opacity: 0; } }
@keyframes fx-dotK { 0%, 16% { transform: translate(0,0); opacity: 0; } 18% { opacity: 1; } 26% { transform: translate(0,312px); opacity: 1; } 31% { transform: translate(-46px,402px); opacity: 0; } 100% { opacity: 0; } }
@keyframes fx-dotO { 0%, 18% { transform: translate(0,0); opacity: 0; } 20% { opacity: 1; } 27% { transform: translate(0,312px); opacity: 1; } 32% { transform: translate(34px,402px); opacity: 0; } 100% { opacity: 0; } }
@keyframes fx-dotL { 0%, 19% { transform: translate(0,0); opacity: 0; } 21% { opacity: 1; } 28% { transform: translate(0,312px); opacity: 1; } 33% { transform: translate(-12px,402px); opacity: 0; } 100% { opacity: 0; } }
@keyframes fx-dotP { 0%, 20% { transform: translate(0,0); opacity: 0; } 22% { opacity: 1; } 29% { transform: translate(0,312px); opacity: 1; } 34% { transform: translate(46px,402px); opacity: 0; } 100% { opacity: 0; } }
@keyframes fx-dotC { 0%, 50% { transform: translate(0,0); opacity: 0; } 52% { opacity: 1; } 62% { transform: translate(0,416px); opacity: 1; } 65%, 100% { transform: translate(0,416px); opacity: 0; } }
@keyframes fx-dotF { 0%, 52% { transform: translate(0,0); opacity: 0; } 54% { opacity: 1; } 64% { transform: translate(0,416px); opacity: 1; } 67%, 100% { transform: translate(0,416px); opacity: 0; } }
@keyframes fx-dotG { 0%, 54% { transform: translate(0,0); opacity: 0; } 56% { opacity: 1; } 66% { transform: translate(0,416px); opacity: 1; } 69%, 100% { transform: translate(0,416px); opacity: 0; } }
@keyframes fx-dotJ { 0%, 56% { transform: translate(0,0); opacity: 0; } 58% { opacity: 1; } 68% { transform: translate(0,416px); opacity: 1; } 71%, 100% { transform: translate(0,416px); opacity: 0; } }
@keyframes fx-dotQ { 0%, 51% { transform: translate(0,0); opacity: 0; } 53% { opacity: 1; } 63% { transform: translate(0,416px); opacity: 1; } 66%, 100% { transform: translate(0,416px); opacity: 0; } }
@keyframes fx-dotR { 0%, 53% { transform: translate(0,0); opacity: 0; } 55% { opacity: 1; } 65% { transform: translate(0,416px); opacity: 1; } 68%, 100% { transform: translate(0,416px); opacity: 0; } }
@keyframes fx-dotS { 0%, 55% { transform: translate(0,0); opacity: 0; } 57% { opacity: 1; } 67% { transform: translate(0,416px); opacity: 1; } 70%, 100% { transform: translate(0,416px); opacity: 0; } }
@keyframes fx-dotT { 0%, 57% { transform: translate(0,0); opacity: 0; } 59% { opacity: 1; } 69% { transform: translate(0,416px); opacity: 1; } 72%, 100% { transform: translate(0,416px); opacity: 0; } }
@keyframes fx-arrow {
  0%, 50% { stroke-dashoffset: 1; opacity: 0; } 53% { opacity: 1; }
  64% { stroke-dashoffset: 0; opacity: 1; }
