<style>
  .topo { position: sticky; top: 0; z-index: 6; background: rgba(25,25,25,.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .topo-in { max-width: 1180px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 14px; }
  .topo .direita { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .reiniciar { background: none; border: 1px solid var(--line); border-radius: 999px; color: var(--ink-2); font: 500 12px var(--mono); letter-spacing: .08em; padding: 6px 10px; text-transform: uppercase; }
  /* mini painel no celular */
  .mini { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 20px; border-top: 1px solid var(--line); background: var(--card); font-size: 14px; }
  .mini b { color: var(--lime); font-size: 18px; font-variant-numeric: tabular-nums; }
  .mini[hidden] { display: none; }
  @media (max-width: 479px) { .rot-topo { display: none; } }

  .layout { max-width: 1180px; margin: 0 auto; padding: 32px 20px 72px; display: grid; gap: 32px; }
  @media (min-width: 980px) {
    .layout { grid-template-columns: minmax(0, 1fr) 420px; align-items: start; padding-top: 48px; gap: 48px; }
    .mini { display: none !important; }
    .painel-lado { position: sticky; top: 92px; }
  }
  .painel-lado { display: none; }
  @media (min-width: 980px) { .painel-lado { display: block; } }

  .fluxo { display: grid; gap: 22px; min-width: 0; }
  .fluxo h1, .fluxo .titulo-abertura { font-size: clamp(2.1rem, 5.6vw, 3.5rem); }
  .fluxo h2 { font-size: clamp(1.55rem, 3.6vw, 2.2rem); }
  .apoio { color: var(--ink-2); }
  .passo { display: flex; align-items: center; gap: 12px; }
  .trilho { flex: 1; display: grid; grid-auto-flow: column; gap: 4px; max-width: 260px; }
  .trilho i { height: 4px; border-radius: 2px; background: var(--line); }
  .trilho i.on { background: var(--lime); }

  .opcoes { display: grid; gap: 10px; }
  @media (min-width: 640px) { .opcoes.duas { grid-template-columns: 1fr 1fr; } }
  .op { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-med); padding: 14px 16px; min-height: 60px; display: grid; align-content: center; transition: border-color .2s, background .2s; }
  .op:hover { border-color: var(--ink-2); }
  .op b { font-weight: 600; line-height: 1.3; }
  .op small { color: var(--ink-2); font-size: 14px; }
  .op.sel { border-color: var(--lime); background: #2a3016; }
  .opcoes.travado .op:not(.sel) { opacity: .45; }
  .voltar { background: none; border: 0; color: var(--ink-2); padding: 8px 0; font-size: 15px; justify-self: start; }
  .garantia { border-left: 2px solid var(--lime); padding: 4px 0 4px 14px; font-weight: 500; }
  .acao { display: grid; gap: 12px; justify-items: start; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; color: var(--ink-2); }
  .chip b { color: var(--lime); }

  /* painel (sala de controle) */
  .painel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-gde); overflow: hidden; }
  .p-cab { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .p-cab .relogio { margin-left: auto; }
  .p-corpo { padding: 18px; display: grid; gap: 16px; }
  .linhas { display: grid; gap: 8px; }
  .linha { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; color: var(--ink-2); border-bottom: 1px dashed var(--line); padding-bottom: 8px; }
  .linha b { color: var(--ink); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .linha b.vazio { color: var(--mute); font-family: var(--mono); font-weight: 500; }
  .grande { background: var(--card-2); border-radius: var(--r-med); padding: 16px; }
  .grande .valor { font-size: clamp(2rem, 7vw, 2.8rem); font-weight: 700; line-height: 1; color: var(--lime); font-variant-numeric: tabular-nums; margin-top: 8px; transition: opacity .3s; }
  .grande .valor.vazio { color: var(--mute); }
  .grande .sub { margin-top: 8px; color: var(--ink-2); font-size: 15px; }
  .grande .sub b { color: var(--ink); }
  .divisao { display: grid; gap: 8px; }
  .divisao .trilha { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--line); }
  .divisao .voce { width: 85%; background: var(--ink); }
  .divisao .nos { width: 15%; background: var(--lime); }
  .divisao .leg { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); }
  .risco { display: flex; justify-content: space-between; align-items: baseline; border: 1px solid var(--lime); border-radius: var(--r-med); padding: 12px 14px; }
  .risco b { font-size: 22px; color: var(--lime); }
  .log { font: 400 12px/1.7 var(--mono); color: var(--ink-2); max-height: 132px; overflow: hidden; display: flex; flex-direction: column-reverse; }
  .log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log .ok { color: var(--lime); }
  .formula { font-size: 12px; color: var(--ink-2); line-height: 1.5; }

  .contato form { display: grid; gap: 16px; }
  .contato .btn { justify-self: stretch; }
  @media (min-width: 640px) { .contato .btn { justify-self: start; } }
  .terminal { background: #121212; border: 1px solid var(--line); border-radius: var(--r-med); padding: 16px; font: 400 13px/1.8 var(--mono); color: var(--ink-2); min-height: 132px; }
  .terminal .ok { color: var(--lime); }
  .passos { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: p; }
  .passos li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; color: var(--ink-2); }
  .passos li::before { counter-increment: p; content: "0" counter(p); font: 500 13px/1.9 var(--mono); color: var(--lime); }
  .cartao { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-gde); padding: 20px; display: grid; gap: 14px; }
  .protocolo { font: 500 14px var(--mono); letter-spacing: .1em; color: var(--ink-2); }
  .protocolo b { color: var(--ink); }
  .so-celular { display: block; }
  @media (min-width: 980px) { .so-celular { display: none; } }
