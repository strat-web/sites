<meta name="theme-color" content="#191919">
<link rel="icon" href="/midia/favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/midia/favicon/favicon-192.png">
<link rel="apple-touch-icon" href="/midia/favicon/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#191919;--bg-2:#1f1f1f;--card:#242424;--card-2:#2b2b2b;--line:#353535;--line-2:#444;--ink:#f3f3ee;--ink-2:#b9b9b1;--mute:#85857d;
--lime:#c6ff34;--lime-ink:#141414;--lime-dim:rgba(198,255,52,.12);--red:#ff1f1f;--blue:#57a1ea;--purple:#bb44f2;
--font:"Space Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);min-height:100vh;overflow-x:hidden;
background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.2px);background-size:22px 22px}
/* barras de rolagem finas e discretas (página e conversa) */
html{scrollbar-width:thin;scrollbar-color:#3a3a3a transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#555}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:460px;margin:0 auto;padding:26px 16px 0;position:relative}
/* luz cinza neutra no topo (a Strat.ai é mais sóbria que a Agência) */
.top-clip{position:relative;isolation:isolate}
.top-clip::before{content:"";position:absolute;left:0;right:0;top:0;height:420px;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 70% 100% at 50% 0,rgba(255,255,255,.07),transparent 72%)}
/* degrau (sombra em camadas do logo) */
.stack{position:relative;isolation:isolate}
.stack::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;
box-shadow:-4px 4px 0 var(--lime),-8px 8px 0 var(--purple),-12px 12px 0 var(--blue),-16px 16px 0 var(--red)}
/* topo */
.head{text-align:center}
.av{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;position:relative;border:2px solid var(--lime);padding:3px}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
h1{font-size:23px;font-weight:700;letter-spacing:-.02em}
h1 span{font-family:var(--mono);font-size:15px;background:var(--lime);color:var(--lime-ink);padding:1px 7px 2px;border-radius:5px;margin-left:4px;vertical-align:3px}
.tag{margin-top:6px;font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.35}
.tag .rot{display:inline-block;margin-top:2px;padding:0 6px;border-radius:6px;color:var(--ink);transition:background .3s,color .3s}
.meta{margin-top:12px;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.meta span{font:500 12px var(--mono);padding:5px 9px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
/* selos oficiais: pequenos no celular, um pouco maiores no computador */
.seal{height:34px;width:auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:2px 6px}
@media (min-width:600px){.seal{height:38px;padding:3px 7px;border-radius:10px}}
/* Diagnóstico (o formulário da LP StratAI v5, dentro do cartão com degrau) */
.diag{width:min(428px,calc(100% - 44px));margin:26px auto 0 max(30px,calc(50% - 206px));background:var(--bg-2);border:1px solid var(--line);border-radius:18px;padding:16px 14px 14px;text-align:center}
.diag .eb{display:block;font:700 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--lime)}
.diag h2{font-size:20px;letter-spacing:-.02em;line-height:1.15;margin-top:6px}
.diag p.sub{font-size:14px;color:var(--ink-2);margin-top:6px}
/* da 1ª resposta em diante: somem o título e o subtítulo, fica o selo e a conversa */
.diag.adiante > h2{display:none}
/* fechado: só o convite e o botão verde · aberto: a conversa desliza para baixo */
.start{width:100%;margin-top:14px;font-size:17px;box-shadow:0 10px 30px -12px rgba(198,255,52,.55);transition:transform .15s,box-shadow .15s}
.start:hover{box-shadow:0 12px 34px -10px rgba(198,255,52,.7)}
.start .ar{font-family:var(--mono)}
.diag.aberto .start{display:none}
.diag-open{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .6s cubic-bezier(.2,.7,.2,1),opacity .45s ease}
.diag-in{overflow:hidden;min-height:0}
.diag.aberto .diag-open{grid-template-rows:1fr;opacity:1}
.bot{margin-top:12px;border:1px solid var(--line-2);border-radius:14px;background:var(--bg);overflow:hidden;text-align:left}
.bot-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.bot-head b{display:block;font-size:14px}
.bot-head small{font:500 12px var(--mono);color:var(--mute)}
.bot-head .restart{margin-left:auto;border:1px solid var(--line-2);color:var(--ink-2);border-radius:99px;padding:0 14px;min-height:44px;font:500 12px var(--mono)}
.bot-head > div{min-width:0}
.bot-head .restart{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px}
.bot-head .restart span[aria-hidden]{font-size:15px;line-height:1}
.bot-head .restart:hover{border-color:var(--lime);color:var(--lime)}
/* barra de progresso com as cores do degrau */
.prog{height:4px;background:var(--line);position:relative}
.prog i{position:absolute;inset:0;background:linear-gradient(90deg,var(--red),var(--blue),var(--purple),var(--lime));clip-path:inset(0 calc(100% - var(--p,0%)) 0 0);transition:clip-path .5s ease}
.bot-body{max-height:230px;overflow-y:auto;padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#3a3a3a transparent}
.bot-body::-webkit-scrollbar{width:6px}
.bot-body::-webkit-scrollbar-thumb{border-color:var(--bg)}
.bot-body:empty{padding:0}
.msg.old{opacity:.45;transition:opacity .3s}
.msg{max-width:88%;padding:8px 11px;border-radius:12px;font-size:15px;line-height:1.4;animation:pop .25s ease-out both}
.msg.a{align-self:flex-start;background:var(--card-2);border-bottom-left-radius:4px}
.msg.c{align-self:flex-end;background:var(--lime);color:var(--lime-ink);font-weight:500;border-bottom-right-radius:4px}
.msg b{font-weight:700}
.msg.typing{display:inline-flex;gap:4px;padding:12px 14px}
.msg.typing i{width:6px;height:6px;border-radius:50%;background:#8a8a8a;animation:blink 1s infinite}
.msg.typing i:nth-child(2){animation-delay:.15s}.msg.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.bot-in{border-top:1px solid var(--line);padding:10px 12px 12px}
.bot-in:empty{display:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:8px;min-height:46px;padding:9px 10px;border-radius:12px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);font:500 14px/1.25 var(--font);text-align:left;transition:border-color .15s,transform .15s}
.opt:hover,.opt:focus-visible{border-color:var(--lime);outline:none}
.opt:active{transform:scale(.97)}
.opt kbd{display:none;font:500 12px/1 var(--mono);color:var(--mute);border:1px solid var(--line-2);border-radius:4px;padding:3px 5px}
@media (hover:hover) and (min-width:600px){.opt kbd{display:inline-block}}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);font:500 16px var(--font)}
.field input::placeholder{color:#7d7d76}
.field input:focus{outline:none;border-color:var(--lime)}
.field input[aria-invalid="true"]{border-color:var(--red)}
.field .ok{flex:none;min-height:50px;padding:0 18px;border-radius:12px;background:var(--lime);color:var(--lime-ink);font-weight:700}
.ddi{flex:none;padding:0 10px;display:flex;align-items:center;border-radius:12px;border:1px solid var(--line-2);background:var(--card);font:500 14px var(--mono);color:var(--ink-2)}
.err{margin-top:8px;font-size:13px;color:#ff8a8a}
.skip{margin-top:6px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font:500 14px var(--font);min-height:44px;padding:0 2px}
/* resultado */
.result{padding:4px 0 2px}
.result .eb2{font:700 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--lime)}
.result h3{font-size:19px;letter-spacing:-.02em;line-height:1.2;margin-top:6px}
.r-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.r-card{padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.r-card small{display:block;font:500 12px/1.3 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.r-card b{display:block;font-size:20px;margin-top:6px;color:var(--lime);letter-spacing:-.02em;line-height:1.15}
.r-card p{font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.35}
.r-card.wide{grid-column:1/-1}
.r-card.wide b{font-size:16px;color:var(--ink)}
.go{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;background:var(--lime);color:var(--lime-ink);font-weight:700;font-size:16px;line-height:1.2;border-radius:12px;padding:14px;min-height:52px;text-align:center}
.go:active{transform:scale(.98)}
.result .fine3{margin-top:8px;font:400 12px/1.5 var(--mono);color:var(--mute);text-align:center}
.fine2{font:400 12px/1.5 var(--mono);color:#9a9a92;margin-top:12px;text-align:center}
.fine2 a{color:#cfcfc7;text-decoration:underline;text-underline-offset:3px}
/* robozinho (avatar do diagnóstico, o mesmo da LP) */
.av-bot{flex:none;width:34px;height:34px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center}
.robo{display:block;width:68%;height:68%;fill:currentColor}
.robo .bot-eyes circle,.robo .bot-mouth{fill:var(--lime)}
.robo .bot-eyes{transform-origin:16px 17px;animation:botBlink 4.2s infinite}
.robo .bot-ant{animation:botAnt 1.6s ease-in-out infinite}
@keyframes botBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes botAnt{50%{opacity:.35}}
/* seções */
.lbl{font:500 12px var(--mono);color:var(--mute);margin:34px 0 12px;display:flex;gap:8px;align-items:center}
.lbl::before,.lbl::after{content:"";flex:1;height:1px;background:var(--line)}
/* botões site e WhatsApp */
.ctas{display:grid;gap:10px;margin-top:34px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:12px;font-weight:700;font-size:17px;border:1px solid var(--line-2);background:var(--card);transition:transform .15s,box-shadow .15s,border-color .15s}
.cta-site:hover{border-color:var(--lime)}
.cta-site .ar{font-family:var(--mono)}
.cta-wa{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cta-wa:hover{transform:translate(3px,-3px);box-shadow:-2px 2px 0 var(--lime),-4px 4px 0 var(--purple),-6px 6px 0 var(--blue),-8px 8px 0 var(--red)}
.cta:active{transform:scale(.98)}
/* sócios */
.team{display:flex;justify-content:center;margin-top:4px}
.team img{object-position:50% 22%;flex:none;width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--bg);margin-left:-14px;filter:grayscale(1);transition:.25s}
.team img:first-child{margin-left:0}
.team img:hover{filter:none;transform:translateY(-4px)}
.team-t{text-align:center;font-size:14px;color:var(--ink-2);margin-top:10px}
.team-t b{color:var(--ink)}
.soc{display:flex;justify-content:center;gap:10px;margin-top:26px}
.soc a{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink-2)}
.soc a:hover{color:var(--lime);border-color:var(--lime)}
.soc svg{width:20px;height:20px}
footer{margin-top:34px}
.degrau{height:8px;display:flex}.degrau i{flex:1}
.fine{font:400 12px var(--mono);color:var(--mute);text-align:center;padding:12px 16px 26px}
/* link ainda sem endereço: contorno amarelo tracejado */
.tbd{outline:1px dashed #ffe26b;outline-offset:2px}
@media (min-width:600px){.bot-body{max-height:260px}}
@media (max-width:599px){.bot-head .restart{padding:0}.bot-head .rs-t{display:none}}
@media (max-width:360px){.opt{font-size:13px;padding:8px}.r-card b{font-size:18px}.go{font-size:15px}}
/* desktop: a bio é mais baixa que a tela. O conteúdo fica no meio da altura e a faixa do rodapé
   desce pro fim da tela (as duas margens automáticas dividem a sobra igualmente) */
@media (min-width:700px){
  body{display:flex;flex-direction:column}
  .top-clip{margin-top:auto}
  footer{margin-top:auto}
  body > main.wrap{padding-bottom:34px}   /* o respiro antes da faixa (a margem do footer virou auto) */
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
