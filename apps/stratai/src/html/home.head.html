<link rel="icon" href="midia/favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="midia/favicon/favicon-192.png">
<link rel="apple-touch-icon" href="midia/favicon/favicon-180.png">
<meta name="theme-color" content="#191919">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#191919; --bg-2:#1f1f1f; --card:#242424; --card-2:#2b2b2b; --line:#353535; --line-2:#444;
  --ink:#f3f3ee; --ink-2:#b9b9b1; --mute:#85857d;
  --lime:#c6ff34; --lime-dim:rgba(198,255,52,.12); --lime-ink:#141414;
  --red:#ff1f1f; --blue:#57a1ea; --purple:#bb44f2;
  --wa:#1f2c24; --wa-me:#2c4a2f;
  --note:#ffe26b; --note-ink:#3a2f00; --note-line:#d9b93a;
  --f:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px; --max:1180px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--f);overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{margin:0;line-height:1.1;letter-spacing:-.02em;font-weight:700}
p{margin:0}
.wrap{width:100%;max-width:var(--max);margin:0 auto;padding:0 20px}
.eyebrow{font:500 .76rem/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.eyebrow.mute{color:var(--mute)}
.sec{padding:clamp(64px,9vw,112px) 0;position:relative}
.sec-head{max-width:760px;margin-bottom:44px}
.sec-head h2{font-size:clamp(1.9rem,4vw,3rem);margin-top:14px}
.sec-head p{color:var(--ink-2);margin-top:16px;font-size:1.08rem}
.hl{color:var(--lime)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;font:600 1rem/1 var(--f);text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .15s,background-color .15s,border-color .15s,box-shadow .2s}
.btn:hover{transform:translateY(-1px)}
.btn-lime{background:var(--lime);color:var(--lime-ink);box-shadow:0 0 0 0 rgba(198,255,52,0)}
.btn-lime:hover{background:#d6ff6a;box-shadow:0 0 34px -6px rgba(198,255,52,.55)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn-ghost:hover{border-color:var(--ink-2)}
.btn small{font:500 .72rem/1 var(--f-mono);opacity:.7}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.grid-bg{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.35}

/* aparecer ao rolar */
.rv-in{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.rv-in.in{opacity:1;transform:none}
.rv-in[data-d="1"]{transition-delay:.08s}.rv-in[data-d="2"]{transition-delay:.16s}.rv-in[data-d="3"]{transition-delay:.24s}.rv-in[data-d="4"]{transition-delay:.32s}

/* ---------- barra do grupo ---------- */
.topbar{background:#111;border-bottom:1px solid #262626;font:500 .74rem/1 var(--f-mono);letter-spacing:.06em;color:var(--mute)}
.topbar .wrap{display:flex;align-items:center;justify-content:center;gap:10px;min-height:34px;text-align:center}
.topbar b{color:var(--ink-2);font-weight:500}
.site-header{position:sticky;top:0;z-index:40;background:rgba(25,25,25,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
.site-header.scrolled{border-bottom-color:var(--line)}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:70px}
.brand{display:flex;align-items:flex-end;gap:2px;text-decoration:none}
.brand img{height:26px;width:auto}
.brand span{font:700 1.05rem/1 var(--f);color:var(--lime);margin-bottom:-1px;letter-spacing:-.01em}
.switch{display:inline-flex;padding:4px;border-radius:999px;background:#121212;border:1px solid var(--line)}
.switch a{position:relative;padding:.55em 1em;border-radius:999px;font:600 .9rem/1.2 var(--f);text-decoration:none;white-space:nowrap;color:var(--ink-2)}
.switch a:hover{color:var(--ink)}
.switch a[aria-current="page"]{background:var(--lime);color:var(--lime-ink)}
.head-cta{display:flex;align-items:center;gap:10px}
.head-cta .btn{min-height:42px;padding:0 18px;font-size:.92rem}
@media (max-width:900px){.head-cta .btn-ghost{display:none}}
@media (max-width:720px){
  .site-header .wrap{flex-wrap:wrap;justify-content:center;padding-top:10px;padding-bottom:10px;gap:10px}
  .head-cta{display:none}
  .switch a{padding:.5em .8em;font-size:.84rem}
}

/* ---------- hero: sala de controle ---------- */
.hero{position:relative;padding:clamp(48px,7vw,92px) 0 0;overflow:hidden;--mx:50%;--my:40%}
.hero .grid-bg{position:absolute;inset:0;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 70% 40%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 70% 40%,#000 20%,transparent 75%)}
.hero .net{position:absolute;inset:0;z-index:0;pointer-events:none}
.hero .net canvas{display:block;width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(520px circle at var(--mx) var(--my),rgba(198,255,52,.09),transparent 60%);transition:opacity .4s}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.kicker{font:500 clamp(1rem,1.5vw,1.12rem)/1.4 var(--f);color:var(--ink-2);letter-spacing:-.005em}
.kicker b{color:var(--ink);font-weight:600}
@keyframes pulse{50%{box-shadow:0 0 0 7px transparent}}
.hero h1{font-size:clamp(2.3rem,5.4vw,4.1rem);margin:22px 0 22px}
.hero h1 em{font-style:normal;color:var(--lime)}
.hero h1 [data-v]{display:none}
.hero h1 [data-v].on{display:inline}
.hero .lead{font-size:clamp(1.05rem,1.6vw,1.2rem);color:var(--ink-2);max-width:42ch}
.hero-ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:26px;font:500 .8rem/1.4 var(--f-mono);color:var(--mute)}
.hero-meta span{display:inline-flex;align-items:center;gap:8px}
.hero-meta span::before{content:"";width:6px;height:6px;background:var(--lime);border-radius:1px}
/* entrada em cascata */
.hero .rise{opacity:0;transform:translateY(18px);animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.hero .rise:nth-child(2){animation-delay:.1s}.hero .rise:nth-child(3){animation-delay:.22s}.hero .rise:nth-child(4){animation-delay:.34s}.hero .rise:nth-child(5){animation-delay:.46s}.hero .rise:nth-child(6){animation-delay:.58s}
@keyframes rise{to{opacity:1;transform:none}}
@media (max-width:960px){.hero .wrap{grid-template-columns:1fr;gap:44px}}

/* seletor de segmento */
.segs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.segs button{padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);background:rgba(25,25,25,.7);color:var(--ink-2);font:600 .82rem/1 var(--f);cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.segs button:hover{color:var(--ink)}
.segs button.on{border-color:var(--lime);color:var(--lime);background:var(--lime-dim)}
.segs button.on::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lime);margin-left:8px;vertical-align:middle;animation:pulse 2s infinite}

/* celular */
.phone-wrap{position:relative;opacity:0;transform:translateY(24px) rotate(1.5deg);animation:rise .9s cubic-bezier(.2,.7,.2,1) .35s forwards}
.phone{position:relative;width:100%;max-width:370px;margin:0 auto;border-radius:38px;padding:12px;background:#0d0d0d;border:1px solid #333;box-shadow:0 40px 80px -30px rgba(0,0,0,.8),0 0 0 1px #000,0 0 90px -30px rgba(198,255,52,.25);transform:perspective(1200px) rotateY(calc(var(--ry,0) * 1deg)) rotateX(calc(var(--rx,0) * 1deg));transition:transform .25s ease-out}
.phone-top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#1b211d;border-radius:28px 28px 0 0}
.phone-av{width:36px;height:36px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font:700 .9rem/1 var(--f)}
.phone-top b{display:block;font-size:.95rem}
.phone-top small{font:500 .72rem/1 var(--f-mono);color:#8fbf8f}
.chat{height:400px;overflow:hidden;background:#101512;padding:16px 12px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;border-radius:0 0 28px 28px}
.msg{max-width:84%;padding:9px 12px;border-radius:12px;font-size:.9rem;line-height:1.4;animation:pop .25s ease-out both}
.msg.c{align-self:flex-end;background:var(--wa-me);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:#20262a;border-bottom-left-radius:4px}
.msg.sys{align-self:center;max-width:95%;background:transparent;border:1px dashed rgba(198,255,52,.5);color:var(--lime);font:500 .72rem/1.4 var(--f-mono);text-align:center;border-radius:8px}
.msg.typing{display:inline-flex;gap:4px;padding:12px 14px}
.msg.typing i{width:6px;height:6px;border-radius:50%;background:#8a8a8a;animation:blink 1s infinite}
.msg.typing i:nth-child(2){animation-delay:.15s}.msg.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.phone-label{position:absolute;left:-24px;top:128px;padding:8px 12px;background:var(--card);border:1px solid var(--line-2);border-radius:10px;font:500 .72rem/1.3 var(--f-mono);color:var(--ink-2);box-shadow:0 10px 30px -10px #000;z-index:2}
.phone-label b{display:block;color:var(--lime);font-weight:500}
.phone-badge{position:absolute;right:-10px;bottom:60px;padding:10px 12px;background:var(--lime);color:var(--lime-ink);border-radius:10px;font:700 .74rem/1.25 var(--f-mono);box-shadow:0 14px 30px -12px rgba(198,255,52,.6);z-index:2;animation:float 5s ease-in-out infinite}
.phone-badge small{display:block;font-weight:500;opacity:.75}
@keyframes float{50%{transform:translateY(-7px)}}
@media (max-width:520px){.phone-label{left:6px;top:-18px}.phone-badge{right:4px;bottom:-12px}}

/* feed ao vivo (faixa abaixo do hero) */
.feed{position:relative;z-index:1;margin-top:clamp(40px,6vw,64px);border-top:1px solid var(--line);background:rgba(17,17,17,.7);backdrop-filter:blur(6px)}
.feed .wrap{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:18px;min-height:64px}
.feed-tag{display:inline-flex;align-items:center;gap:8px;font:600 .72rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lime);white-space:nowrap}
.feed-tag i{width:8px;height:8px;border-radius:50%;background:var(--lime);animation:pulse 1.6s infinite;box-shadow:0 0 0 3px var(--lime-dim)}
.feed-track{display:flex;gap:10px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);mask-image:linear-gradient(90deg,#000 80%,transparent);padding:10px 0}
.fev{flex:none;display:inline-flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--card);font:500 .78rem/1.3 var(--f-mono);color:var(--ink-2);white-space:nowrap;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.fev.new{animation:fevIn .5s cubic-bezier(.2,.7,.2,1) both}
.fev b{color:var(--lime);font-weight:500}
.fev small{color:var(--mute)}
@keyframes fevIn{from{opacity:0;transform:translateX(-30px) scale(.9)}}
@media (max-width:640px){.feed .wrap{grid-template-columns:1fr;gap:4px;padding-top:10px}}

/* ---------- segmentos + números ---------- */
.proof{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg-2)}
.proof .wrap{padding-top:36px;padding-bottom:36px}
.seg-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.seg-row .eyebrow{margin-right:10px}
.chip{padding:8px 14px;border:1px solid var(--line-2);border-radius:999px;font-size:.92rem;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:30px}
.stat{background:var(--bg-2);padding:24px 22px}
.stat b{display:block;font:700 clamp(1.8rem,3vw,2.4rem)/1 var(--f);letter-spacing:-.02em}
.stat span{display:block;margin-top:8px;color:var(--mute);font-size:.92rem}
.tbd{color:var(--note)!important;font-family:var(--f-mono)!important;font-size:.95em}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}}

/* ---------- com / sem agente (um dia na sua empresa) ---------- */
.day-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:20px;margin-bottom:34px}
.toggle{display:inline-flex;padding:4px;border-radius:999px;background:#121212;border:1px solid var(--line-2);position:relative}
.toggle button{position:relative;z-index:1;padding:12px 22px;border:0;background:transparent;color:var(--ink-2);font:600 .92rem/1 var(--f);cursor:pointer;border-radius:999px;transition:color .25s}
.toggle button.on{color:var(--lime-ink)}
.toggle i{position:absolute;top:4px;left:4px;bottom:4px;width:calc(50% - 4px);border-radius:999px;background:var(--lime);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.toggle.b i{transform:translateX(100%)}
.day{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mom{position:relative;border:1px solid var(--line);border-radius:18px;background:var(--card);padding:22px;min-height:230px;overflow:hidden}
.mom .t{font:600 .78rem/1 var(--f-mono);color:var(--mute);display:flex;justify-content:space-between}
.mom .t b{color:var(--ink);font-weight:500}
.mom .s{position:absolute;inset:60px 22px 22px;transition:opacity .4s,transform .4s cubic-bezier(.2,.7,.2,1)}
.mom .s p{font-size:1rem;color:var(--ink-2)}
.mom .s p b{color:var(--ink)}
.mom .s .st{display:inline-block;margin-top:12px;padding:6px 10px;border-radius:7px;font:600 .7rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.mom .s.no .st{background:rgba(255,31,31,.14);color:#ff7b6b}
.mom .s.yes .st{background:var(--lime-dim);color:var(--lime)}
.mom .s.yes{opacity:0;transform:translateY(16px)}
.day.on .mom .s.no{opacity:0;transform:translateY(-16px)}
.day.on .mom .s.yes{opacity:1;transform:none}
.day.on .mom{border-color:rgba(198,255,52,.35)}
.day-foot{margin-top:22px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between;color:var(--ink-2)}
@media (max-width:960px){.day{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.day{grid-template-columns:1fr}.mom{min-height:200px}}

/* ---------- calculadora ---------- */
.calc{display:grid;grid-template-columns:1fr 1fr;gap:18px;border:1px solid var(--line);border-radius:22px;background:var(--card);overflow:hidden}
.calc-in{padding:32px}
.calc-in h3{font-size:1.4rem}
.calc-in p{color:var(--ink-2);margin-top:8px;font-size:.96rem}
.rng{margin-top:26px}
.rng label{display:flex;justify-content:space-between;align-items:baseline;font:600 .92rem/1.2 var(--f)}
.rng label output{font:600 1rem/1 var(--f-mono);color:var(--lime)}
.rng input{width:100%;margin:12px 0 0;-webkit-appearance:none;appearance:none;height:6px;border-radius:999px;background:linear-gradient(90deg,var(--lime) var(--p,50%),var(--line-2) var(--p,50%));outline:none}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--lime);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--lime);cursor:pointer}
.rng input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--lime);border:3px solid var(--bg);cursor:pointer}
.rng small{display:block;margin-top:8px;font:500 .72rem/1.4 var(--f-mono);color:var(--mute)}
.calc-out{padding:32px;background:var(--bg-2);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.co{padding:18px 20px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.co small{display:block;font:500 .68rem/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.co b{display:block;margin-top:8px;font:700 clamp(1.7rem,3.2vw,2.4rem)/1 var(--f);letter-spacing:-.03em;color:var(--lime)}
.co b.ink{color:var(--ink)}
.co p{margin-top:6px;font-size:.86rem;color:var(--ink-2)}
.co.big{background:linear-gradient(180deg,rgba(198,255,52,.1),transparent),var(--card);border-color:rgba(198,255,52,.35)}
.calc-out .btn{margin-top:auto;width:100%}
.calc-out .fine{font:500 .7rem/1.5 var(--f-mono);color:var(--mute)}
@media (max-width:860px){.calc{grid-template-columns:1fr}.calc-out{border-left:0;border-top:1px solid var(--line)}}

/* ---------- o que construímos ---------- */
.builds{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.build{border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,border-color .25s}
.build:hover{transform:translateY(-4px);border-color:rgba(198,255,52,.4)}
.build .mock{height:220px;background:var(--bg-2);border-bottom:1px solid var(--line);position:relative;overflow:hidden;padding:22px}
.sec-band{background:var(--bg-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:clamp(64px,9vw,112px)}
.build .txt{padding:26px 28px 30px}
.build .mh{display:flex;align-items:baseline;gap:14px}
.build .mh .n{font:600 .95rem/1 var(--f-mono);color:var(--lime)}
.build .mh h3{font-size:clamp(1.9rem,3.4vw,2.6rem);letter-spacing:-.03em}
.build .sys{display:inline-flex;margin-top:14px;padding:7px 12px;border-radius:999px;background:var(--lime-dim);border:1px solid rgba(198,255,52,.3);color:var(--lime);font:600 .88rem/1.25 var(--f)}
.build .txt p{margin-top:14px;font-size:1rem;line-height:1.5;color:var(--ink-2)}
.build .txt p b{color:var(--ink);font-weight:600}
@media (max-width:820px){.builds{grid-template-columns:1fr}}
.toast{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--card-2);border:1px solid var(--line-2);font-size:.84rem;line-height:1.35;margin-bottom:8px;animation:pop .4s both}
.toast .dot{flex:none;width:28px;height:28px;border-radius:8px;background:var(--lime-dim);color:var(--lime);display:grid;place-items:center;font:700 .75rem/1 var(--f-mono)}
.toast small{display:block;color:var(--mute);font:500 .68rem/1.3 var(--f-mono);margin-top:2px}
.crm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;height:100%}
.crm-col{background:#1a1a1a;border:1px solid var(--line);border-radius:10px;padding:8px}
.crm-col h4{margin:0 0 8px;font:500 .64rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.crm-card{padding:8px;border-radius:8px;background:var(--card-2);font-size:.74rem;line-height:1.3;margin-bottom:6px;border-left:3px solid var(--line-2)}
.crm-card.go{border-left-color:var(--lime);animation:slide 3.5s ease-in-out infinite}
@keyframes slide{0%,20%{transform:translateX(0);opacity:1}45%{transform:translateX(0);opacity:1}50%{opacity:0}55%{opacity:0}100%{opacity:1}}
.sheet{width:100%;border-collapse:collapse;font:500 .74rem/1.2 var(--f-mono)}
.sheet th{color:var(--mute);font-weight:500;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line-2)}
.sheet td{padding:8px;border-bottom:1px solid var(--line);color:var(--ink-2)}
.sheet tr.new td{color:var(--lime);background:var(--lime-dim);animation:pop .5s both}
.dash{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.kpi{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi small{display:block;font:500 .62rem/1.2 var(--f-mono);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.kpi b{display:block;margin-top:6px;font-size:1.1rem}
.bars{grid-column:1/-1;display:flex;align-items:flex-end;gap:8px;height:84px;padding:10px;background:var(--card-2);border:1px solid var(--line);border-radius:10px}
.bars i{flex:1;background:linear-gradient(var(--lime),rgba(198,255,52,.35));border-radius:4px 4px 0 0;transform-origin:bottom;animation:grow 1.2s both}
@keyframes grow{from{transform:scaleY(0)}}
.caps{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.caps span{padding:9px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:.92rem;color:var(--ink-2)}
.caps span::before{content:"+ ";color:var(--lime);font-family:var(--f-mono)}

/* ---------- integrações (mapa) ---------- */
.intg{position:relative;border:1px solid var(--line);border-radius:22px;background:var(--card);padding:40px 24px;overflow:hidden}
.intg .grid-bg{position:absolute;inset:0;opacity:.2}
.intg-row{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.intg-row+.intg-row{margin-top:18px}
.node{display:inline-flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-2);font:600 .9rem/1 var(--f);color:var(--ink);transition:transform .2s,border-color .2s}
.node:hover{transform:translateY(-3px);border-color:var(--lime)}
.node i{width:10px;height:10px;border-radius:3px;background:var(--c,var(--mute))}
.node.core{background:var(--lime);color:var(--lime-ink);border-color:var(--lime);padding:16px 22px;font-size:1rem;box-shadow:0 0 50px -14px var(--lime)}
.node.core i{background:var(--lime-ink)}
.intg-line{position:relative;height:34px;width:2px;margin:0 auto;background:linear-gradient(var(--line-2),var(--lime));overflow:hidden}
.intg-line::after{content:"";position:absolute;left:0;top:-20px;width:2px;height:20px;background:var(--lime);animation:pulseDown 1.6s linear infinite}
@keyframes pulseDown{to{transform:translateY(60px)}}
.intg-note{margin-top:22px;text-align:center;font:500 .78rem/1.5 var(--f-mono);color:var(--mute)}

/* ---------- método + linha do tempo ---------- */
.method{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.step{padding:28px 24px 30px;background:var(--card);border-right:1px solid var(--line);position:relative}
.step:last-child{border-right:0}
.step .k{display:flex;align-items:center;justify-content:space-between;font:500 .74rem/1 var(--f-mono);color:var(--mute)}
.step .k b{color:var(--lime);font-weight:500}
.step h3{font-size:1.5rem;margin-top:26px}
.step p{margin-top:12px;color:var(--ink-2);font-size:.98rem}
.step .when{display:inline-block;margin-top:16px;padding:6px 10px;border-radius:7px;background:var(--bg-2);border:1px solid var(--line-2);font:500 .72rem/1 var(--f-mono);color:var(--ink-2)}
.step .bar{position:absolute;left:0;right:0;top:0;height:3px;background:var(--lime);transform-origin:left;transform:scaleX(0);transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.in .step:nth-child(1) .bar{transform:scaleX(.25)}.in .step:nth-child(2) .bar{transform:scaleX(.5)}.in .step:nth-child(3) .bar{transform:scaleX(.75)}.in .step:nth-child(4) .bar{transform:scaleX(1)}
.method-foot{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;align-items:center;margin-top:22px;color:var(--ink-2)}
.method-foot q{font-size:1.2rem;color:var(--ink);quotes:"“" "”"}
@media (max-width:900px){.method{grid-template-columns:1fr 1fr}.step:nth-child(2){border-right:0}.step:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:560px){.method{grid-template-columns:1fr}.step{border-right:0;border-bottom:1px solid var(--line)}}

/* ---------- casos (carrossel horizontal) ---------- */
.cases{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(320px,1fr);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.case{scroll-snap-align:start;border:1px solid var(--line);border-radius:18px;background:var(--card);padding:28px;display:flex;flex-direction:column}
.case .tag{font:500 .72rem/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.case h3{font-size:1.35rem;margin-top:14px}
.case h3 small{display:block;font:500 .95rem/1.3 var(--f);color:var(--ink-2);margin-top:6px;letter-spacing:0}
.case ul{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:9px}
.case li{position:relative;padding-left:22px;color:var(--ink-2);font-size:.96rem}
.case li::before{content:"";position:absolute;left:0;top:.55em;width:10px;height:2px;background:var(--lime)}
.case .res{margin-top:auto;padding-top:22px}
.case .res div{padding:14px 16px;border-radius:12px;background:var(--bg-2);border:1px dashed var(--line-2)}
.case .res small{display:block;font:500 .68rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.case .snippet{margin-top:18px;padding:12px;border-radius:12px;background:#101512;display:grid;gap:6px}
.case .snippet .msg{font-size:.8rem;animation:none}
@media (min-width:1100px){.cases{grid-auto-flow:row;grid-template-columns:repeat(3,1fr);overflow:visible}}

/* ---------- diagnóstico ---------- */
.diag{background:var(--bg-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.diag .wrap{display:grid;grid-template-columns:.85fr 1.15fr;gap:56px;align-items:start}
.diag-side h2{font-size:clamp(1.9rem,3.6vw,2.8rem);margin-top:14px}
.diag-side p{color:var(--ink-2);margin-top:16px}
.diag-side ul{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:14px}
.diag-side li{display:flex;gap:12px;align-items:flex-start}
.diag-side li b{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--lime-dim);color:var(--lime);font:600 .8rem/1 var(--f-mono)}
.diag-side .small{font:500 .78rem/1.5 var(--f-mono);color:var(--mute);margin-top:26px}
@media (max-width:960px){.diag .wrap{grid-template-columns:1fr;gap:36px}}
.bot{border:1px solid var(--line-2);border-radius:20px;background:var(--bg);overflow:hidden;box-shadow:0 30px 60px -30px #000}
.bot-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.bot-head .phone-av{width:34px;height:34px}
.bot-head b{display:block;font-size:.95rem}
.bot-head small{font:500 .7rem/1 var(--f-mono);color:var(--mute)}
.bot-head .restart{margin-left:auto;background:none;border:1px solid var(--line-2);color:var(--ink-2);border-radius:999px;padding:6px 12px;font:500 .72rem/1 var(--f-mono);cursor:pointer}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--lime);transition:width .5s ease}
.bot-body{height:460px;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.bot-body .msg{max-width:88%;font-size:.96rem}
.bot-body .msg.a{background:var(--card)}
.bot-body .msg.c{background:var(--lime);color:var(--lime-ink);font-weight:500}
.bot-body .msg b{font-weight:700}
.bot-in{border-top:1px solid var(--line);padding:14px;min-height:78px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);font:500 .92rem/1.25 var(--f);cursor:pointer;text-align:left}
.opt:hover,.opt:focus-visible{border-color:var(--lime);outline:none}
.opt kbd{font:500 .68rem/1 var(--f-mono);color:var(--mute);border:1px solid var(--line-2);border-radius:4px;padding:3px 5px}
.field{display:flex;gap:8px}
.field input,.field select{flex:1;min-width:0;height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);font:500 1rem/1 var(--f)}
.field input:focus,.field select:focus{outline:none;border-color:var(--lime)}
.field .btn{min-height:50px;padding:0 18px}
.ddi{flex:none!important;width:auto;padding:0 12px;display:flex;align-items:center;border-radius:12px;border:1px solid var(--line-2);background:var(--card);font:500 .95rem/1 var(--f-mono);color:var(--ink-2)}
.hint{margin-top:8px;font:500 .72rem/1.4 var(--f-mono);color:var(--mute)}
.err{margin-top:8px;font-size:.85rem;color:#ff8a7a}
.skip{margin-top:8px;background:none;border:0;color:var(--ink-2);text-decoration:underline;font:500 .88rem/1 var(--f);cursor:pointer;padding:4px 0}
.result{padding:6px 2px}
.result .eyebrow{display:block}
.result h3{font-size:1.5rem;margin-top:10px}
.r-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.r-card{padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.r-card small{display:block;font:500 .66rem/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.r-card b{display:block;font-size:1.5rem;margin-top:8px;color:var(--lime);letter-spacing:-.02em}
.r-card p{font-size:.86rem;color:var(--ink-2);margin-top:4px}
.r-card.wide{grid-column:1/-1}
.r-card.wide b{font-size:1.15rem;color:var(--ink)}
.result .btn{width:100%;margin-top:14px}
.result .fine{margin-top:10px;font:500 .7rem/1.5 var(--f-mono);color:var(--mute)}

/* ---------- depois do diagnóstico ---------- */
.after{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative;counter-reset:a}
.after::before{content:"";position:absolute;left:12%;right:12%;top:26px;height:1px;background:var(--line-2)}
.af{position:relative;padding:0 18px;text-align:center}
.af::before{counter-increment:a;content:counter(a,decimal-leading-zero);display:grid;place-items:center;width:52px;height:52px;margin:0 auto;border-radius:50%;background:var(--bg);border:1px solid var(--lime);color:var(--lime);font:600 .82rem/1 var(--f-mono);position:relative;z-index:1}
.af h3{font-size:1.1rem;margin-top:18px}
.af p{margin-top:8px;color:var(--ink-2);font-size:.93rem}
.af small{display:inline-block;margin-top:10px;font:500 .7rem/1 var(--f-mono);color:var(--mute);letter-spacing:.06em}
@media (max-width:860px){.after{grid-template-columns:1fr 1fr;gap:28px 0}.after::before{display:none}}
@media (max-width:480px){.after{grid-template-columns:1fr}}

/* ---------- quem ensina ---------- */
.edu{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.edu-card{border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden;display:flex;flex-direction:column}
.edu-ph.photo{padding:0;display:block;height:260px}
.edu-ph.photo img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.edu-card:hover .edu-ph.photo img{transform:scale(1.04)}
.edu-body{padding:26px 28px 30px;display:flex;flex-direction:column;flex:1}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badges span{padding:6px 10px;border-radius:8px;background:var(--bg-2);border:1px solid var(--line-2);font:500 .72rem/1 var(--f-mono);color:var(--ink-2)}
.badges span.l{border-color:rgba(198,255,52,.5);color:var(--lime)}
.edu-body h3{font-size:1.5rem;margin-top:18px}
.edu-body p{color:var(--ink-2);margin-top:10px}
.edu-body ul{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.edu-body li{padding-left:22px;position:relative;color:var(--ink-2);font-size:.95rem}
.edu-body li::before{content:"→";position:absolute;left:0;color:var(--lime);font-family:var(--f-mono)}
.edu-body .kpis{display:flex;gap:26px;margin-top:auto;padding-top:24px}
.edu-body .kpis div b{display:block;font-size:1.4rem}
.edu-body .kpis div span{font-size:.82rem;color:var(--mute)}
.quote-big{margin-top:30px;padding:26px 28px;border-left:3px solid var(--lime);background:var(--card);border-radius:0 14px 14px 0;font-size:clamp(1.2rem,2.4vw,1.6rem);font-weight:600;letter-spacing:-.01em}
.quote-big small{display:block;margin-top:10px;font:500 .74rem/1.3 var(--f-mono);color:var(--mute);letter-spacing:.06em}
@media (max-width:860px){.edu{grid-template-columns:1fr}}

/* ---------- sócios ---------- */
.founders{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.founder{display:grid;grid-template-columns:150px 1fr;gap:24px;padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.founder .ph{aspect-ratio:4/5;border-radius:12px;background:#1a1a1a;overflow:hidden}
.founder .ph img{width:100%;height:100%;object-fit:cover;filter:grayscale(.15)}
.founder .role{font:500 .72rem/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--lime)}
.founder h3{font-size:1.45rem;margin-top:8px}
.founder p{color:var(--ink-2);margin-top:10px;font-size:.96rem}
.founder .links{display:flex;gap:14px;margin-top:14px;font:500 .78rem/1 var(--f-mono);color:var(--mute)}
@media (max-width:960px){.founders{grid-template-columns:1fr}}
@media (max-width:480px){.founder{grid-template-columns:1fr}.founder .ph{max-width:170px}}

/* ---------- para quem ---------- */
.fit{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.fit-col{padding:30px;border-radius:18px;border:1px solid var(--line)}
.fit-col.yes{background:linear-gradient(180deg,rgba(198,255,52,.07),transparent 60%),var(--card);border-color:rgba(198,255,52,.3)}
.fit-col.no{background:var(--card)}
.fit-col h3{font-size:1.3rem;display:flex;align-items:center;gap:10px}
.fit-col ul{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:12px}
.fit-col li{display:flex;gap:12px;color:var(--ink-2)}
.fit-col li::before{flex:none;font:700 .9rem/1.6 var(--f-mono)}
.fit-col.yes li::before{content:"✓";color:var(--lime)}
.fit-col.no li::before{content:"×";color:#ff7b6b}
@media (max-width:760px){.fit{grid-template-columns:1fr}}

/* ---------- comparação ---------- */
.cmp-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.cmp{width:100%;min-width:640px;border-collapse:collapse;font-size:.95rem}
.cmp th,.cmp td{padding:16px 18px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.cmp th{font:600 .9rem/1.3 var(--f);color:var(--ink-2)}
.cmp th small{display:block;font:500 .7rem/1.3 var(--f-mono);color:var(--mute);margin-top:4px}
.cmp th.us,.cmp td.us{background:rgba(198,255,52,.06);color:var(--ink)}
.cmp th.us{color:var(--lime)}
.cmp td:first-child{font-weight:600;color:var(--ink)}
.cmp td.ok::before{content:"✓ ";color:var(--lime);font-family:var(--f-mono)}
.cmp td.no::before{content:"× ";color:#ff7b6b;font-family:var(--f-mono)}
.cmp td.mid::before{content:"~ ";color:var(--mute);font-family:var(--f-mono)}
.cmp td.no,.cmp td.mid{color:var(--ink-2)}
.cmp tbody tr:last-child td{border-bottom:0}

/* ---------- objeções em bolhas ---------- */
.objs{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.obj{display:flex;flex-direction:column;gap:10px;padding:20px;border:1px solid var(--line);border-radius:18px;background:#101512}
.obj .msg{animation:none;font-size:.95rem;max-width:92%}
.obj .msg.a{background:#20262a}
@media (max-width:820px){.objs{grid-template-columns:1fr}}

/* ---------- FAQ ---------- */
.faq{max-width:860px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;font-size:1.15rem;font-weight:600}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font:400 1.2rem/1 var(--f-mono);color:var(--lime);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq .ans{padding:0 0 24px;color:var(--ink-2);max-width:70ch}
.faq .ans p+p{margin-top:10px}
.faq .ans .btn{margin-top:16px}

/* ---------- final ---------- */
.final{text-align:center;overflow:hidden}
.final .grid-bg{position:absolute;inset:0;-webkit-mask-image:radial-gradient(ellipse 60% 70% at 50% 50%,#000 10%,transparent 70%);mask-image:radial-gradient(ellipse 60% 70% at 50% 50%,#000 10%,transparent 70%)}
.final .wrap{position:relative}
.final h2{font-size:clamp(2.2rem,5.5vw,4.2rem);max-width:16ch;margin:18px auto 0}
.final p{color:var(--ink-2);margin:20px auto 0;max-width:52ch}
.final .hero-ctas{justify-content:center}

/* ---------- rodapé ---------- */
.footer{border-top:1px solid var(--line);padding:48px 0 0;background:#141414}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}
.footer h4{margin:0 0 14px;font:500 .72rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.footer ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.footer a{text-decoration:none;color:var(--ink-2)}
.footer a:hover{color:var(--ink)}
.footer .about{color:var(--mute);font-size:.94rem;margin-top:14px;max-width:36ch}
.foot-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:40px;padding:18px 0 22px;border-top:1px solid var(--line);font:500 .72rem/1.5 var(--f-mono);color:var(--mute)}
.degrau{height:16px;display:grid;grid-template-rows:repeat(4,4px)}
.degrau i:nth-child(1){background:var(--lime)}.degrau i:nth-child(2){background:var(--purple)}.degrau i:nth-child(3){background:var(--blue)}.degrau i:nth-child(4){background:var(--red)}
@media (max-width:860px){.foot-grid{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.foot-grid{grid-template-columns:1fr}}

.wa-float{position:fixed;right:18px;bottom:18px;z-index:50;width:58px;height:58px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 12px 30px -8px rgba(0,0,0,.6);text-decoration:none}
.wa-float svg{width:28px;height:28px;fill:#fff}

/* ---------- v3: ajustes de celular e de leitura ---------- */
.btn{line-height:1.2;text-align:center}
.rng label{gap:12px}
.rng label output{flex:none;white-space:nowrap}
section[id]{scroll-margin-top:76px}
.site-header{transition:border-color .2s,transform .3s ease}
@media (max-width:720px){
  .site-header.hide{transform:translateY(-100%)}
  section[id]{scroll-margin-top:12px}
}
/* cartões com/sem agente: os dois textos ocupam a mesma célula, então o cartão cresce com o texto maior e nada é cortado */
.mom{display:grid;grid-template-rows:auto 1fr;min-height:0}
.mom .t{grid-area:1/1}
.mom .s{position:static;grid-area:2/1;margin-top:22px}
.swipe-hint{display:none;margin-top:10px;font:500 .78rem/1.4 var(--f-mono);color:var(--mute)}
@media (max-width:1099px){.swipe-hint{display:block}.cases .rv-in{opacity:1;transform:none}}
/* tabela de comparação vira cartões no celular: a coluna da StratAI fica sempre à vista */
@media (max-width:640px){
  .cmp-wrap{overflow:visible;background:transparent;border:0}
  .cmp{min-width:0}
  .cmp thead{display:none}
  .cmp,.cmp tbody,.cmp tr,.cmp td{display:block}
  .cmp tr{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
  .cmp tr+tr{margin-top:12px}
  .cmp td{display:flex;gap:8px;align-items:baseline;padding:10px 16px;border-bottom:1px solid var(--line)}
  .cmp td:first-child{display:block;padding:14px 16px 10px;font-size:1rem}
  .cmp td:not(:first-child)::after{content:attr(data-l);order:-1;flex:0 0 118px;font:500 .7rem/1.4 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
  .cmp td.us::after{color:var(--lime)}
  .cmp tbody tr td:last-child{border-bottom:0}
}
@media (max-width:560px){
  .topbar{display:none}
  .cases{grid-auto-columns:86%}
  .footer ul{gap:4px}
  .footer ul a{display:inline-block;padding:6px 0}
  .hero-ctas .btn{width:100%}
  .phone-wrap{display:flex;flex-direction:column}
  .segs{order:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .segs button{min-height:44px;font-size:.9rem}
  .phone-label{position:static;order:1;align-self:flex-start;margin:0 0 12px;box-shadow:none}
  .phone{order:2}

}

/* =====================================================================
   v4 · mais visual e mais interativa (estudo visual de 29/09 + padrões do site da Laisa)
   ===================================================================== */
:root{--yellow:#ffc93c;--c-at:var(--lime);--c-ve:var(--blue);--c-op:var(--purple);--c-si:var(--yellow);--bad:#ff6b5b}
/* ícone em ladrilho colorido: a cor diz o assunto (Atendimento lima · Vendas azul · Operação roxo · Sistemas amarelo · problema vermelho) */
.ic{--c:var(--lime);position:relative;width:44px;height:44px;border-radius:13px;display:inline-grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 38%,transparent)}
.ic .i{width:22px;height:22px}
.ic.sm{width:34px;height:34px;border-radius:10px}.ic.sm .i{width:17px;height:17px}
.ic.lg{width:58px;height:58px;border-radius:17px}.ic.lg .i{width:28px;height:28px}
.ic.xl{width:76px;height:76px;border-radius:22px}.ic.xl .i{width:36px;height:36px}
.ic.round{border-radius:50%}
.c-lime{--c:var(--lime)}.c-blue{--c:var(--blue)}.c-purple{--c:var(--purple)}.c-yellow{--c:var(--yellow)}.c-red{--c:var(--bad)}.c-green{--c:#25d366}.c-pink{--c:#e1306c}.c-mute{--c:var(--ink-2)}
.i.fill{fill:currentColor;stroke:none}

/* barra de leitura (quanto da página já foi) */
.readbar{position:fixed;left:0;top:0;height:3px;width:100%;z-index:60;background:var(--lime);transform-origin:left;transform:scaleX(var(--read,0));pointer-events:none}

/* topo: marcadores viram ícones */
.hero-meta{gap:10px;font:500 .86rem/1.3 var(--f);color:var(--ink-2)}
.hero-meta span{padding:5px 14px 5px 5px;border-radius:999px;background:rgba(36,36,36,.8);border:1px solid var(--line)}
.hero-meta span::before{display:none}

/* segmentos + números */
.seg-row .chip{display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;color:var(--ink);background:var(--card)}
.stats{gap:12px;background:none;border:0;border-radius:0;overflow:visible}
.stat{display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.stat span{margin-top:0}

/* um dia: ícone do momento + ícone de cada estado + placar */
.mom .t{align-items:center;gap:12px;justify-content:flex-start}
.mom .t .when-t{display:flex;flex-direction:column;gap:5px}
.mom .t .when-t b{font:700 1.45rem/1 var(--f);letter-spacing:-.02em}
.mom .t .when-t span{font:500 .7rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.mom .s{display:grid;grid-template-columns:auto 1fr;gap:12px;align-content:start}
.mom .s .st{grid-column:1/-1;justify-self:start;margin-top:4px}
.mom .s.no .ic{--c:var(--bad)}
.day.on .mom{background:linear-gradient(180deg,rgba(198,255,52,.06),transparent 55%),var(--card)}
.score{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.score>span{display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.92rem;color:var(--ink-2);transition:border-color .3s,color .3s,opacity .3s}
.score b{font:700 1.05rem/1 var(--f-mono);color:var(--ink)}
.score .lost{border-color:rgba(255,107,91,.4)}
.score .won{opacity:.45}
.day.on ~ .score .lost{opacity:.45;border-color:var(--line)}
.day.on ~ .score .won{opacity:1;border-color:rgba(198,255,52,.45);color:var(--ink)}

/* calculadora: ícone por controle, gente desenhada e quadro de horas */
.rng{display:grid;grid-template-columns:auto 1fr;gap:0 14px;align-items:start}
.rng .ic{margin-top:2px}
.people{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;min-height:22px;align-items:center}
.people .i{width:20px;height:20px;color:var(--blue)}
.people em{font:600 .78rem/1 var(--f-mono);color:var(--ink-2);font-style:normal;margin-left:4px}
.hgrid{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin-top:12px}
.hgrid i{aspect-ratio:1;border-radius:3px;background:#303030;transition:background-color .35s}
.hgrid i.rep{background:#5a5a52}
.hgrid i.may{background:rgba(198,255,52,.38)}
.hgrid i.dev{background:var(--lime)}
.hkey{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font:500 .72rem/1.3 var(--f-mono);color:var(--mute)}
.hkey span{display:inline-flex;align-items:center;gap:6px}
.hkey i{width:10px;height:10px;border-radius:3px;display:inline-block}
.co.eq{display:flex;align-items:center;gap:14px}
.co.eq b{font-size:1.25rem;margin-top:4px;color:var(--ink)}

/* o que construímos: cada módulo com a sua cor */
.build{--c:var(--lime)}
.build.m-ve{--c:var(--c-ve)}.build.m-op{--c:var(--c-op)}.build.m-si{--c:var(--c-si)}
.build{border-top:3px solid var(--c)}
.build:hover{border-color:color-mix(in srgb,var(--c) 45%,transparent);border-top-color:var(--c)}
.build .mh{align-items:center}
.build .mh .n{color:var(--c)}
.build .sys{background:color-mix(in srgb,var(--c) 12%,transparent);border-color:color-mix(in srgb,var(--c) 35%,transparent);color:var(--c)}
.build.m-ve .crm-card.go{border-left-color:var(--c)}
.build.m-op .sheet tr.new td{color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.build.m-si .bars i{background:linear-gradient(var(--c),color-mix(in srgb,var(--c) 30%,transparent))}
.build.m-at .toast .dot{background:var(--lime-dim)}

/* integrações: mapa clicável (clicar num ícone explica o que o agente faz ali) */
.hub{position:relative;border:1px solid var(--line);border-radius:22px;background:var(--card);padding:34px 20px 28px;overflow:hidden}
.hub .grid-bg{position:absolute;inset:0;opacity:.2}
.hub-lbl{position:relative;text-align:center;font:500 .7rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 16px}
.hub-row{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:14px 10px}
.tool{display:flex;flex-direction:column;align-items:center;gap:8px;width:104px;padding:8px 4px;border:1px solid transparent;border-radius:16px;background:none;color:var(--ink-2);font:500 .8rem/1.25 var(--f);text-align:center;cursor:pointer;transition:border-color .2s,background-color .2s,transform .2s}
.tool:hover{transform:translateY(-3px);color:var(--ink)}
.tool[aria-pressed="true"]{border-color:color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 8%,transparent);color:var(--ink)}
.tool .ic{transition:box-shadow .25s}
.tool[aria-pressed="true"] .ic{box-shadow:0 0 30px -6px var(--c)}
.hub-core{position:relative;margin:0 auto;display:flex;align-items:center;gap:12px;width:max-content;max-width:100%;padding:10px 22px 10px 10px;border-radius:999px;background:var(--lime);color:var(--lime-ink);font-weight:700;box-shadow:0 0 60px -12px rgba(198,255,52,.55)}
.hub-core .ic{--c:var(--lime-ink);background:rgba(0,0,0,.1);border-color:rgba(0,0,0,.18)}
.hub .intg-line{height:38px}
.hub-info{position:relative;display:flex;gap:14px;align-items:flex-start;max-width:640px;margin:26px auto 0;padding:16px 18px;border-radius:16px;background:var(--bg-2);border:1px solid var(--line-2);min-height:84px}
.hub-info b{display:block;font-size:1.02rem}
.hub-info p{color:var(--ink-2);font-size:.94rem;margin-top:4px}
.hub-info .how{display:block;margin-top:8px;font:500 .72rem/1.4 var(--f-mono);color:var(--mute)}
@media (max-width:560px){.tool{width:calc(33.33% - 8px);min-width:0}.hub{padding:26px 12px 20px}}

/* método: escada que acende ao rolar */
.stairs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start;position:relative}
.stair{position:relative;display:flex;flex-direction:column;gap:12px;padding:22px;border:1px solid var(--line);border-radius:20px;background:var(--card);transition:border-color .5s,background-color .5s}
.stair:nth-child(1){margin-top:108px}.stair:nth-child(2){margin-top:72px}.stair:nth-child(3){margin-top:36px}
.stair .k{display:flex;justify-content:space-between;font:500 .7rem/1 var(--f-mono);letter-spacing:.12em;color:var(--mute)}
.stair .k b{color:var(--c);font-weight:500}
.stair h3{font-size:1.25rem}
.stair p{color:var(--ink-2);font-size:.94rem}
.stair .when{align-self:flex-start;padding:6px 10px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line-2);font:600 .7rem/1 var(--f-mono);letter-spacing:.06em;color:var(--ink-2)}
.stair .ic{opacity:.45;filter:saturate(.3);transition:opacity .5s,filter .5s,box-shadow .5s}
.stair.lit{border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.stair.lit .ic{opacity:1;filter:none;box-shadow:0 0 34px -10px var(--c)}
.stair:last-child.lit{background:linear-gradient(180deg,rgba(198,255,52,.08),transparent 70%),var(--card)}
@media (max-width:900px){
  .stairs{grid-template-columns:1fr;gap:0;padding-left:30px}
  .stairs::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--line-2)}
  .stairs::after{content:"";position:absolute;left:8px;top:8px;width:2px;height:calc(var(--fill,0) * (100% - 16px));background:var(--lime);transition:height .6s}
  .stair,.stair:nth-child(n){margin:0 0 14px}
  .stair::before{content:"";position:absolute;left:-28px;top:30px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line-2);transition:border-color .4s,background-color .4s}
  .stair.lit::before{border-color:var(--lime);background:var(--lime)}
}

/* casos: faixa colorida com ícone, número grande, pontinhos no celular */
.case{--c:var(--lime);padding:0;overflow:hidden}
.case.k-ve{--c:var(--c-ve)}.case.k-op{--c:var(--c-op)}
.case-top{display:flex;align-items:center;gap:14px;padding:22px 24px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 20%,#1d1d1d),#1d1d1d 72%);border-bottom:1px solid var(--line)}
.case-top h3{margin-top:4px}
.case .big{padding:18px 24px 0}
.case .big small{display:block;font:500 .66rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.case .big b{display:block;margin-top:6px;font:700 2.2rem/1 var(--f);letter-spacing:-.03em}
.case .big span{display:block;margin-top:6px;color:var(--ink-2);font-size:.9rem}
.case .snippet{margin:16px 24px 0}

.dots{display:none;justify-content:center;gap:4px;margin-top:10px}
.dots button{width:36px;height:36px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.dots button::before{content:"";width:9px;height:9px;border-radius:99px;background:var(--line-2);transition:width .3s,background-color .3s}
.dots button[aria-current="true"]::before{width:26px;background:var(--lime)}
@media (max-width:1099px){.dots{display:flex}.swipe-hint{display:none!important}}

/* diagnóstico: promessas com ícone */
.diag-side li .ic{margin-top:-4px}
.diag-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.diag-chips span{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;border:1px solid var(--line-2);font:500 .78rem/1 var(--f-mono);color:var(--ink-2)}
.diag-chips .i{width:15px;height:15px;color:var(--lime)}

/* o que acontece depois: linha do tempo que enche */
.after{--fill:0}
.after::before{top:37px;height:2px;background:var(--line-2)}
.after::after{content:"";position:absolute;left:12%;top:37px;height:2px;width:calc(76% * var(--fill));background:var(--lime);transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
.af::before{display:none}

.af .ic::after{content:attr(data-n);position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line-2);display:grid;place-items:center;font:600 .62rem/1 var(--f-mono);color:var(--ink-2)}
@media (max-width:860px){.after::after{display:none}}

/* formação: listas viram grade de ícones */
.edu-body ul.icon-list{grid-template-columns:1fr 1fr;gap:8px}
.edu-body ul.icon-list li{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--card-2);font-size:.88rem;line-height:1.3}

.founder .role{display:inline-flex;align-items:center;gap:8px}

/* para quem: "você se reconhece?" (marca o que acontece e a página responde) */
.fit{grid-template-columns:1.25fr .75fr}
.recon p.lead-s{color:var(--ink-2);margin-top:8px;font-size:.95rem}
.recon ul{gap:8px}
.recon li{display:block}
.recon li::before{display:none!important}
.chk{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 12px 8px 8px;border-radius:14px;border:1px solid var(--line);background:var(--bg-2);cursor:pointer;color:var(--ink-2);transition:border-color .2s,background-color .2s,color .2s}
.chk:hover{border-color:var(--line-2);color:var(--ink)}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk .box{margin-left:auto;flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line-2);display:grid;place-items:center;color:var(--lime-ink);transition:background-color .2s,border-color .2s}
.chk .box .i{width:15px;height:15px;opacity:0;stroke-width:3}
.chk input:checked ~ .box{background:var(--lime);border-color:var(--lime)}
.chk input:checked ~ .box .i{opacity:1}
.chk:has(input:checked){border-color:color-mix(in srgb,var(--c) 50%,transparent);background:color-mix(in srgb,var(--c) 7%,var(--bg-2));color:var(--ink)}
.chk input:focus-visible ~ .box{outline:2px solid var(--lime);outline-offset:3px}
.recon-out{margin-top:16px;padding:16px;border-radius:16px;border:1px dashed var(--line-2);background:var(--bg)}
.recon-out .cnt{font-size:1rem;color:var(--ink-2)}
.recon-out .cnt b{color:var(--lime);font:700 1.3rem/1 var(--f-mono)}
.recon-mods{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.recon-mods span{--c:var(--line-2);display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);font-size:.86rem;color:var(--mute);transition:all .3s}
.recon-mods span .ic{opacity:.35;transition:opacity .3s}
.recon-mods span.on{border-color:color-mix(in srgb,var(--c) 55%,transparent);color:var(--ink);background:color-mix(in srgb,var(--c) 10%,transparent)}
.recon-mods span.on .ic{opacity:1}
.recon-out .btn{margin-top:14px;width:100%}
.recon-out .btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.fit-col.no li{align-items:center}
.fit-col.no li::before{display:none}

/* comparação: selos em vez de texto */
.cmp th.hc{text-align:center}

td.ok .mark i{background:rgba(198,255,52,.15);color:var(--lime)}

.rv-panel{position:absolute;left:0;bottom:58px;width:min(360px,calc(100vw - 36px));max-height:min(620px,calc(100vh - 110px));overflow:auto;padding:18px;border-radius:16px;background:#fffbe6;color:#2b2400;box-shadow:0 24px 60px -20px rgba(0,0,0,.8)}
.rv-panel h5{margin:0 0 4px;font:700 .95rem/1.2 var(--f)}
.rv-panel .sub{font-size:.8rem;color:#6b5d1f;margin-bottom:14px}
.rv-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #efe3a8;font-size:.86rem;font-weight:600}
.rv-row input[type=checkbox]{width:20px;height:20px;accent-color:#3a2f00}
.seg{display:inline-flex;border:1px solid #d9c979;border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;font:600 .76rem/1 var(--f);color:#3a2f00;cursor:pointer}
.seg button.on{background:#3a2f00;color:#fffbe6}
.rv-btn{width:100%;margin-top:6px;padding:10px 12px;border-radius:10px;border:1px solid #d9c979;background:#fff3b8;color:#3a2f00;font:600 .86rem/1.2 var(--f);cursor:pointer;text-align:left;text-decoration:none;display:block}
.rv-list{margin:10px 0 0;padding:0 0 0 18px;font-size:.82rem;line-height:1.45;display:grid;gap:6px}
.rv-list li b{font-weight:700}
.mobile-view{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.8);display:none;place-items:center;padding:20px}
.mobile-view.on{display:grid}
.mobile-view .frame{width:390px;max-width:100%;height:min(820px,calc(100vh - 80px));border-radius:36px;border:10px solid #000;background:#000;overflow:hidden;box-shadow:0 0 0 2px #333}
.mobile-view iframe{width:100%;height:100%;border:0;background:var(--bg)}
.mobile-view button{position:absolute;top:16px;right:16px;padding:10px 16px;border-radius:999px;border:0;background:var(--note);font:700 .85rem/1 var(--f);cursor:pointer}
.embed .rv,.embed .wa-float{display:none}

/* rede de segurança: depois de 2s, o topo aparece mesmo que a animação não rode */
body.ready .hero .rise,body.ready .phone-wrap{animation:none;opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}.rv-in,.hero .rise,.phone-wrap{opacity:1;transform:none}}
</style>
