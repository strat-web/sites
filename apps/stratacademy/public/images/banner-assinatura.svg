      <circle cx="860" cy="150" r="186"/>
    </g>
    <rect width="1024" height="300" fill="url(#ba-aura)"/>
    <circle cx="860" cy="150" r="52" fill="#A8572E"/>

    <rect x="0" y="0" width="9" height="300" fill="#A8572E"/>

    <g transform="translate(56 66)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#A8572E"/>
      <text x="24" y="11" font-family="Rubik, system-ui, -apple-system, Segoe UI, sans-serif"
            font-size="19" font-weight="600" fill="#63615C">Strat Academy 2.0</text>
    </g>

    <text x="56" y="160" font-family="Rubik, system-ui, -apple-system, Segoe UI, sans-serif"
