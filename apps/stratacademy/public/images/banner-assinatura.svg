<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 300" width="1024" height="300" role="img" aria-label="Strat Academy 2.0 — comece de graça no Strat Hub">
  <defs>
    <linearGradient id="ba-fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFECE5"/>
      <stop offset="100%" stop-color="#F5F3EE"/>
    </linearGradient>
    <radialGradient id="ba-aura" cx="82%" cy="10%" r="72%">
      <stop offset="0%" stop-color="#D97A4A" stop-opacity=".30"/>
      <stop offset="70%" stop-color="#D97A4A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ba-quadro"><rect width="1024" height="300" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#ba-quadro)">
    <rect width="1024" height="300" fill="url(#ba-fundo)"/>

    <g fill="none" stroke="#D97A4A" stroke-opacity=".22" stroke-width="4">
