<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Quanto custa?","acceptedAnswer":{"@type":"Answer","text":"Depende das frentes que você contrata e do tamanho da operação. No diagnóstico a gente entende o seu caso e passa um valor fechado."}},{"@type":"Question","name":"Em quanto tempo eu vejo resultado?","acceptedAnswer":{"@type":"Answer","text":"Os primeiros números aparecem nas primeiras semanas de campanha, e a partir deles a gente ajusta. Campanha estabilizada costuma levar de 60 a 90 dias."}},{"@type":"Question","name":"Qual a verba mínima para anunciar?","acceptedAnswer":{"@type":"Answer","text":"Recomendamos a partir de R$ 1.500 por mês em anúncios, e o ideal depende do segmento e da meta. Já tivemos cliente com resultado usando R$ 1.000 por mês."}},{"@type":"Question","name":"Tem contrato de fidelidade?","acceptedAnswer":{"@type":"Answer","text":"Trabalhamos com contrato inicial de 3 meses, que é o tempo de montar, testar e estabilizar a campanha. Depois disso, renovação mensal."}},{"@type":"Question","name":"Como eu acompanho o que está acontecendo?","acceptedAnswer":{"@type":"Answer","text":"Relatório de desempenho direto no grupo de WhatsApp da sua empresa com a gente, com os números que importam: agendamentos, custo por resultado e conversão. E uma reunião por mês."}},{"@type":"Question","name":"Vocês usam IA no lugar de pessoas?","acceptedAnswer":{"@type":"Answer","text":"Não. Quem cuida da sua conta é gente: gestor de tráfego, designer, editor de vídeo. A IA entra para acelerar o trabalho e para atender o lead na hora, não para substituir o time."}},{"@type":"Question","name":"Vocês atendem o meu segmento?","acceptedAnswer":{"@type":"Answer","text":"Já trabalhamos com restaurantes, imobiliárias, e-commerce, indenizações, moda, academias, cosméticos, franquias e joalherias. Se o seu segmento não está na lista, conta pra gente no formulário."}}]}</script>
