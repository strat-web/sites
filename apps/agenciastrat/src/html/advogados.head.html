:root{
  --bg-2:#f1f0eb;
  --ink:#161616; --ink-soft:#3A3F46; --muted:#6B7078;
  --line:#E7E4DC; --line-strong:#D6D2C6; --bg:#FFFFFF; --err:#B42318;
  /* Curso: fonte Lato, fundo branco, cores do nicho (advocacia: marinho, vinho, dourado sóbrio) */
  --font-sans:'Lato',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'Lato',system-ui,sans-serif;
  /* "green" = cor de ação (mantido o nome para não mexer no CSS todo) */
  --green:#1F2A44; --green-deep:#141C30; --green-tint:#E9ECF3;
  --wine:#7A1F2B; --gold:#B08D57;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.progress{position:fixed;top:0;left:0;right:0;height:4px;background:var(--bg-2);z-index:20}
.progress[hidden]{display:none}
.progress i{display:block;height:4px;width:0;background:linear-gradient(90deg,var(--green),var(--gold)) 0 0/100vw 100% no-repeat;transition:width .45s ease}
main{max-width:680px;margin:0 auto;padding:calc(clamp(40px,9vh,92px) + env(safe-area-inset-top,0px)) 24px 0}
.screen{animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.cover h1{font-size:clamp(27px,5vw,37px);font-weight:500;line-height:1.24;letter-spacing:-.025em;margin:0 0 28px}
.cover h1 strong{font-weight:900;color:var(--wine)}
.cover ul{list-style:none;padding:0;margin:0 0 30px;display:grid;gap:11px}
.cover li{display:flex;gap:10px;font-size:17px;line-height:1.5;color:var(--muted)}
.cover li strong{color:var(--ink-soft);font-weight:700}
.cover .note{font-style:italic;color:var(--muted);font-size:15.5px;line-height:1.65;margin:0;max-width:56ch}

.top{display:flex;align-items:center;gap:8px;margin-bottom:22px}
.badge{min-width:26px;height:26px;padding:0 7px;border-radius:5px;background:var(--green);
  color:#fff;font-family:var(--font-mono);font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.req{color:#D14343;font-size:14px}
.back{margin-left:auto;background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;padding:6px 4px;border-radius:4px}
.back:hover{color:var(--ink)}
h1.q{font-weight:500;font-size:clamp(23px,4.2vw,30px);line-height:1.32;letter-spacing:-.025em;margin:0 0 12px;max-width:30ch}

.sub{color:var(--muted);font-size:16px;line-height:1.6;margin:0}
.field{margin-top:34px}
.field input{width:100%;border:0;border-bottom:2px solid var(--green);background:transparent;font:inherit;

.field input::placeholder{color:#A6AAB1}
.field input:focus{border-bottom-color:var(--green-deep)}
.err{color:var(--err);font-size:14px;margin-top:12px;min-height:20px}
.cookies{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;max-width:656px;
  margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;

.cookies a{color:inherit;text-decoration:underline}
.cookies .acoes{display:flex;gap:8px;margin-top:10px}
.cookies button{flex:1;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-weight:700;
  padding:10px 12px;cursor:pointer;color:var(--ink)}
.cookies button.sim{background:var(--green);border-color:var(--green);color:#fff}
.legal{color:var(--muted);font-size:13px;line-height:1.55;margin:14px 0 0}
.legal a{color:inherit;text-decoration:underline}

.opts{display:grid;gap:10px;margin-top:30px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;

.cal{margin-top:28px;border:1px solid var(--line);border-radius:14px;padding:18px 16px 20px}

  padding:9px 8px;text-align:center;cursor:pointer;font:inherit;color:var(--ink)}
.day .wd{display:block;font-family:var(--font-mono);font-size:12px;color:var(--muted);text-transform:capitalize}

.day[aria-pressed="true"]{border-color:var(--green);background:var(--green-tint)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slot{border:1px solid var(--line);border-radius:8px;background:#fff;padding:11px 0;font:inherit;font-weight:600;
  font-size:15px;color:var(--ink);cursor:pointer}
.slot:hover{border-color:var(--line-strong)}
.slot[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.picked{margin:16px 0 0;font-size:15px;color:var(--ink-soft);min-height:22px}
.picked strong{color:var(--ink)}
.empty{color:var(--muted);font-size:15px;margin:0}
.code{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 6px;padding:16px 18px;
  border:1px dashed var(--line-strong);border-radius:10px;background:#fff}
.code b{font-family:var(--font-mono);font-size:26px;letter-spacing:.18em;color:var(--ink)}
.code button{border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-weight:700;font-size:14px;
  padding:9px 14px;cursor:pointer;color:var(--ink)}
.steps{margin:18px 0 0;padding-left:20px;color:var(--ink-soft);font-size:16px;line-height:1.7}

.ag-confirm{margin-top:28px;border:1px solid var(--line);border-radius:14px;padding:18px 16px 20px}
.ag-confirm .quando{font-size:19px;font-weight:700;margin:0 0 4px;color:var(--ink)}
.ag-confirm .field{margin-top:18px}
.ag-link{background:none;border:0;padding:6px 0;margin-top:12px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer;text-decoration:underline}
.ag-aviso{margin:20px 0 0;padding:12px 14px;border-radius:10px;background:#FDF3F2;color:var(--err);font-size:15px;line-height:1.5}
.ag-alt{margin:16px 0 0;font-size:14px;color:var(--muted);line-height:1.55}
.ag-alt a{color:inherit;text-decoration:underline}
.cta[disabled]{opacity:.65;cursor:progress}

.final h1{font-size:clamp(26px,5vw,34px);font-weight:700;letter-spacing:-.025em;line-height:1.2;margin:0 0 18px}
.final p{color:var(--muted);font-size:17px;line-height:1.65;margin:0 0 14px;max-width:56ch}
.final p strong{color:var(--ink)}

/* Botão logo abaixo do conteúdo, alinhado com as perguntas (não fica preso no rodapé) */
footer{max-width:680px;margin:0 auto;padding:30px 24px calc(40px + env(safe-area-inset-bottom,0px))}
footer[hidden]{display:none}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:0;border:0;
  border-radius:8px;background:var(--green);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:15px 20px;
  cursor:pointer;letter-spacing:.01em;text-decoration:none;box-shadow:0 8px 20px -10px rgba(20,28,48,.7);transition:background-color .15s}
.cta:hover{background:var(--green-deep)}
.cta svg{width:17px;height:17px;flex:none}
.hint{display:none;text-align:left;color:var(--muted);font-family:var(--font-mono);font-size:12px;margin:8px 0 0}
@media (hover:hover) and (pointer:fine){.hint{display:block}}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.field input:focus-visible{outline:none}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.progress i{transition:none}}
