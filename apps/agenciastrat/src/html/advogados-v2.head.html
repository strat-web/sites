<script>
/* =====================================================================
   CONFIGURAÇÃO: edite só este bloco
   Método: Funil Shark Scale (ver README.md). VERSÃO 2 (teste A/B com a v1 em ../): mesma agenda, mesmo MetricaaS
   ===================================================================== */
var NICHO_PADRAO = 'advogado';

var COMUM = {
  // MetricaaS: cria o lead, manda a CAPI, lê a agenda e manda confirmação e lembretes no WhatsApp (ADR 0062-0064)
  metricaasWorkspace: 'strat-marketing',  // slug do workspace (Agência Strat)
  metaPixelId: /[?&]nopixel/.test(location.search) ? '' : '1815630929780241', // PX-001 | Agência Strat (?nopixel desliga em testes)
  // Agenda NA PÁGINA (02/11/2026): a etapa 6 mostra os horários livres da agenda de quem atende e marca a reunião
  // com Meet e convite, pelo MetricaaS (mtc.agenda, ADR 0065). false = volta ao link da página de agendamento do Google.
  agendaNaPagina: true,
  // Link do Google só como reserva TEMPORÁRIA: se a agenda da página não responder (MetricaaS sem a reserva ligada,
  // conexão sem permissão, Google fora), a etapa 6 cai no link abaixo com o código, como antes. false = só o WhatsApp.
  agendaGoogleReserva: true,
  // WhatsApp do fallback da agenda, com a mensagem pronta com o nome e o código
  whatsappAgenda: '5547991658478',
  whatsappAgendaMessage: 'Olá! Sou {nome} e preenchi o formulário da Strat para advogados (código {codigo}). Quero marcar a conversa.',
  // Página de agendamento do Google Agenda de quem atende, com a pergunta "Código". Preencher antes de publicar.
  // No Business Starter cada pessoa tem UMA página: use a dela, com a pergunta opcional (sem código, o MetricaaS
  // casa pelo e-mail ou pelo telefone)
  agendaUrl: 'https://calendar.google.com/calendar/appointments/schedules/AcZssZ1aZQCxsVUhQLsROvDCXsIWX-PANTcSukNqq2PzclaVGBZHAHCdZMK2SkozLl7l7QigNY2d8SLn', // "Reunião com advogados" do Gabriel (gabriel.bocardo@stratai.com.br); o link curto calendar.app.google/N8deMmSkDqf1rDHA7 leva à mesma página
  // Política de privacidade da marca, linkada no passo do WhatsApp e no banner (portão A5 do processo-publicar)
  privacidadeUrl: 'https://agencia.stratai.com.br/politica-de-privacidade',
  // Banner de cookies: no app quem decide é o campo consentimento da linha no catalogo/sites.json (off desde 02/11,
  // decisão do Helbert), e o banner, quando houver, é o do kit (WEB-24). Fica false: true desenharia o banner antigo
  // da página sem segurar o pixel, que agora vem do <Tracking>.
  consentimentoPixel: false,
  // Rodapé (laudo LP-agencia-strat-20261031-02, item 6): razão social e CNPJ do anunciante. Vazio = o rodapé mostra só
  // a marca e a política. Cadastro de comercial/config/strat.json, CNPJ confirmado pelo Helbert em 02/11/2026.
  razaoSocial: '54.740.945 GABRIEL BOCARDO DE OLIVEIRA',
  cnpj: '54.740.945/0001-79',
  fotoTime: { base:'/midia/time/time-agencia', alt:'Três pessoas do time da Agência Strat, de camiseta preta, em frente a um quadro com anotações',
    vertical:'Quem cuida da sua conta', titulo:'Quem cuida da sua conta é gente', legenda:'Time da Agência Strat · Joinville/SC' },
  whatsappNumber: '554831994338',        // WhatsApp da Strat (SDR); é também o número que manda confirmação e lembretes
  whatsappMessage: 'Olá{nome}! Preenchi o formulário da Strat e quero conversar sobre tráfego pago.'
};

var NICHOS = {
  advogado: {
    niche: 'advogado', formName: 'Strat | Marketing para advogados',
    // Copy da v2 com o laudo LP-agencia-strat-20261031-02 aplicado: itens 1 (CTA), 2, 3 (headline), 4, 5, 8 e 10.
    // Ainda precisa do laudo -03 antes de anúncio apontar para cá (ver README).
    cover: {
      eyebrow: 'Agência Strat · marketing para advocacia',
      headline: 'Anúncios informativos que aproximam o seu escritório de <span class="box">quem procura</span>',
      lead: 'Cuidamos do tráfego pago do escritório no Meta e no Google, com anúncios revisados pelo Provimento 205 da OAB e medição do clique até a conversa.',
      cta: 'QUERO SABER COMO FUNCIONA',
      micro: '5 perguntas rápidas · no fim, você escolhe o horário da conversa',
      pontos: [
        {icon:'shield', t:'Revisão pelo Provimento 205', d:'Anúncios informativos, revisados pelas regras de publicidade da advocacia.'},
        {icon:'chart', t:'Medição do clique até a conversa', d:'Você acompanha quanto custa cada conversa e quais anúncios a trouxeram.'},
        {icon:'phone', t:'O interessado chama no seu WhatsApp', d:'A conversa é direto com o escritório, sem intermediário.'},
        {icon:'list', t:'Formulário com as suas perguntas', d:'Você define o que perguntar antes do primeiro contato.'}
      ],
      note: 'Para escritórios dispostos a investir a partir de <strong>R$&nbsp;2.000/mês</strong> em anúncios (verba paga direto às plataformas, fora o nosso trabalho).'
    },
    texts: {
      instagramQ: 'Qual é o @ do Instagram do seu escritório?',
      revenueQ: 'Qual é o faturamento médio mensal do seu escritório?',
      investYes: 'Sim, tenho essa verba',
      investNo: 'Não, por enquanto não'
    }
  }
};

var _n = new URLSearchParams(location.search).get('nicho') || NICHO_PADRAO;
window.FORM_CONFIG = Object.assign({}, COMUM, NICHOS[_n] || NICHOS[NICHO_PADRAO]);
document.title = window.FORM_CONFIG.formName;
// A tag do MetricaaS (m.js, com o pixel) vem do <Tracking> do kit, pela linha do catálogo (WEB-24); o ?nopixel saiu.
</script>
<style>
/* Fontes do próprio app (public/fontes/, licença OFL ao lado), no lugar da folha do Google, que bloqueava a renderização (WEB-24, como no WEB-87). Arquivos variáveis do mesmo subset latin que o Google servia: um arquivo cobre todos os pesos. */
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:400 700;font-display:swap;src:url("/fontes/space-grotesk-latin.woff2") format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:400 700;font-display:swap;src:url("/fontes/jetbrains-mono-latin.woff2") format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
:root{
  /* Design System Agência Strat v1.0 (papel, tinta, degrau, Space Grotesk + JetBrains Mono) com a paleta da v1 (advocacia:
     marinho como cor de ação, vinho e dourado sóbrio nos detalhes). Vermelho = frente tráfego pago (DS) só no degrau. */
  --bg:#fafaf7; --bg-2:#f1f0eb; --card:#ffffff; --line:#e4e2db; --line-2:#cfccc2;
  --ink:#1e1e1c; --ink-2:#55544e; --mute:#8a887f; --dark:#191919; --err:#B42318;
  --navy:#1F2A44; --navy-deep:#141C30; --navy-tint:#E9ECF3; --wine:#7A1F2B; --gold:#B08D57;
  --lime:#c6ff34; --purple:#bb44f2; --blue:#57a1ea; --red:#ff1f1f;
  --stack:-3px 3px 0 var(--lime),-6px 6px 0 var(--purple),-9px 9px 0 var(--blue),-12px 12px 0 var(--red);
  --stack-sm:-2px 2px 0 var(--lime),-4px 4px 0 var(--purple),-6px 6px 0 var(--blue),-8px 8px 0 var(--red);
  --font-sans:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --focus-ring:0 0 0 2px #fafaf7,0 0 0 4px #1e1e1c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
img{max-width:100%;display:block}
button{font-family:inherit}

/* ── topo ── */
.topo{position:sticky;top:0;z-index:15;background:rgba(250,250,247,.94);backdrop-filter:saturate(1.2) blur(8px);-webkit-backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line)}
.topo .in{max-width:1120px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:12px}
.topo .marca img{height:30px;width:auto}
.topo .rot{margin-left:auto;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.trilha{max-width:680px;margin:0 auto;padding:0 16px 12px;display:flex;align-items:center;gap:0;list-style:none}
.trilha[hidden]{display:none}
.trilha li{display:flex;align-items:center;flex:1 1 0;min-width:0}
.trilha li:last-child{flex:0 0 auto}
.trilha .p{flex:none;width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line-2);background:var(--card);color:var(--mute);display:grid;place-items:center;transition:background-color .25s,border-color .25s,color .25s}
.trilha .p svg{width:16px;height:16px}
.trilha .t{flex:1;height:2px;margin:0 6px;background:var(--line);border-radius:2px;overflow:hidden}
.trilha .t i{display:block;height:100%;width:0;background:var(--navy);transition:width .4s ease}
.trilha li.feito .p{background:var(--navy);border-color:var(--navy);color:#fff}
.trilha li.feito .t i{width:100%}
.trilha li.atual .p{border-color:var(--navy);color:var(--navy);box-shadow:0 0 0 4px var(--navy-tint)}
.passo-rot{max-width:1120px;margin:0 auto;padding:0 16px 10px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.passo-rot[hidden]{display:none}

main{flex:1;width:100%;max-width:680px;margin:0 auto;padding:28px 16px 0}
main.larga{max-width:1120px}
.screen{animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── capa ── */
.capa{display:grid;gap:26px;grid-template-areas:"texto" "foto" "pontos" "nota"}
.capa-texto{grid-area:texto}
.eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.eyebrow::before{content:"";width:22px;height:4px;background:var(--red);box-shadow:-2px 2px 0 var(--lime),-4px 4px 0 var(--purple)}
.capa h1{font-size:clamp(30px,7.4vw,46px);text-wrap:balance;font-weight:700;line-height:1.08;letter-spacing:-.035em;margin:0 0 16px}
.box{display:inline-block;white-space:nowrap;background:var(--navy);color:#fff;padding:0 .16em;box-decoration-break:clone;-webkit-box-decoration-break:clone;box-shadow:var(--stack-sm)}
.lead{font-size:17px;line-height:1.6;color:var(--ink-2);margin:0 0 22px;max-width:52ch}
.micro{margin:10px 0 0;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.04em;color:var(--ink-2)}
.capa-foto{grid-area:foto;margin:0 0 0 12px;position:relative;border-radius:18px;overflow:hidden;box-shadow:var(--stack);background:var(--dark);aspect-ratio:4/5;max-height:560px}
.capa-foto img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.capa-foto figcaption{position:absolute;left:0;right:0;bottom:0;padding:48px 18px 16px;color:#fff;background:linear-gradient(180deg,rgba(20,28,48,0) 0%,rgba(20,28,48,.88) 62%)}
.capa-foto figcaption b{display:block;font-size:18px;letter-spacing:-.01em}
.capa-foto figcaption span{display:block;font-size:13.5px;opacity:.86;margin-top:3px}
.capa-foto .vert{position:absolute;top:16px;right:14px;writing-mode:vertical-rl;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.18em;color:rgba(255,255,255,.7);text-transform:uppercase}
.pontos{grid-area:pontos;list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pontos li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.pontos .ic{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--navy-tint);color:var(--navy)}
.pontos .ic svg{width:18px;height:18px}
.pontos b{display:block;font-size:15.5px;letter-spacing:-.01em}
.pontos span{display:block;font-size:14px;color:var(--ink-2);line-height:1.45;margin-top:2px}
.nota-wrap{grid-area:nota}
.nota{margin:0;font-size:14px;line-height:1.55;color:var(--ink-2);border-left:3px solid var(--gold);padding:2px 0 2px 12px}
.selos{display:flex;gap:10px;margin-top:14px}
.selos img{height:34px;width:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
@media (min-width:900px){
  main.larga{padding-top:44px}
  .capa{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);column-gap:56px;row-gap:22px;grid-template-areas:"texto foto" "pontos foto" "nota foto";align-items:start}
  .capa-foto{grid-row:1 / span 3;margin:0 0 0 12px}
  .pontos{grid-template-columns:1fr 1fr}
}

/* ── perguntas ── */
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.q-ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:var(--stack-sm);margin-left:8px}
.q-ic svg{width:20px;height:20px}
.q-num{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.back{margin-left:auto;background:none;border:0;color:var(--ink-2);font:inherit;font-size:14px;cursor:pointer;padding:8px 4px;border-radius:6px}
.back:hover{color:var(--ink)}
h1.q{font-weight:700;font-size:clamp(24px,5.2vw,32px);line-height:1.2;letter-spacing:-.03em;margin:0 0 10px;max-width:30ch}
h1.q strong{font-weight:700;background:linear-gradient(transparent 62%,rgba(176,141,87,.32) 62%)}
.sub{color:var(--ink-2);font-size:16px;line-height:1.6;margin:0}
.porque{display:flex;gap:8px;align-items:flex-start;margin:14px 0 0;padding:10px 12px;border-radius:10px;background:var(--bg-2);color:var(--ink-2);font-size:14px;line-height:1.5}
.porque svg{flex:none;width:16px;height:16px;margin-top:2px;color:var(--gold)}
.field{margin-top:26px}
.field input{width:100%;border:1.5px solid var(--line-2);background:var(--card);font:inherit;font-size:18px;padding:14px 16px;color:var(--ink);outline:none;border-radius:10px;transition:border-color .15s,box-shadow .15s}
.field input::placeholder{color:#A6AAB1}
.field input:focus{border-color:var(--navy);box-shadow:0 0 0 4px var(--navy-tint)}
.err{color:var(--err);font-size:14px;margin-top:10px;min-height:20px}
.legal{color:var(--ink-2);font-size:13px;line-height:1.55;margin:12px 0 0}
.legal a{color:inherit;text-decoration:underline}
.opts{display:grid;gap:10px;margin-top:24px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:15px 16px;font:inherit;font-size:16px;color:var(--ink);cursor:pointer;transition:border-color .15s,background-color .15s,transform .15s}
.opt:hover{border-color:var(--line-2);transform:translateY(-1px)}
.opt .key{flex:none;width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg-2);font-family:var(--font-mono);font-size:13px;font-weight:700;display:grid;place-items:center;color:var(--ink-2)}
.opt[aria-checked="true"]{border-color:var(--navy);background:var(--navy-tint)}
.opt[aria-checked="true"] .key{background:var(--navy);border-color:var(--navy);color:#fff}

/* ── agenda ── */
.cal{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px 20px;box-shadow:var(--stack);margin-left:12px}
.cal-h{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 12px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.day{flex:none;scroll-snap-align:start;min-width:66px;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:9px 6px;text-align:center;cursor:pointer;font:inherit;color:var(--ink)}
.day .wd{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--ink-2);text-transform:uppercase}
.day .dn{display:block;font-size:22px;font-weight:700;line-height:1.15;margin-top:2px}
.day .mo{display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
.day[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.day[aria-pressed="true"] .wd,.day[aria-pressed="true"] .mo{color:rgba(255,255,255,.8)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slot{border:1.5px solid var(--line-2);border-radius:10px;background:#fff;padding:12px 0;font:inherit;font-weight:700;font-size:16px;color:var(--ink);cursor:pointer;transition:border-color .15s,background-color .15s}
.slot:hover{border-color:var(--navy);background:var(--navy-tint)}
.picked{display:flex;gap:8px;align-items:center;margin:16px 0 0;font-size:14px;color:var(--ink-2)}
.picked svg{width:16px;height:16px;color:var(--navy)}
.empty{color:var(--ink-2);font-size:15px;margin:18px 0 0}
.ag-confirm{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px 20px;box-shadow:var(--stack);margin-left:12px}
.ag-confirm .quando{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px;color:var(--ink)}
.ag-confirm .field{margin-top:16px}
.ag-link{background:none;border:0;padding:6px 0;margin-top:8px;font:inherit;font-size:14px;color:var(--ink-2);cursor:pointer;text-decoration:underline}
.ag-aviso{margin:18px 0 0;padding:12px 14px;border-radius:10px;background:#FDF3F2;color:var(--err);font-size:15px;line-height:1.5}
.ag-alt{margin:14px 0 0;font-size:14px;color:var(--ink-2);line-height:1.55}
.ag-alt a{color:inherit;text-decoration:underline}
.code{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 6px;padding:16px 18px;border:1.5px dashed var(--line-2);border-radius:12px;background:#fff}
.code b{font-family:var(--font-mono);font-size:26px;letter-spacing:.18em;color:var(--ink)}
.code button{border:1px solid var(--line-2);border-radius:10px;background:#fff;font:inherit;font-weight:700;font-size:14px;padding:9px 14px;cursor:pointer;color:var(--ink)}
.steps{margin:16px 0 0;padding-left:20px;color:var(--ink-2);font-size:16px;line-height:1.7}

/* ── telas finais ── */
.final .selo-ok{width:56px;height:56px;border-radius:16px;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:var(--stack-sm);margin:0 0 20px 8px}
.final .selo-ok svg{width:28px;height:28px}
.final h1{font-size:clamp(28px,6vw,38px);font-weight:700;letter-spacing:-.03em;line-height:1.15;margin:0 0 14px}
.final p{color:var(--ink-2);font-size:17px;line-height:1.65;margin:0 0 14px;max-width:56ch}
.final p strong{color:var(--ink)}
.final p a{color:var(--ink)}
.agora{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:10px;counter-reset:a}
.agora li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px;line-height:1.5;color:var(--ink-2)}
.agora li::before{counter-increment:a;content:"0" counter(a);flex:none;font-family:var(--font-mono);font-weight:700;font-size:12px;color:var(--navy);background:var(--navy-tint);border-radius:7px;padding:4px 7px}
.agora b{color:var(--ink)}

/* ── botão ── */
footer#foot{width:100%;max-width:680px;margin:0 auto;padding:26px 16px calc(28px + env(safe-area-inset-bottom,0px))}
footer#foot[hidden]{display:none}
